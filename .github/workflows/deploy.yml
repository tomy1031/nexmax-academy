name: デプロイ

# STG と 本番への反映を GitHub 側で完結させる。
#
# なぜ必要か:
#   デプロイに Cloudflare の鍵が要るため、鍵を持たない環境（AIのセッション等）からは
#   `npm run cf:staging` を実行できず、**ユーザーが毎回 手で叩く**ことになっていた。
#   これは「ユーザーは PR・マージをしない（クライアント方式）／AI が STG 更新まで
#   進める」という運用（AGENTS.md・docs/constraints.md）と食い違う。
#   鍵を GitHub の Secrets に1度だけ預ければ、以後の反映はここが受け持つ。
#
# 使い方（2026-08-27 に 統合ブランチ運用へ 変更）:
#   - **STG は `integration` の中身**。作業ブランチを `integration` へ マージした
#     時点で 自動更新される。STG で 確かめてから main へ 昇格する、という 順番を
#     作るため（それまでは main しか 載せられず、STG が 門番に なって いなかった）。
#   - **本番は `main` の中身**。授業のある **火・水・金 17:05 ICT** に、
#     `integration` を main へ 早送りしてから 自動で 出る（授業は 17:30 ICT）。
#     cron は UTC なので `5 10 * * 2,3,5`。
#   - 緊急の 直しは 手動（Actions タブ → このワークフロー → Run workflow → production）。
#
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   - CLOUDFLARE_API_TOKEN         … Workers のデプロイ権限を持つトークン
#   - NEXT_PUBLIC_SUPABASE_URL     … ビルド時に**バンドルへ埋まる**公開値
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY … 同上（`wrangler secret` では手遅れ）
#   - CLOUDFLARE_ACCOUNT_ID        … 任意（トークンが複数アカウントに通るときだけ）
#
# **秘密鍵（SUPABASE_SERVICE_ROLE_KEY・GEMINI_API_KEY）はここに渡さない。**
# 渡すと OpenNext がバンドルへ焼き込む。`scripts/check_build_env.mjs` が検査して
# ビルドを止めるので、うっかり足しても本番には出ない（ガードを外さないこと）。

on:
  push:
    branches: [integration]
  # 授業のある日（火・水・金）の 授業前に **何回か 起きる**。
  #
  # **1本に しない**（2026-08-29 に 5本へ 増やした）。2026-08-28（金）に 唯一の cron
  # `5 10 * * 2,3,5`（＝17:05 ICT）が **11時間5分 遅れて** 21:10 UTC に 届き、
  # 授業に 間に合わなかった。届いた あとの ラン（33211372267）は 成功して いるので
  # 設定ミスでは なく、**GitHub が 時刻に 配らなかった**。GitHub 自身が こう 書いている:
  #
  #   "The schedule event can be delayed during periods of high loads of GitHub Actions
  #    workflow runs. ... If the load is sufficiently high enough, some queued jobs may
  #    be dropped. High load times include the start of every hour."
  #
  # つまり **cron 1本は 起動役として 信用できない**。混む「毎時の頭」も 避けて、
  # どの 分も :12 以降に 置いてある。
  #
  # **5本 起きても、出るのは 必要な ときだけ 1回。** 下の「出す必要が あるか 決める」が
  # 本番の `/api/version` を 見て 判断し、空振りの ランは 1分ほどで 終わって
  # **KV を 1件も 使わない**（1回の 本番デプロイ ＝ 約75件 / 枠 1000件/日。§0.6）。
  # 5本 ぜんぶが 落ちない かぎり、授業には 間に合う。
  #
  # ビルドから 検証まで 6〜10分 なので、最後の 17:12 ICT でも 授業（17:30）に 入る。
  #
  # **main を push のトリガーに 足さない。** 下の「本番へ 昇格」が main を 進めるので、
  # 足すと 昇格のたびに STG 用の ランが もう1本 立ち上がる（GITHUB_TOKEN の push は
  # ワークフローを 起こさない ので 実際には 起きないが、その 挙動に 頼らない）。
  schedule:
    - cron: "12 9 * * 2,3,5" # 16:12 ICT
    - cron: "26 9 * * 2,3,5" # 16:26 ICT
    - cron: "38 9 * * 2,3,5" # 16:38 ICT
    - cron: "51 9 * * 2,3,5" # 16:51 ICT
    - cron: "12 10 * * 2,3,5" # 17:12 ICT（最後の 1本）
  # 手動で 回すときは **ref に 気を つける**。
  #   production … ref=main（本番の 配信元）
  #   staging    … ref=integration（STG の 配信元）。main の ref で staging を 選ぶと
  #                `preview_alias.mjs` が 止める——STG に main を 載せると、
  #                integration に 溜まって いる 確認前の 作業が 消える ため。
  workflow_dispatch:
    inputs:
      target:
        description: どこへ出すか（production は ref=main / staging は ref=integration）
        type: choice
        options:
          - staging
          - production
        default: staging

# 同じ行き先へ同時に上げない（あとから上げたほうが前のを消す事故を防ぐ）。
#
# **`github.event.inputs.target || 'staging'` では schedule が 壊れる。**
# schedule には inputs が 無いので null → 'staging' に 落ちるが、実体は 本番である。
# 本番の ランが 2本 走っても 互いを 待たない、という 一番 まずい 形になる。
# そこで **どの イベントで 起きたか**から 行き先を 決める。
concurrency:
  group: deploy-${{ (github.event_name == 'schedule' || github.event.inputs.target == 'production') && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 鍵は **Environment「Preview」** に置いてある（Settings → Environments）。
    # ここで名指ししないと、リポジトリ直下の Secrets しか見えず、
    # 「Secrets が足りません」で止まる（2026-08-14 に実発生。名前は3つとも正しかった）。
    #
    # 承認は増えない: この Environment には Required reviewers も Wait timer も
    # 付いていない（Deployment branches and tags も No restriction）。
    # 統合ブランチからも そのまま 見える（2026-08-27 に API で 実物を 確認）。
    environment: Preview
    # schedule のときだけ `integration` → `main` を 早送りするので、書き込みが要る。
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      # preview_alias.mjs は HEAD と origin/integration を**中身で**比べるので、
      # 浅いクローンだと判定できない（fetch-depth: 0 が要る）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── 出すものを integration に そろえる（schedule のときだけ）
      #
      # schedule の ランは 既定ブランチ（main）の HEAD で 始まるので、そのままでは
      # **integration に 溜めた 変更が 1つも 載らない**。ここで integration の
      # コミットへ 移ってから ビルドする。
      #
      # main の 早送り（push）は **ここでは しない**。検査（単体テスト・DB）を
      # 通してから、本番へ 出す 直前に 行う（下の「main を 早送りする」）。
      # 赤い ものを main に 進めてしまわない ため。
      #
      # 早送りに ならない とき（main にだけ ある コミットが 残っている ＝ 緊急修正の
      # 戻しマージ 忘れ）は、ここで 止めて 人に 知らせる。黙って 進めると その 直しが
      # 消える。止まっても 本番は 前の版の まま（安全側）。
      - name: integration を 取り込む（schedule のみ）
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          git fetch origin integration main --quiet
          integration=$(git rev-parse origin/integration)
          main=$(git rev-parse origin/main)
          echo "integration = $integration"
          echo "main        = $main"

          if [ "$integration" != "$main" ] && ! git merge-base --is-ancestor "$main" "$integration"; then
            echo "::error::main に integration へ 入って いない コミットが あります。早送りできません。"
            echo "::error::緊急修正を main へ 入れた あとの **main → integration 戻しマージ**が 済んで いない はずです。"
            echo "::error::integration で \`git merge origin/main\` を してから、もう一度 出してください。"
            exit 1
          fi

          git checkout --quiet --detach "$integration"

      # どの コミットを 出すのかを 1か所で 決める。
      #
      # **`github.sha` を 使わない。** schedule では `github.sha` が 昇格前の main を
      # 指したままで、ビルドが 焼き込む SHA（`git rev-parse HEAD` — next.config.ts）と
      # 食い違う。最後の 突き合わせが 永久に 一致しなくなるので、**実際の HEAD**を 使う。
      - name: 出すコミットを 決める
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ── 出す必要が あるか 決める（schedule のみ）
      #
      # cron を 5本に した ので、**そのまま だと 1日 5回 本番へ 出て しまう**。
      # 1回の 本番デプロイは KV へ 約75件 書き、枠は 1000件/日。授業中の ISR で
      # 240〜480件 使う ことも あるので、5回 出すと その日の 夕方に 枠が 尽きて
      # 「出せば 出すほど 壊れる」状態に なる（docs/deploy.md §0.6・§0.9）。
      #
      # そこで **本番自身に 聞く**。`/api/version` は ビルド時の コミットSHA と 時刻を
      # 返す（next.config.ts）ので、状態を どこにも 保存せずに 判断できる。
      #
      #   出す  … 中身が 違う（本番の sha ≠ これから 出す sha）
      #           かつ 前の ビルドから 30分 以上 たって いる
      #   出さない … それ以外（1分ほどで ランが 終わる。KV は 0件）
      #
      # 「30分」は **授業前に 2回まで**に 抑える ための 間隔。5本の cron は
      # 16:12〜17:12 の 60分間に 並べて あるので、最初の 1本で 出て、その後に
      # 教材が 入れば もう 1回だけ 追いつく（最大 2回 ＝ 約150件）。
      #
      # **取れない ときは 出す**（fail-open）。本番が 落ちて いる・URL が 変わったと
      # いった 場合に 黙って 出さなく なる ほうが 害が 大きい。
      #
      # 手動の dispatch には この 判定を **かけない**。緊急の 道（授業当日の 事故）で
      # 「30分 たって いないので 出しません」と 言われては 困る。
      #
      # 規則の 本体は `scripts/lib/should_deploy.mjs`（単体テストあり）。
      # **シェルで 書かない。** 最初 `date -u -d "$built_at"` で 書いたが、
      # これは GNU date でしか 動かず、手もと（macOS）では 黙って 0 に なっていた。
      # 「時刻を 読みちがえても それらしく 動いて しまう」たぐいの 穴なので、
      # 読めない ことを はっきり 扱える ところへ 出して、テストで 固める。
      #
      # ここは `npm ci` の **前**に 置く（空振りの ランを 1分で 終わらせる ため）。
      # 依存を 使わない 素の Node だけで 動くように 書いてある。
      - name: 出す必要が あるか 決める（schedule のみ）
        id: need
        if: github.event_name == 'schedule'
        env:
          DEPLOY_SHA: ${{ steps.rev.outputs.sha }}
          QUIET_MINUTES: "30"
        run: node scripts/check_should_deploy.mjs

      # 以降の 重い 工程は、schedule の 空振りでは 全部 とばす。
      # `needed` は schedule のとき だけ 入る ので、push と dispatch は これまで どおり。
      - name: 出さないので ここで 終わり
        if: github.event_name == 'schedule' && steps.need.outputs.needed != 'true'
        run: echo "::notice::本番は 最新です。何も せずに 終わります（KV 0件）。"

      # 足りないときは「いま登録されている名前」も出す。
      # 名前の打ちまちがい（CLOUDFLARE_TOKEN / SUPABASE_URL など）や、Variables 側・
      # Environment 側へ入れてしまった場合、「足りません」だけでは原因が見えないため。
      # **出すのは名前だけ**（`keys[]`）。値は1文字も出さない。
      - name: 鍵と公開値がそろっているか
        if: github.event_name != 'schedule' || steps.need.outputs.needed == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SECRET_NAMES: ${{ toJSON(secrets) }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$SUPABASE_URL" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$SUPABASE_ANON" ] || missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "── いま このリポジトリに 登録されている Secret の名前（値は出しません）──"
            printf '%s' "$SECRET_NAMES" | jq -r 'keys[]' | sed 's/^/  - /'
            echo "───────────────────────────────────────────────"
            echo "::error::Secrets が足りません:$missing — 名前が1文字でも違うと 見つかりません。上の一覧と 見くらべてください。"
            exit 1
          fi
          echo "✓ 鍵と公開値はそろっています"

      # postinstall で pdf.js の実体を public/ へ写す（スライド教材が使う）
      - name: npm ci
        if: github.event_name != 'schedule' || steps.need.outputs.needed == 'true'
        run: npm ci

      # 赤いものをそのまま出さないための最後の関所（数秒で終わる）
      - name: 単体テスト
        if: github.event_name != 'schedule' || steps.need.outputs.needed == 'true'
        run: npm test

      # DBが遅れたまま本番へ出さない（2026-08-26 の事故）。
      #
      # 移行SQLは integration への push で「デプロイ（DB）」が自動で流す。ここで見るのは
      # **それが落ちていた場合**である。コードだけ先に載ると、DBが受け付けない機能が
      # 黙って何もしない状態になり、画面にも CI にも何の印も出ない。
      # 実際にそれで7人が先生の名簿から消えていた。
      #
      # 本番のときだけ見る。STG（push）で見ないのは、同じ push で走っている
      # 「デプロイ（DB）」とどちらが先に終わるか決まらないため——ここで落とすと、
      # 正しく流れている途中でも赤くなる。**本番は STG より あとに 出る**ので、
      # その頃には 済んでいる（統合ブランチ運用では ここが さらに 確実になった。
      # DB は integration の 時点で 流れる ＝ 常に コードより 先）。
      #
      # `--strict` を **付けない**。付けると、鍵（SUPABASE_DB_URL）を登録するまで
      # 本番デプロイが止まる——**見張りを足したせいでデプロイが止まる**のは本末転倒で、
      # 鍵が無い間は この見張りを足す前と同じ状態でしかない。流し忘れが**見つかった**
      # ときは `--strict` の有無に関わらず落ちる（それは分かっている事実だから）。
      # 鍵を入れた瞬間に、ここは自動で本当の関所になる。
      - name: DBが追いついているか（本番のみ）
        if: (github.event_name == 'schedule' || github.event.inputs.target == 'production') && (github.event_name != 'schedule' || steps.need.outputs.needed == 'true')
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/check_migrations.mjs

      # STG は `integration` への push で 自動更新される。
      # `if:` は **ブランチ名を 見ていない**ので、配信元を 移しても そのまま 追随する。
      #
      # **STG の デプロイは KV へ 1件も 書かない**（2026-08-27 から）。
      # 統合ブランチ運用で 更新が 頻繁になるため、1回 約70件 × 1日十数回で
      # 無料枠（書き込み 1000件/日）を 食い潰し、その日の 本番が
      # 作りおきゼロで 出る——という 事故（2026-08-26）を 構造から 断つ。
      # 代わりに STG は 開いたページから 後追いで 温まる（初回だけ 1〜2秒 遅い）。
      - name: STG へ反映
        if: github.event_name == 'push' || github.event.inputs.target == 'staging'
        run: npm run cf:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # ── main を 早送りする（schedule のときだけ・検査を 通した あと）
      #
      # 本番の 配信元は main。ここで main を「いま 出す コミット」に 進めておくと、
      # 本番URL・main・`/api/version` の 3つが 常に そろう（handoff の 見張りが
      # 効くのは この 性質の おかげ）。
      #
      # `git push origin <sha>:refs/heads/main` に **force を 付けない**。
      # 早送りに ならない ときは サーバが 拒否する ＝ 取りこぼしを 作らない。
      - name: main を 早送りする（schedule のみ）
        if: github.event_name == 'schedule' && steps.need.outputs.needed == 'true'
        env:
          DEPLOY_SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_SHA" = "$(git rev-parse origin/main)" ]; then
            echo "→ main は すでに この コミットです（早送りは 何も しません）"
          else
            echo "→ main を $DEPLOY_SHA へ 早送りします"
            git push origin "$DEPLOY_SHA:refs/heads/main"
          fi

      # 「デプロイ成功」は「作りおきが入った」ではない。KV の書き込み枠（1000件/日）を
      # 使い切ると populateCache は中で落ちるのに、外へは成功として返ることがある
      # （2026-08-26 に実発生。docs/deploy.md §0.9）。その版は作りおきゼロで公開され、
      # 全アクセスがフルSSR → 授業の人数で Error 1102 になる。
      #
      # 本番は `opennextjs-cloudflare deploy` が **中で** populateCache を呼ぶので
      # 戻り値を掴めない。掴めるのは標準出力だけなので、tee して読む。
      # 見分ける規則は `scripts/lib/cache_populated.mjs`（STG から KV を 外した あとも、
      # **本番側の 見張りとして 使い続ける**）。schedule で 出すときも 同じように 効く。
      - name: 本番へ反映
        if: (github.event_name == 'schedule' || github.event.inputs.target == 'production') && (github.event_name != 'schedule' || steps.need.outputs.needed == 'true')
        run: |
          set -o pipefail
          # `|| code=$?` で受けるのは、cf:deploy が落ちた時も **見張りを必ず通す**ため
          # （既定の `bash -e` だと、ここで止まって説明が出ないまま赤くなる）。
          npm run cf:deploy 2>&1 | tee /tmp/cf-deploy.log && code=0 || code=$?
          node scripts/check_cache_populated.mjs /tmp/cf-deploy.log "$code"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # 上げっぱなしにしない。出した中身が本当に載ったかを、そのURLで確かめる
      #（/api/version はビルド時のコミットSHAを返す — next.config.ts）。
      - name: 生きているか・中身が載ったか
        if: github.event_name != 'schedule' || steps.need.outputs.needed == 'true'
        env:
          DEPLOY_SHA: ${{ steps.rev.outputs.sha }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.target }}" = "production" ]; then
            url="https://academy.nexmax.workers.dev"
          else
            url="https://staging-academy.nexmax.workers.dev"
          fi
          echo "→ $url を たしかめます（期待する SHA: $DEPLOY_SHA）"
          for i in 1 2 3 4 5 6; do
            sha=$(curl -sf --max-time 20 "$url/api/version" | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p' || true)
            [ "$sha" = "$DEPLOY_SHA" ] && break
            echo "  まだ 反映されていません（いま: ${sha:-取得できず}）。20秒 待ちます"
            sleep 20
          done
          if [ "$sha" != "$DEPLOY_SHA" ]; then
            echo "::error::$url の中身が $DEPLOY_SHA になりません（いま: ${sha:-取得できず}）"
            exit 1
          fi
          echo "✓ $url は $DEPLOY_SHA で 生きています"
