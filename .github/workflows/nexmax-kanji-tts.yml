name: nexmax-kanji 動画の 音声（一時ブランチ）

# ネクマックスの漢字アドベンチャーの 宣伝・あそびかた動画の ナレーションを作る。
# 鍵は Environment「Preview」の Secrets にだけ あるので、この 一時ブランチで 回して、
# 音は artifact で 受け取る。作業が 終わったら ブランチごと 消す。
#   tts38: Gemini 3.8 Flash(-Lite) TTS（tts/gen.mjs, tts/jobs.json）
#   live : Gemini 3.8 Live（tts/live.mjs, tts/live.json）— nexmax-academy と 同じ 読み上げ方
on:
  push:
    branches: ['tts/nexmax-kanji-videos']
    paths: ['tts/jobs.json', 'tts/live.json', 'tts/live.mjs']

concurrency:
  group: nexmax-kanji-tts
  cancel-in-progress: false

jobs:
  tts38:
    runs-on: ubuntu-latest
    environment: Preview
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 3.8 TTS
        if: hashFiles('tts/jobs.json') != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tts/gen.mjs tts/jobs.json out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tts38-out
          path: out
          retention-days: 7
  live:
    runs-on: ubuntu-latest
    environment: Preview
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live
        if: hashFiles('tts/live.json') != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tts/live.mjs tts/live.json out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-out
          path: out
          retention-days: 7
