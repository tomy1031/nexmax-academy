name: nexmax-kanji 音声の 聞き取り確認（一時ブランチ）

# 作った ナレーションを 別の モデルで 文字起こしして、台本と 見くらべる ための 一時ワークフロー。
on:
  push:
    branches: ['tts/nexmax-kanji-videos']
    paths: ['tts/check/manifest.json']

concurrency:
  group: nexmax-kanji-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Preview
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 聞き取り
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tts/check.mjs tts/check out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-out
          path: out
          retention-days: 7
