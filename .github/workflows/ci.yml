name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチへの連続プッシュ時は古い実行をキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 整形チェック
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: 秘密情報スキャン
        run: npm run lint:secrets
      - name: コンテンツ検収（スキーマ・禁止語・秘匿漏れ・ID重複）
        run: npm run lint:content
      - name: 単体テスト
        run: npm test
      - name: ビルド
        run: npm run build
