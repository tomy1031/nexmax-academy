name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチへの連続プッシュ時は古い実行をキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ── 依存を まるごと 覚えておく（願い #208） ─────────────────────────
      #
      # `setup-node` の `cache: npm` が 覚えるのは **ダウンロードの キャッシュ**だけで、
      # `npm ci` の 24秒の 大半は **node_modules へ 展開する 時間**。そこを 覚える。
      #
      # 実測（2026-08-26・run 32926510455 の 1回目と 2回目）:
      #   check 24秒 → 5秒 ／ e2e 24秒 → 9秒 ／ size 27秒 → 4秒（**1ジョブ 15〜23秒 減**）
      #
      # 鍵は package-lock.json の ハッシュ **完全一致**（前方一致で 拾わない）。
      # 古い node_modules を 拾うと、**直した はずの 依存で 緑が 出る**——
      # 2026-08-19 に `next start` の 使い回しで 同じ 事故を 起こして いる。
      # 完全一致なので **一度 保存したら 以後は 当たり続け、保存しなおさない**
      # （置き場も 増えない）。
      #
      # 当たった ときは `npm ci` を とばす ので、**postinstall も 走らない**。
      # `copy_pdf_worker.mjs` は pdf.js の 実体を `public/` へ 写す（スライド教材が 使う）ので、
      # ここで 名指しで 呼ぶ。忘れると スライドが 白くなる。
      #
      # ## 覚えるのを **やめた** もの（測って 効かなかった。願い #208 で 一度 入れて 外した）
      #
      # - **Playwright の ブラウザ**（`~/.cache/ms-playwright`）… 26秒 → 21秒。**5秒しか 減らない**。
      #   ダウンロードは とぶが、`--with-deps` の OS 部品の 確認に 16秒 かかる ため。
      #   置き場 約400MB・初回の 保存に 1分30秒 を 払って 5秒 は 割に 合わない。
      # - **`.next/cache`** … ビルド 46〜64秒 → 45〜48秒。**同じ SHA の 完全一致でも 変わらない**。
      #   このアプリの ビルドは **静的ページの 生成**が 主で、webpack の 再コンパイルでは ない ため。
      #   しかも 鍵に コミットSHA が 要る ので、**1コミットにつき 3つ**の 置き場を 作り続ける。
      - uses: actions/cache@v4
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit == 'true'
        run: node scripts/copy_pdf_worker.mjs

      - name: 整形チェック
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: 秘密情報スキャン
        run: npm run lint:secrets
      - name: コンテンツ検収（スキーマ・禁止語・秘匿漏れ・ID重複）
        run: npm run lint:content
      - name: 単体テスト
        run: npm test
      - name: ビルド
        run: npm run build

  # ── 通しの自動検証（Playwright） ───────────────────────────────────────
  #
  # なぜ 要るか:
  #   ユーザー（クライアント）が 毎回 手で 6教材を さわって 確かめていた。
  #   Supabase の 環境変数が 無ければ アプリは **デモモード**（ログイン不要）で
  #   動く（src/middleware.ts）ので、**鍵ゼロで** CI が 学習者と同じ道を 通せる。
  #
  # 鍵について:
  #   GEMINI_API_KEY は Environment「Preview」に 置いてある。
  #   これは **Playwright の ステップにだけ** 渡す（ビルドに 渡すと OpenNext が
  #   バンドルへ 焼き込む — docs/deploy.md §0.2）。鍵が 無ければ AIの 1往復だけ
  #   とばして、ほかは そのまま 走る（フォークからの PR でも 通る）。
  #
  # ここが CI で **いちばん 長い ジョブ**（＝PR 1回の 待ちを 決める）。
  # 通し検証そのものの 短縮は playwright.config.ts の 並列数（CI だけ 4本）で、
  # 前後の 支度の 短縮は 下の 3つの キャッシュで やっている（願い #208）。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 依存（check ジョブと 同じ 考えかた。鍵も 同じなので 先に 通った ほうを 共用する）
      - uses: actions/cache@v4
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit == 'true'
        run: node scripts/copy_pdf_worker.mjs

      # @playwright/test は devDependencies に 入って いる（版は ブラウザと 組で 固定）。
      # ここでは ブラウザ本体だけ 入れる。
      - name: ブラウザを 用意する
        run: npx playwright install --with-deps chromium

      - name: 型（通し検証のぶん）
        run: npx tsc -p tests/e2e --noEmit

      - name: ビルド
        run: npm run build

      # webServer（playwright.config.ts）が `next start` を 立てて 待つ
      - name: 通し検証
        run: npx playwright test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 人が 見たいときだけ 見られるように 置いておく（開かなくても 合否は 分かる）
      - name: 画面と レポートを 成果物に する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-画面とレポート
          path: |
            e2e-screens/
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ── 上げる 大きさの 見張り（無料枠 gzip 3MiB） ────────────────────────
  #
  # 2026-08-16、のこり 5KiB まで 来ていたことに 誰も 気づけないまま デプロイが
  # code:10027 で 止まった。dry-run は **資格情報なしで動く**ので、PR ごとに 測る。
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 依存（check ジョブと 同じ 考えかた）
      - uses: actions/cache@v4
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit == 'true'
        run: node scripts/copy_pdf_worker.mjs

      - name: Cloudflare 向けに 束ねる
        run: npm run cf:build:local
      - name: 上げる 大きさ（2.8MiB で 警告・3.0MiB で 落とす）
        run: node scripts/check_worker_size.mjs
