<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>株式会社ネクストメイク（学習用サイト） | Nexmax Academy</title>
    <meta
      name="description"
      content="会社を しらべる ための 学習用サイト。やさしい 日本語と 日本語を 切りかえられます。"
    />
    <!--
      タブの 絵は **アプリ（Nexmax Academy）と 同じ**（2026-08-23 の 指定）。
      この 1枚は 全画面の リンク教材として アプリの 中から 開かれるので、
      タブの 絵だけ 別に すると「別の サイトへ 出た」ように 見える。
      実体は `src/app/` の file-based icon（アプリが `/favicon.ico` `/icon.png` で 配る）。
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="stylesheet" href="./style.css" />
    <!--
      この1枚は「リンク教材」として アプリの中から 全画面で 開かれる
      （content/links/nextmake_gakushu_site.json → src/components/link/link-view.tsx）。

      画面に出る 文は すべて data/ の プレーンテキストで、ふりがなは app.js が
      読み辞書から 合成する（AGENTS.md 規律2 と同じ持ち方）。
      **ここに 本文を 直接 書かない**——書くと 検査（tests/gakushu_site.test.ts）の
      外に 文が こぼれる。この html に あるのは 入れ物だけ。

      ページは 1枚の 中で ハッシュ（#/vietnam）で 切りかえる。8枚の html に しないのは、
      レベルと ふりがなの 設定が **サイト全体の もの**だから——ページを 移る たびに
      保存を 読み直すと、読んで いる 最中に 文が 入れかわる。
    -->
  </head>
  <body>
    <!--
      学習の 道具の 帯と 会社の あたまは **1つの かたまりで 貼りつける**。
      前は それぞれ 別に sticky に して、下の あたまに `top: 40px` と 書いて いた。
      帯が 2行に 折り返す 幅（せまい 端末・大きい 文字）では 40px を 超えるので、
      **あたまが 帯に 重なった**。高さを 数字で 決めうちせず、並べて 貼る。
    -->
    <div class="topbar">
      <!-- ============ 学習の 道具（サイトの 外がわ） ============ -->
      <div class="helper" id="helper">
        <span class="helper-label" id="helper-label"></span>
        <div class="helper-levels" id="helper-levels" role="group"></div>
        <button type="button" class="helper-btn" id="furigana-toggle" aria-pressed="true"></button>
      </div>

      <!-- ============ 会社の サイト ============ -->
      <header class="site-head">
        <!--
          あたまは **会社の 本物の ロゴ**（2026-08-23 の 指定）。前は "NM" の
          文字ブロックだった。ロゴは 青い 字の 透過 PNG なので、紺の 帯の 上では
          読めない——**白い 台**（.brand-logo）に のせる。
          会社の 日本語の 名前は ここに 二重で 出さず `alt` に 置く（中身は app.js が
          `UI.siteName` から 入れる——名前の 正を 2か所に しない）。ロゴ・名前・
          キャッチの 3行に すると 貼りついた 帯が 高く なり、本文が 見えなく なる。
        -->
        <a class="brand" href="#/home">
          <img class="brand-logo" src="./img/logo.png" alt="" />
          <span class="brand-text">
            <small id="brand-tagline"></small>
          </span>
        </a>
        <button
          type="button"
          class="nav-toggle"
          id="nav-toggle"
          aria-expanded="false"
          aria-controls="nav"
        ></button>
        <nav class="nav" id="nav" aria-label="ページの一覧"></nav>
      </header>
    </div>

    <main id="main" tabindex="-1">
      <article class="page" id="page"></article>
    </main>

    <footer class="site-foot">
      <p class="foot-mission" id="foot-mission"></p>
      <p class="foot-note" id="foot-note"></p>
      <p class="foot-real"><a id="foot-real" href="https://nextmake.site/" rel="noreferrer"></a></p>
    </footer>

    <button type="button" class="to-top" id="to-top" hidden></button>

    <script type="module" src="./app.js"></script>
  </body>
</html>
