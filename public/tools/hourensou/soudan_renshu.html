        function startDesk(level, live) {
          var stage = document.getElementById("deskStage");
          var call = document.getElementById("callBtn");
          var wrongEl = document.getElementById("deskWrong");
          var liveEl = document.getElementById("deskLive");
          var imgs = stage.querySelectorAll("img");
          var cycle = L.deskCycle(level.id + ":desk");
          var at = 0;
          var lockUntil = 0;
          var changedAt = 0;
          var wrongAt = -1;
          var timer = 0;
          var loaded = 0;
          var started = false;
          var stopped = false;

          function state() {
            return cycle[at % cycle.length];
          }

          function paint() {
            var now = state();
            imgs.forEach(function (img) {
              img.style.opacity = img.getAttribute("data-k") === now ? "1" : "0";
            });
            stage.classList.toggle("busy", now === "busy");
            call.setAttribute("data-desk-state", now);
            if (liveEl) {
              var one = D.desk[now];
              liveEl.hidden = false;
              liveEl.className = "live" + (now === "ok" ? " ok" : "");
              liveEl.innerHTML = one.icon + " " + R(one.label);
            }
            if (wrongAt !== at) wrongEl.hidden = true;
          }

          function tick() {
            if (stopped) return;
            var wait = lockUntil - Date.now();
            if (wait > 0) {
              timer = setTimeout(tick, wait);
              return;
            }
            at += 1;
            changedAt = Date.now();
            paint();
            timer = setTimeout(tick, D.deskSeconds * 1000);
          }

          function begin() {
            if (started || stopped) return;
            started = true;
            call.disabled = false;
            changedAt = Date.now();
            paint();
            timer = setTimeout(tick, D.deskSeconds * 1000);
          }

          imgs.forEach(function (img) {
            var done = function () {
              loaded += 1;
              if (loaded >= imgs.length) begin();
            };
            if (img.complete) done();
            else {
              img.addEventListener("load", done, { once: true });
              img.addEventListener("error", done, { once: true });
            }
          });
          var fallback = setTimeout(begin, 15000);

          call.addEventListener("click", function () {
            if (!started || Date.now() < lockUntil) return;
            var before = at > 0 ? cycle[(at - 1) % cycle.length] : null;
            var justLeftOk = before === "ok" && Date.now() - changedAt < SWITCH_GRACE_MS;
            if (state() === "ok" || justLeftOk) {
              stopped = true;
              clearTimeout(timer);
              setPage(view.page + 1);
              return;
            }
            lockUntil = Date.now() + WRONG_LOCK_MS;
            wrongAt = at;
            wrongEl.innerHTML = "✖ " + R(D.desk[state()].wrong);
            wrongEl.hidden = false;
            stage.classList.remove("shake");
            void stage.offsetWidth;
            stage.classList.add("shake");
          });

          cleanup.push(function () {
            stopped = true;
            clearTimeout(timer);
            clearTimeout(fallback);
          });
        }

        /* ---------------- 相談（マイク・判定） ---------------- */

        var talk = null;

        function newTalk(level) {
          return {
            levelId: level.id,
            phase: "ready",
            fails: 0,
            attempts: [],
            hintsOpen: false,
            hintsSeen: false,
            heard: "",
            judgment: null,
            error: null,
            typed: false,
            noMic: false,
            attemptId: newAttemptId(),
            attemptNo: 0,
            micErrors: 0,
            autoAsked: false,
            reply: D.ui.replyCall,
            face: "neutral",
            passed: false,
            firstTime: !save.micHelpSeen,
          };
        }

        function renderConsult(level) {
          if (!talk || talk.levelId !== level.id) talk = newTalk(level);
          /* 描き直しで 書きかけの 文を 消さない（説明を 見返す ときなど） */
          var typedNow = document.getElementById("typed");
          if (typedNow) talk.typedDraft = typedNow.value;
          var noKey = !getKey();
          var support = L.supportLevel(talk.fails);
          /* お手本は 合格した あと だけ（2026-11-18「答えのようなもので そのまま 棒読みできてしまう」→「合格したあとだけ」） */
          if (support >= 2 && !talk.hintsOpen && !talk.passed) {
            talk.hintsOpen = true;
            talk.hintsSeen = true;
          }
          var j = talk.judgment;
          var html =
            '<div class="consult" data-testid="consult" data-phase="' +
            talk.phase +
            '"><div class="scene"><img class="fig" src="' +
            `${img(D.partner.figures[talk.face] || D.partner.figures.neutral)}` +
            '" alt="" /><div class="bubble"><span class="who-name">' +
            R(D.partner.name + "さん") +
            "</span>" +
            R(talk.reply) +
            "</div>" +
            /* 説明の 画面を 見返す（2026-11-18「相談フェーズで説明の画面を見返すボタンを作れますか？」） */
            (talk.passed
              ? ""
              : '<button type="button" class="btn sub small review-btn" data-act="review" data-testid="review-open"' +
                (busyPhase() ? " disabled" : "") +
                ">📖 " +
                R(D.ui.reviewOpen) +
                "</button>") +
            '</div><div class="talk">';

          if (talk.passed) {
            html += passedHtml(level);
          } else {
            if (talk.phase === "result" && j) html += retryHtml(level, j);
            html += '<div class="box"><h4>🗣 ' + R(D.ui.checklistTitle) + "</h4>" + checklistHtml(level, talk.phase === "result" ? j : null) + "</div>";
            html += notesHtml(level);
            html += hintsHtml(level);
            /*
             * マイクの ボタンは パネルの 下に 固定する（下まで スクロールしないと 見えず、
             * 「マイクで 話しかける ボタンが ない」と なった・2026-11-18 要望 #766）
             */
            html += '<div class="talk-controls" data-testid="talk-controls">' + talkControls(level, noKey) + "</div>";
          }
          html += "</div>" + (talk.review != null ? reviewHtml(level) : "") + "</div>";
          screenEl.innerHTML = html;
          var typedAgain = document.getElementById("typed");
          if (typedAgain && talk.typedDraft) typedAgain.value = talk.typedDraft;
          bindTalk(level, noKey);
          if (talk.phase === "ready" && talk.review == null) autoConnect();
        }

        /** 録音・聞き取り・判定の 最中か（その あいだは 説明を 開かない）。 */
        function busyPhase() {
          return talk.phase === "recording" || talk.phase === "transcribing" || talk.phase === "judging";
        }

        /** 見返せる 説明（調べ表は のぞく）。 */
        function reviewSlides(level) {
          return level.slides.filter(function (slide) {
            return slide.kind !== "worksheet";
          });
        }

        /** 説明を 見返す 窓（相談の 上に 重ねる。マイク・メモ・やり直しの 回数は そのまま）。 */
        function reviewHtml(level) {
          var slides = reviewSlides(level);
          var at = Math.max(0, Math.min(slides.length - 1, talk.review));
          var slide = slides[at];
          var kind = slide.kind || "picture";
          var body =
            kind === "picture"
              ? '<div class="pic"><img src="' + `${img(slide.image)}` + '" alt="" /></div>'
              : '<div class="panelpic">' + slidePanel(slide) + "</div>";
          return (
            '<div class="review" role="dialog" aria-modal="true" data-testid="review">' +
            '<div class="review-head"><span>📖 ' +
            R(D.ui.reviewTitle) +
            "　" +
            (at + 1) +
            " / " +
            slides.length +
            '</span><button type="button" class="btn go small" data-act="review-close" data-testid="review-close">✕ ' +
            R(D.ui.reviewClose) +
            "</button></div>" +
            body +
            '<div class="caption">' +
            (slide.text ? '<p class="text">' + R(slide.text) + "</p>" : "") +
            (slide.quote
              ? '<div class="quote"><span class="who-name">💬 ' + R(slide.quote.who) + "</span>「" + R(slide.quote.text) + "」</div>"
              : "") +
            (slide.note ? '<span class="note">' + R(slide.note) + "</span>" : "") +
            '<div class="nav"><button type="button" class="btn sub small" data-act="review-prev"' +
            (at === 0 ? " disabled" : "") +
            ">◀ " +
            R(D.ui.back) +
            '</button><button type="button" class="btn small" data-act="review-next" data-testid="review-next"' +
            (at >= slides.length - 1 ? " disabled" : "") +
            ">" +
            R(D.ui.next) +
            " ▶</button></div></div></div>"
          );
        }

        /**
         * 学生の ことばを 出す。聞き取りの 文は Gemini が {漢字|よみ} で 返すので ふりがなが 付く。
         * **手で 打った 文**は 本人が IME で 打った ままを 出す（ふりがなの 元が 無い）——
         * その 箇所だけ `data-furigana="off"`（自動の ふりがなの 検査が 数えない 印）。
         */
        function saidHtml(text) {
          var j = talk && talk.judgment;
          if (j && j.heard === text && j.heardRuby) return R(j.heardRuby);
          return '<span data-furigana="off">' + esc(text) + "</span>";
        }

        /**
         * レベル5の 自分の 課題③の メモ（本人が 書いた もの）。
         * 場面の メモ（説明の 数字と 事実を 並べた もの）は 出さない——答えに なって しまう
         *（2026-11-18「場面のメモも答えになってしまうので非表示がいいです」）。数字は「📖 説明を 見る」で 見返す。
         */
        function notesHtml(level) {
          var html = "";
          if (level.worksheet) {
            var notes = level.worksheet.thoughts
              .map(function (one) {
                var value = String(save.worksheet.thoughts[one.id] || "").trim();
                return value ? "<p><b>" + R(one.label) + "</b>：" + '<span data-furigana="off">' + esc(value) + "</span></p>" : "";
              })
              .join("");
            if (notes) html += '<details class="box"><summary>📝 ' + R(D.ui.myNotes) + "</summary>" + notes + "</details>";
          }
          return html;
        }

        /**
         * ヒントを 型（5つ）ごとに まとめる。型の 名前・その 型で 伝える こと（parts の ask）・文の 型 の 順。
         * 並びは データに 出てきた 順（レベル5は 確認した こと → 考え → まだ わからない こと の 順で 話す）。
         * 合格に 要らない 型には「＋ 言えたら ボーナス」を 付ける。
         */
        function hintGroups(level) {
          var order = [];
          var byPart = {};
          level.hints.forEach(function (hint) {
            if (!byPart[hint.part]) {
              byPart[hint.part] = [];
              order.push(hint.part);
            }
            byPart[hint.part].push(hint.text);
          });
          return order.map(function (key) {
            return { part: key, texts: byPart[key] };
          });
        }

        /**
         * その 型を 書く「伝える こと」の 項目（番号と 問い）。ヒントの 見出しを 項目と そろえて、
         * どの 項目で 何を 話すかを 一目で 分かる ように する（2026-11-20「どの項目に何を入れるべきなのか
         * 問題文から明確な答えがえにくい」）。2つの 型を まとめた 項目（レベル2の 4）は 型の 問いの まま。
         */
        function checklistItemFor(level, key) {
          for (var i = 0; i < level.checklist.length; i += 1) {
            var item = level.checklist[i];
            if (item.parts.length === 1 && item.parts[0] === key) return { no: i + 1, ask: item.ask };
          }
          return null;
        }

        function hintsHtml(level) {
          if (talk.hintsOpen) {
            var required = level.ai.required || [];
            return (
              '<div class="box hints" data-testid="hints"><h4>💡 ' +
              R(D.ui.hintTitle) +
              "</h4>" +
              hintGroups(level)
                .map(function (group) {
                  var part = D.parts[group.part];
                  var item = checklistItemFor(level, group.part);
                  return (
                    '<div class="hint-part c-' +
                    part.color +
                    '" data-testid="hint-' +
                    group.part +
                    '"><div class="hp-head">' +
                    (item ? '<span class="hp-no">' + item.no + "</span>" : "") +
                    partTag(group.part) +
                    (required.indexOf(group.part) < 0 ? '<span class="tag c-sun">＋ ' + R(D.ui.optional) + "</span>" : "") +
                    '<span class="hp-ask">' +
                    R(item ? item.ask : part.ask) +
                    "</span></div>" +
                    group.texts
                      .map(function (text) {
                        return "<p>" + R(text) + "</p>";
                      })
                      .join("") +
                    "</div>"
                  );
                })
                .join("") +
              "</div>"
            );
          }
          return (
            '<div class="row"><button type="button" class="btn sub small" data-act="hints" data-testid="hint-btn">💡 ' +
            R(D.ui.hintButton) +
            '</button></div><p class="fine" style="text-align:center">' +
            R(D.ui.hintNote) +
            "</p>"
          );
        }


        /**
         * お手本の 文を 型ごとに 出す。同じ 型が 続く ときは 型の 札を 1回だけ にする（「状況 状況」と 並べない）。
         * ボーナスに なる 文には、どの ボーナスかを 札で 付ける（2026-11-18 要望 #778）。
         */
        function segsHtml(segs, level) {
          var bonusLabels = {};
          (level.bonus || []).forEach(function (one) {
            bonusLabels[one.id] = one.label;
          });
          return segs
            .map(function (seg, at) {
              var part = D.parts[seg.part];
              var cont = at > 0 && segs[at - 1].part === seg.part;
              return (
                '<span class="seg c-' +
                part.color +
                (cont ? " cont" : "") +
                '">' +
                (cont ? "" : partTag(seg.part)) +
                R(seg.text) +
                (seg.bonus && bonusLabels[seg.bonus]
                  ? '<span class="bonus-chip" data-testid="model-bonus">⭐ ' + R(D.ui.bonusTitle) + "：" + R(bonusLabels[seg.bonus]) + "</span>"
                  : "") +
                "</span>"
              );
            })
            .join("");
        }

        function talkControls(level, noKey) {
          var html = "";
          if (talk.phase === "recording") {
            return (
              '<div class="mic-row"><button type="button" class="mic rec" data-act="mic" id="micBtn" data-testid="mic" style="--ring:14px"><span class="ic">⏹</span>' +
              '<span class="lb">' +
              R(D.ui.micStop) +
              "</span>" +
              '</button><p class="status" id="micStatus">' +
              R(D.ui.micListening) +
              "</p></div>"
            );
          }
          if (talk.phase === "transcribing" || talk.phase === "judging") {
            return '<div class="box"><div class="spinner"></div><p class="status">' + R(talk.phase === "judging" ? D.ui.judging : D.ui.hearing) + "</p></div>";
          }
          if (talk.phase === "confirm") {
            return (
              '<div class="box heard"><h4>👂 ' +
              R(D.ui.heardTitle) +
              '</h4><p class="said" data-testid="heard"><span data-furigana="off">' +
              esc(talk.heard) +
              "</span>" +
              '</p></div><div class="row"><button type="button" class="btn go" data-act="send" data-testid="send">' +
              R(D.ui.sendHeard) +
              '</button><button type="button" class="btn sub small" data-act="remic">🔁 ' +
              R(D.ui.retryMic) +
              "</button></div>"
            );
          }
          if (talk.error) {
            html +=
              '<p class="box" style="border-color:var(--coral-deep);font-weight:800">⚠️ ' +
              R(
                talk.error === "quota"
                  ? D.ui.aiQuota
                  : talk.error === "mic"
                    ? D.ui.micDenied
                    : D.ui.aiError,
              ) +
              "</p>";
          }
          if (noKey) {
            html += '<div class="box" style="font-weight:800">🔑 ' + R(D.ui.noKey) + keyFormHtml() + "</div>";
            return html;
          }
          /*
           * 文字で 送るのは マイクが 使えない ときだけ（2026-11-18 要望 #765）: キーが 無い・
           * マイクに 2回 つながらない・聞き取りの しくみが 無い。ふだんは マイクだけ。
           */
          var typeMode = micUnusable();
          if (!typeMode && voice.status !== "live") {
            /* マイクを つなぐ（相談の 画面に 来たら 自動で つなぐ。つながらない ときは 押して やり直す） */
            var connecting = talk.phase === "connecting" || voice.status === "connecting";
            html +=
              '<div class="mic-row"><button type="button" class="mic" data-act="connect" id="micBtn" data-testid="mic-connect"' +
              (connecting ? " disabled" : "") +
              '><span class="ic">🎤</span>' +
              '<span class="lb">' +
              R(connecting ? D.ui.micConnecting : D.ui.micConnect) +
              "</span>" +
              "</button>" +
              (voice.status === "error" || voice.status === "notReady"
                ? '<p class="fine">' + R(D.ui.micConnectError) + "</p>"
                : "") +
              "</div>";
          } else if (!typeMode) {
            if (talk.firstTime) html += '<p class="fine" style="text-align:center">' + R(D.micHelp) + "</p>";
            html +=
              '<div class="mic-row"><button type="button" class="mic" data-act="mic" id="micBtn" data-testid="mic"><span class="ic">🎤</span>' +
              '<span class="lb">' +
              R(D.ui.micStart) +
              "</span>" +
              "</button></div>";
          } else {
            if (!noKey) html += '<p class="fine" style="text-align:center">' + R(D.ui.micTyping) + "</p>";
            html +=
              '<div class="box"><textarea id="typed" maxlength="900" placeholder="" data-testid="typed"></textarea><div class="row" style="margin-top:6px"><button type="button" class="btn go" data-act="sendtyped" data-testid="send-typed">' +
              R(D.ui.typeSend) +
              "</button></div></div>";
          }
          return html;
        }

        function retryHtml(level, j) {
          var key = L.reactionKey(j);
          var reaction = D.reactions[key] || D.reactions.soudan;
          var missing = j.failure === "missing";
          return (
            '<div class="verdict retry" data-testid="verdict-retry"><span class="big">✖ ' +
            R(D.ui.retry) +
            "</span>　" +
            (talk.fails > 0 ? R(D.ui.retryTimes.replace("{N}", String(talk.fails))) : "") +
            "<br />" +
            R(missing ? D.ui.retryLead : reaction.text) +
            (missing
              ? '<div class="plist">' +
                j.missing
                  .map(function (k) {
                    return partTag(k);
                  })
                  .join("") +
                "</div>"
              : "") +
            '<div class="next">👉 ' +
            R(D.ui.nextAction) +
            "：" +
            R(reaction.hint) +
            "</div>" +
            (j.heard ? '<p class="fine">' + R(D.ui.yourWords) + "：「" + saidHtml(j.heard) + "」</p>" : "") +
            "</div>"
          );
        }

        function passedHtml(level) {
          var j = talk.judgment;
          var mine = levelSave(level.id);
          var starsNow = L.starsForFails(talk.fails);
          var html =
            '<div class="verdict pass" data-testid="verdict-pass"><span class="big">⭕ ' +
            R(D.ui.pass) +
            "</span>　" +
            stars(starsNow) +
            "　" +
            (talk.fails > 0 ? R(D.ui.retryTimes.replace("{N}", String(talk.fails))) : "") +
            "<br />" +
            R(D.ui.passLead) +
            '<div class="next">👉 ' +
            R(D.ui.nextAction) +
            "：" +
            R(D.ui.passNext) +
            "</div></div>" +
            '<div class="row"><button type="button" class="btn go" data-act="toreply" data-testid="to-reply">' +
            R(D.ui.toResult) +
            ' ▶</button><button type="button" class="btn sub small" data-act="again">🔁 ' +
            R(D.ui.practiceAgain) +
            "</button></div>";
          if (j) {
            html +=
              '<div class="box"><h4>✅ ' +
              R(D.ui.itemsTitle) +
              '</h4><div class="plist">' +
              L.PART_KEYS.filter(function (key) {
                return (level.ai.required || []).indexOf(key) >= 0 || j.parts[key];
              })
                .map(function (key) {
                  return j.parts[key] ? partTag(key) : partTag(key).replace('class="tag', 'class="tag no');
                })
                .join("") +
              "</div></div>";
            var points = L.bonusPoints(j);
            html +=
              '<div class="box" data-testid="bonus"><h4>➕ ' +
              R(D.ui.bonusTitle) +
              " ＋" +
              points +
              " / " +
              L.maxBonus(level) +
              '</h4><ul class="bonus-list"><li class="' +
              (j.ownWords ? "got" : "not") +
              '">' +
              (j.ownWords ? "✓ " : "・ ") +
              R(D.ui.ownWords) +
              "</li>" +
              level.bonus
                .map(function (one) {
                  var got = j.bonus.indexOf(one.id) >= 0;
                  return '<li class="' + (got ? "got" : "not") + '">' + (got ? "✓ " : "・ ") + R(one.label) + "</li>";
                })
                .join("") +
              "</ul></div>";
            if (j.heard) {
              html += '<div class="box heard"><h4>🗣 ' + R(D.ui.yourWords) + '</h4><p class="said">' + saidHtml(j.heard) + "</p></div>";
            }
            if (!j.addedOwn) {
              html +=
                '<div class="box hints" data-testid="better"><h4>🌱 ' +
                R(j.templateOnly ? D.ui.templateOnly : D.ui.betterTitle) +
                "</h4><p>" +
                R(j.templateOnly ? level.better.lead : D.ui.betterLeadOwn) +
                "</p>" +
                level.better.adds
                  .map(function (one) {
                    var part = D.parts[one.part];
                    return (
                      '<span class="seg c-' +
                      part.color +
                      '">' +
                      partTag(one.part) +
                      "＋ " +
                      R(one.text) +
                      '<br /><span class="fine">→ ' +
                      R(one.why) +
                      "</span></span>"
                    );
                  })
                  .join("") +
                "</div>";
            }
          }
          /* お手本は 最初から 開いて おく（2026-11-19「お手本は初期状態でONにしていると良いです」） */
          html +=
            '<details class="box model" open data-testid="model"><summary>📗 ' +
            R(D.ui.modelTitle) +
            "</summary>" +
            segsHtml(level.model, level) +
            '<p class="fine">' +
            R(level.modelNote) +
            "</p>" +
            readModelHtml(level) +
            "</details>";
          void mine;
          return html;
        }

        /**
         * お手本を 声に 出して 読む 練習（2026-11-19「『お手本を読む』ボタンで、お手本の文章を読み上げる
         * 機会を与えたい」→ 学生が 声に 出して 読む）。合格した あと だけ。聞き取った 文を お手本と
         * くらべて、読めたか どうかを はっきり 出す（星・ボーナスには 数えない）。
         * マイクが 使えない とき（キーが 無い・つながらない）は ボタンを 出さない。
         */
        function readModelHtml(level) {
          if (micUnusable()) return "";
          var read = talk.read || { phase: "idle" };
          var html = '<div class="read-model" data-testid="read-model-box"><p class="fine">' + R(D.ui.readLead) + "</p>";
          if (read.phase === "recording") {
            html +=
              '<div class="mic-row"><button type="button" class="mic rec small" data-act="readstop" data-testid="read-stop" style="--ring:14px"><span class="ic">⏹</span><span class="lb">' +
              R(D.ui.readStop) +
              "</span></button></div>";
          } else if (read.phase === "transcribing" || read.phase === "connecting") {
            html += '<div class="spinner"></div><p class="status">' + R(read.phase === "connecting" ? D.ui.micConnecting : D.ui.hearing) + "</p>";
          } else {
            if (read.phase === "done") {
              html +=
                '<div class="read-result ' +
                (read.ok ? "ok" : "ng") +
                '" data-testid="read-result" data-ok="' +
                (read.ok ? "1" : "0") +
                '">' +
                (read.ok ? "⭕ " + R(D.ui.readOk) : "✖ " + R(read.heard ? D.ui.readNg : D.ui.readNone)) +
                (read.heard
                  ? '<p class="fine">' + R(D.ui.readHeard) + '：「<span data-furigana="off">' + esc(read.heard) + "</span>」</p>"
                  : "") +
                "</div>";
            }
            if (read.error) html += '<p class="fine">' + R(D.ui.micConnectError) + "</p>";
            html +=
              '<div class="mic-row"><button type="button" class="mic small" data-act="readmodel" data-testid="read-model"><span class="ic">🎤</span><span class="lb">' +
              R(read.phase === "done" ? D.ui.readAgain : D.ui.readModel) +
              "</span></button></div>";
          }
          return html + "</div>";
        }

        /** 描き直しても、いま 見て いる 所（お手本の あたり）から 動かさない。 */
        function renderKeepingScroll(level) {
          var panel = screenEl.querySelector(".talk");
          var top = panel ? panel.scrollTop : 0;
          renderConsult(level);
          var again = screenEl.querySelector(".talk");
          if (again) again.scrollTop = top;
        }

        function readStart() {
          var level = LEVELS[view.level];
          if (!talk || !talk.passed) return;
          if (voice.status !== "live") {
            talk.read = { phase: "connecting" };
            voicePost({ op: "connect" });
            return renderKeepingScroll(level);
          }
          talk.read = { phase: "recording" };
          voicePost({ op: "talk-start" });
          renderKeepingScroll(level);
          clearTimeout(voice.limitTimer);
          var levelId = talk.levelId;
          voice.limitTimer = setTimeout(function () {
            if (onConsultPage(levelId) && talk.read && talk.read.phase === "recording") readStop();
          }, TALK_LIMIT_MS);
        }

        function readStop() {
          clearTimeout(voice.limitTimer);
          if (!talk || !talk.read || talk.read.phase !== "recording") return;
          voicePost({ op: "talk-stop" });
          talk.read = { phase: "transcribing" };
          renderKeepingScroll(LEVELS[view.level]);
          var levelId = talk.levelId;
          clearTimeout(voice.heardTimer);
          voice.heardTimer = setTimeout(function () {
            if (!onConsultPage(levelId) || !talk.read || talk.read.phase !== "transcribing") return;
            talk.read = { phase: "done", heard: "", ok: false };
            renderKeepingScroll(LEVELS[view.level]);
          }, 9000);
        }

        function bindTalk(level, noKey) {
          var typed = document.getElementById("typed");
          if (typed) typed.focus({ preventScroll: true });
        }

        /* ---------------- 声と 判定（親の 画面の Live に 頼む） ---------------- */

        /*
         * 学習者の 画面では **Gemini は Live だけ**（注意事項 2026-08-20・08-27）。この ページは
         * Gemini を 自分で 呼ばず、親の 画面（アプリの ステージの 中）に 頼む
         *（`src/components/link/link-voice-bridge.tsx`）。聞き取りは 親の 声の Live、判定は 親の
         * 判定の Live。マイクを 使うのも 親の 画面。親が いない（べつの タブで 開いた）ときは
         * AI を 使えない——お手本を 見て 書く 道だけ（星 1つ）。
         */
        var voice = { status: "idle", talking: false, reqId: 0, judging: {}, heardTimer: 0, limitTimer: 0, attempt: 0 };

        function voicePost(message) {
          post(Object.assign({ type: "nexmax:link-voice" }, message));
        }

        function aiAvailable() {
          return inFrame && !!getKey();
        }

        /** いま この レベルの 相談の 画面に いるか（遅れて 届いた 返事を 捨てる ため）。 */
        function onConsultPage(levelId) {
          if (view.screen !== "level" || !talk || talk.levelId !== levelId) return false;
          var level = LEVELS[view.level];
          var page = pagesFor(level)[view.page];
          return level.id === levelId && !!page && page.type === "consult";
        }

        function judgeKey() {
          return talk.levelId + "-" + talk.attemptNo;
        }

        window.addEventListener("message", function (event) {
          if (event.origin !== window.location.origin || event.source !== window.parent) return;
          var data = event.data;
          if (!data || data.type !== "nexmax:link-voice-reply" || data.id !== LINK_ID) return;
          if (data.op === "status") {
            voice.status = String(data.status || "idle");
            voice.talking = data.talking === true;
            onVoiceStatus();
            return;
          }
          if (data.op === "heard") {
            onHeard(String(data.text || ""));
            return;
          }
          if (data.op === "judged") {
            var waiter = voice.judging[data.reqId];
            if (!waiter) return;
            delete voice.judging[data.reqId];
            waiter(data);
          }
        });

        /** マイクが 使えないか（文字で 送る のは この とき だけ）。 */
        function micUnusable() {
          return !aiAvailable() || !!talk.noMic || talk.micErrors >= 2 || voice.status === "notReady";
        }

        /** 相談の 画面に 来たら マイクを つなぐ（席の 絵の ボタンを 押した 直後なので、許可の 確かめが 出せる）。 */
        function autoConnect() {
          if (!talk || talk.autoAsked || talk.passed || micUnusable()) return;
          if (voice.status === "live" || voice.status === "connecting") return;
          talk.autoAsked = true;
          connectVoice();
        }

        var lastVoiceStatus = "idle";
        function onVoiceStatus() {
          /* つながらなかった 回数（2回で 文字に 切りかえる・5日間と 同じ） */
          if (voice.status === "error" && lastVoiceStatus !== "error" && talk) talk.micErrors = (talk.micErrors || 0) + 1;
          lastVoiceStatus = voice.status;
          if (!talk || !onConsultPage(talk.levelId)) return;
          var level = LEVELS[view.level];
          /* 合格の あとの お手本を 読む 練習 */
          if (talk.passed && talk.read) {
            var phaseNow = talk.read.phase;
            if (phaseNow === "connecting" && voice.status === "live") talk.read = { phase: "idle" };
            else if (phaseNow === "connecting" && (voice.status === "error" || voice.status === "notReady"))
              talk.read = { phase: "idle", error: true };
            else if (phaseNow === "recording" && !voice.talking && voice.status !== "live") talk.read = { phase: "idle" };
            else return;
            return renderKeepingScroll(level);
          }
          if (talk.phase === "connecting" && voice.status !== "connecting") talk.phase = "ready";
          /* 録音が 外から 止まった（つなぎの 張り直し など）→ 聞き取りを 待つ */
          if (talk.phase === "recording" && !voice.talking && voice.status !== "live") talk.phase = "ready";
          /* 書く 欄に 打って いる ときは 描き直さない（打った 字が 消える） */
          if (document.getElementById("typed")) return;
          if (talk.phase === "ready" || talk.phase === "connecting" || talk.phase === "recording") renderConsult(level);
        }

        function connectVoice() {
          if (!inFrame || !talk) return;
          talk.phase = "connecting";
          voicePost({ op: "connect" });
          renderConsult(LEVELS[view.level]);
        }

        function startTalk() {
          if (voice.status !== "live" || talk.phase === "recording") return;
          talk.phase = "recording";
          talk.error = null;
          talk.recStarted = Date.now();
          if (talk.firstTime) {
            talk.firstTime = false;
            save.micHelpSeen = true;
            writeSave();
          }
          voicePost({ op: "talk-start" });
          voicePost({ op: "warm", key: judgeKey() });
          renderConsult(LEVELS[view.level]);
          clearInterval(voice.limitTimer);
          var levelId = talk.levelId;
          voice.limitTimer = setInterval(function () {
            if (!onConsultPage(levelId) || talk.phase !== "recording") {
              clearInterval(voice.limitTimer);
              return;
            }
            var left = Math.ceil((TALK_LIMIT_MS - (Date.now() - talk.recStarted)) / 1000);
            var status = document.getElementById("micStatus");
            if (status && left <= 10) status.innerHTML = R(D.ui.micLeft.replace("{N}", String(Math.max(0, left))));
            if (left <= 0) finishTalk();
          }, 500);
        }

        function finishTalk() {
          clearInterval(voice.limitTimer);
          if (!talk || talk.phase !== "recording") return;
          voicePost({ op: "talk-stop" });
          talk.phase = "transcribing";
          renderConsult(LEVELS[view.level]);
          var levelId = talk.levelId;
          clearTimeout(voice.heardTimer);
          /* 聞き取りが 届かない とき（何も 言わなかった など）は「聞こえませんでした」 */
          voice.heardTimer = setTimeout(function () {
            if (!onConsultPage(levelId) || talk.phase !== "transcribing") return;
            talk.phase = "ready";
            talk.reply = D.reactions.unclear.text;
            talk.face = "troubled";
            renderConsult(LEVELS[view.level]);
          }, 9000);
        }

        /** 画面を 離れる とき、録音を 止める（親の マイクを 切る）。 */
        function stopTalkIfAny() {
          clearInterval(voice.limitTimer);
          clearTimeout(voice.heardTimer);
          if (talk && talk.phase === "recording") voicePost({ op: "talk-stop" });
        }

        function onHeard(text) {
          if (talk && talk.passed && talk.read && talk.read.phase === "transcribing" && onConsultPage(talk.levelId)) {
            clearTimeout(voice.heardTimer);
            var said = text.trim();
            var lv = LEVELS[view.level];
            talk.read = { phase: "done", heard: said, ok: !!said && L.readsModel(said, lv.model) };
            return renderKeepingScroll(lv);
          }
          if (!talk || !onConsultPage(talk.levelId) || talk.phase !== "transcribing") return;
          clearTimeout(voice.heardTimer);
          var level = LEVELS[view.level];
          if (!text.trim()) {
            talk.phase = "ready";
            talk.reply = D.reactions.unclear.text;
            talk.face = "troubled";
          } else {
            talk.heard = text.trim();
            talk.phase = "confirm";
          }
          renderConsult(level);
        }

        /** 判定を 親に 頼む。返事は 道具の 引数（合否は ここで `settle` が 決める）。 */
        function judgeRemote(level, utterance) {
          voice.reqId += 1;
          var reqId = voice.reqId;
          var hints = { hintsOpened: talk.hintsSeen };
          voicePost({ op: "judge", key: judgeKey(), reqId: reqId, prompt: L.buildJudgePrompt(level, L.plain(utterance), hints) });
          return new Promise(function (resolve) {
            voice.judging[reqId] = resolve;
            setTimeout(function () {
              if (!voice.judging[reqId]) return;
              delete voice.judging[reqId];
              resolve({ ok: false, reason: "timeout" });
            }, 40000);
          }).then(function (data) {
            if (!data.ok) return { ok: false, reason: String(data.reason || "upstream") };
            var j = L.settle(level, data.args, utterance, hints);
            if (!j) return { ok: false, reason: "badShape" };
            var ruby = data.args && typeof data.args.heard_ruby === "string" ? data.args.heard_ruby : "";
            /* 読みを 付けた 文が 元の 文と 同じ とき だけ 使う（AI が 文を 変えて いたら 使わない） */
            var same = function (text) {
              return L.plain(text).replace(/[\s、。，．,.!?！？]/g, "");
            };
            j.heardRuby = ruby && same(ruby) === same(utterance) ? L.tidyRuby(ruby) : "";
            return { ok: true, judgment: j };
          });
        }

        /* ---------------- 判定の 流れ ---------------- */

        function judge(utterance) {
          var level = LEVELS[view.level];
          var said = String(utterance || "").trim();
          if (!said || talk.phase === "judging") return;
          talk.heard = said;
          /* AI で 見られない（キーが 無い）ときは 送らない。キーを 入れる 欄を 出して いる */
          if (!aiAvailable()) {
            renderConsult(level);
            return;
          }
          talk.phase = "judging";
          talk.error = null;
          talk.attemptNo += 1;
          renderConsult(level);
          var levelId = level.id;
          judgeRemote(level, said).then(function (result) {
            if (!onConsultPage(levelId)) return;
            if (!result.ok) {
              talk.phase = "ready";
              talk.error = result.reason === "quota" || result.reason === "rateLimited" ? "quota" : "ai";
              renderConsult(level);
              return;
            }
            var j = result.judgment;
            talk.judgment = j;
            talk.attempts.push({ heard: said, pass: j.pass });
            if (j.pass) {
              passWith(level, j);
              return;
            }
            if (L.countsAsFail(j)) {
              talk.fails += 1;
              /*
               * はじめて 合格する までの 不合格は 端末に 積む（画面を 離れる・読み直すと talk は 0 に
               * 戻る。修了証の パーフェクトが 崩れる・コードの 検収）
               */
              var lv = levelSave(level.id);
              if (!(lv.stars > 0)) {
                lv.failsBeforePass = (lv.failsBeforePass || 0) + 1;
                writeSave();
              }
            }
            var reaction = D.reactions[L.reactionKey(j)] || D.reactions.soudan;
            talk.reply = reaction.text;
            talk.face = "troubled";
            talk.phase = "result";
            renderConsult(level);
          });
        }

        function allParts(level) {
          var out = {};
          L.PART_KEYS.forEach(function (key) {
            out[key] = (level.ai.required || []).indexOf(key) >= 0;
          });
          return out;
        }

        function passWith(level, j) {
          talk.judgment = j;
          if (!talk.attempts.length || talk.attempts[talk.attempts.length - 1].heard !== j.heard) {
            talk.attempts.push({ heard: j.heard, pass: true });
          }
          talk.passed = true;
          talk.phase = "passed";
          talk.face = "happy";
          talk.reply = D.ui.passReply;
          var mine = levelSave(level.id);
          /* はじめて 合格した 回の やり直し（修了証の パーフェクトは これで 決める） */
          if (!(mine.stars > 0) && typeof mine.firstFails !== "number") {
            mine.firstFails = Math.max(talk.fails, mine.failsBeforePass || 0);
          }
          var got = L.starsForFails(talk.fails);
          var points = L.bonusPoints(j);
          mine.stars = Math.max(mine.stars || 0, got);
          mine.bonus = Math.max(mine.bonus || 0, points);
          mine.choice = j.choice;
          writeSave();
          reportProgress();
          askCertificates();
          var note = "（" + D.ui.levelWord.replace(/\{([^{}|]+)\|[^{}|]+\}/g, "$1") + level.no + "・★" + got + "・加点＋" + points + "）";
          reportAnswers([{ id: level.id, text: (L.attemptsText(talk.attempts) + " " + note).slice(0, 1000), correct: talk.fails === 0 }], talk.attemptId);
          renderConsult(level);
        }

        /* ---------------- ヘンディさんの 答え ---------------- */

        function renderReply(level) {
          var mine = save.levels[level.id] || {};
          var choice = (talk && talk.levelId === level.id && talk.judgment && talk.judgment.choice) || mine.choice || "none";
          var line = level.results[choice] || level.results.none;
          var lastLevel = view.level >= LEVELS.length - 1;
          var html =
            '<div class="reply"><div class="pic"><img src="' +
            `${img(level.resultImage)}` +
            '" alt="" /></div><div class="talk"><div class="box" style="display:flex;gap:10px;align-items:flex-start"><img src="' +
            `${img(D.partner.figures.happy)}` +
            '" alt="" style="width:76px;height:96px;object-fit:cover;object-position:top;border-radius:12px;background:var(--sky-soft)" /><p style="font-weight:900;font-size:17px;line-height:2"><span class="who-name" style="display:block;font-size:12px;color:var(--sky-deep)">' +
            R(D.partner.name + "さん") +
            "</span>" +
            R(line) +
            '</p></div><div class="box"><h4>🎯 ' +
            R(D.ui.point) +
            '</h4><p style="font-weight:800">' +
            R(level.point) +
            "</p></div>";
          if (level.teacherQuestions) {
            html +=
              '<div class="box hints"><h4>🧑‍🏫 ' +
              R(D.ui.teacherQuestions) +
              "</h4>" +
              level.teacherQuestions
                .map(function (q, at) {
                  return "<p>" + (at + 1) + ". " + R(q) + "</p>";
                })
                .join("") +
              "</div>";
          }
          if (mine.stars) {
            html += '<p class="status">' + stars(mine.stars) + "　" + R(D.ui.bonusTitle) + " ＋" + (mine.bonus || 0) + "</p>";
          }
          if (lastLevel && L.allCleared(save, LEVELS.length)) {
            html += '<p class="status" style="font-size:20px">🎉 ' + R(D.ui.allDone) + "</p>";
          }
          var nextSpecial = !lastLevel && LEVELS[view.level + 1].special;
          if (nextSpecial && L.requiredCleared(save, REQUIRED)) {
            /* レベル1〜4 が 終わった（✅ と 修了証）。レベル5は やりたい 人だけ */
            html +=
              '<p class="status" style="font-size:20px" data-testid="required-done">🎉 ' +
              R(D.ui.requiredDone) +
              '</p><p class="fine" style="text-align:center">' +
              R(D.ui.specialNote) +
              "</p>";
          }
          html +=
            '<div class="row">' +
            (lastLevel
              ? '<button type="button" class="btn go" data-act="home">' + R(D.ui.title) + "</button>"
              : nextSpecial
                ? '<button type="button" class="btn special-go" data-act="nextlevel" data-testid="next-level">🏅 ' +
                  R(D.ui.toSpecial) +
                  ' ▶</button><button type="button" class="btn sub small" data-act="home">' +
                  R(D.ui.title) +
                  "</button>"
                : '<button type="button" class="btn go" data-act="nextlevel" data-testid="next-level">' + R(D.ui.nextLevel) + " ▶</button>") +
            "</div></div></div>";
          screenEl.innerHTML = html;
        }

        /* ---------------- レベル5の 調べ表 ---------------- */

        /** レベル5の 調べ表（課題①②③を 1画面ずつ・検収の 指摘「1画面に 31の 欄は 多すぎる」）。 */
        function renderWorksheet(level, part) {
          var ws = level.worksheet;
          var values = save.worksheet;
          var html = '<div class="slide"><div class="panelpic"><div class="ws">';
          if (part === 1) {
          html +=
            "<section><h3>🔎 " +
            R(ws.task1Title) +
            '</h3><div class="apis">' +
            ws.apis
              .map(function (api) {
                return (
                  '<a href="' +
                  `${esc(api.url)}` +
                  '" target="_blank" rel="noopener noreferrer">📄 ' +
                  esc(api.name) +
                  "<small>" +
                  R(D.ui.officialDocs) +
                  "：" +
                  esc(api.url) +
                  "</small></a>"
                );
              })
              .join("") +
            "</div><p style=\"font-weight:800\">" +
            R(ws.task1Lead) +
            '</p><table class="cond"><tbody>' +
            ws.topics
              .map(function (row) {
                return "<tr><th>" + R(row[0]) + "</th><td>" + R(row[1]) + "</td></tr>";
              })
              .join("") +
            '</tbody></table><p class="fine">' +
            R(ws.task1Note) +
            "</p></section>";
          }
          if (part === 2) {
          html +=
            "<section><h3>📝 " +
            R(ws.task2Title) +
            "</h3><p style=\"font-weight:800\">" +
            R(ws.task2Lead) +
            '</p><table class="wsgrid"><thead><tr><th></th>' +
            ws.apis
              .map(function (api) {
                return "<th>" + esc(api.name.split("（")[0]) + "</th>";
              })
              .join("") +
            "</tr></thead><tbody>" +
            ws.rows
              .map(function (row, at) {
                return (
                  "<tr><th>" +
                  (at + 1) +
                  ". " +
                  R(row.label) +
                  /* 書き方の 例（2026-11-20「比較表のところ、それぞれの入力例をどこかに書いて」） */
                  (row.example ? '<span class="ws-ex">' + R(D.ui.example) + "：" + R(row.example) + "</span>" : "") +
                  "</th>" +
                  ws.apis
                    .map(function (api) {
                      var id = L.worksheetCellId(row.id, api.id);
                      return (
                        '<td data-api="' +
                        esc(api.name.split("（")[0]) +
                        '"><textarea data-ws="cell" data-id="' +
                        id +
                        '" maxlength="400">' +
                        esc(values.cells[id] || "") +
                        "</textarea></td>"
                      );
                    })
                    .join("") +
                  "</tr>"
                );
              })
              .join("") +
            '</tbody></table><div class="row"><button type="button" class="btn sub small" data-act="copyws">📋 ' +
            R(D.ui.copy) +
            "</button></div></section>";
          }
          if (part === 3) {
          html +=
            "<section><h3>💡 " +
            R(ws.task3Title) +
            "</h3><p style=\"font-weight:800\">" +
            R(ws.task3Lead) +
            "</p>" +
            ws.thoughts
              .map(function (one) {
                var id = L.worksheetThoughtId(one.id);
                return (
                  '<p style="font-weight:900;margin-top:8px">' +
                  R(one.label) +
                  '</p><textarea data-ws="thought" data-id="' +
                  one.id +
                  '" maxlength="600">' +
                  esc(values.thoughts[one.id] || "") +
                  "</textarea>"
                );
                void id;
              })
              .join("") +
            "</section>";
          }
          html += "</div></div>";
          html += '<div class="caption">' + navHtml({ nextLabel: part === 3 ? D.ui.wsSave : D.ui.next }) + "</div></div>";
          screenEl.innerHTML = html;
          screenEl.querySelectorAll("textarea[data-ws]").forEach(function (area) {
            area.addEventListener("input", function () {
              var bucket = area.getAttribute("data-ws") === "cell" ? save.worksheet.cells : save.worksheet.thoughts;
              bucket[area.getAttribute("data-id")] = area.value;
              writeSave();
            });
          });
        }

        function sendWorksheet(level) {
          var ws = level.worksheet;
          var answers = [];
          ws.rows.forEach(function (row) {
            ws.apis.forEach(function (api) {
              var id = L.worksheetCellId(row.id, api.id);
              var text = String(save.worksheet.cells[id] || "").trim();
              if (text) answers.push({ id: id, text: text });
            });
          });
          ws.thoughts.forEach(function (one) {
            var text = String(save.worksheet.thoughts[one.id] || "").trim();
            if (text) answers.push({ id: L.worksheetThoughtId(one.id), text: text });
          });
          if (answers.length > 0) {
            reportAnswers(answers, newAttemptId());
            toast(D.ui.wsSaved);
          }
        }

        function copyText(text) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
          }
          var area = document.createElement("textarea");
          area.value = text;
          document.body.appendChild(area);
          area.select();
          try {
            document.execCommand("copy");
          } finally {
            document.body.removeChild(area);
          }
          return Promise.resolve();
        }

        /* ============================================================ 操作 */

        function next() {
          if (view.screen === "intro") {
            if (view.intro >= D.intro.length - 1) {
              save.introSeen = true;
              writeSave();
              reportProgress();
              go("title");
            } else {
              view.intro += 1;
              render();
            }
            return;
          }
          if (view.screen !== "level") return;
          var level = LEVELS[view.level];
          var page = pagesFor(level)[view.page];
          if (page.type === "desk" || page.type === "consult") return;
          /* 調べ表は 最後（課題③）を 出る ときに まとめて 先生の 画面へ 送る */
          if (page.type === "slide" && page.slide.kind === "worksheet" && page.slide.part === 3) sendWorksheet(level);
          setPage(view.page + 1);
        }

        function back() {
          if (view.screen === "intro") {
            if (view.intro > 0) {
              view.intro -= 1;
              render();
            }
            return;
          }
          if (view.screen !== "level") return;
          if (view.page > 0) {
            stopTalkIfAny();
            setPage(view.page - 1);
          }
        }

        screenEl.addEventListener("click", function (event) {
          var target = event.target.closest("[data-act]");
          if (!target || target.disabled) return;
          var act = target.getAttribute("data-act");
          var level = LEVELS[view.level];
          if (act === "next") return next();
          if (act === "back") return back();
          if (act === "intro") return go("intro", { intro: 0 });
          if (act === "level") {
            var at = Number(target.getAttribute("data-level"));
            talk = null;
            if (!save.introSeen) {
              save.introSeen = true;
              writeSave();
            }
            return go("level", { level: at, page: 0 });
          }
          if (act === "savekey") {
            var input = document.getElementById("keyInput");
            var key = input ? input.value.trim() : "";
            if (key) {
              try {
                window.localStorage.setItem(GEMINI_KEY, key);
              } catch (error) {
                /* 保存できない */
              }
              if (view.screen === "level") renderConsult(level);
              else renderTitle();
            }
            return;
          }
          if (act === "home") return go("title");
          if (act === "nextlevel") {
            talk = null;
            return go("level", { level: Math.min(LEVELS.length - 1, view.level + 1), page: 0 });
          }
          if (act === "review") {
            if (busyPhase()) return;
            talk.review = 0;
            return renderConsult(level);
          }
          if (act === "review-close") {
            talk.review = null;
            return renderConsult(level);
          }
          if (act === "review-prev" || act === "review-next") {
            var count = reviewSlides(level).length;
            talk.review = Math.max(0, Math.min(count - 1, talk.review + (act === "review-next" ? 1 : -1)));
            return renderConsult(level);
          }
          if (act === "hints") {
            talk.hintsOpen = true;
            talk.hintsSeen = true;
            return renderConsult(level);
          }
          if (act === "connect") return connectVoice();
          if (act === "mic") {
            if (talk.phase === "recording") return finishTalk();
            return startTalk();
          }
          if (act === "remic") {
            talk.phase = "ready";
            talk.heard = "";
            return renderConsult(level);
          }
          if (act === "send") {
            talk.lastTyped = false;
            return judge(talk.heard);
          }
          if (act === "sendtyped") {
            var area = document.getElementById("typed");
            talk.lastTyped = true;
            return judge(area ? area.value : "");
          }
          if (act === "readmodel") return readStart();
          if (act === "readstop") return readStop();
          if (act === "toreply") return setPage(view.page + 1);
          if (act === "again") {
            stopTalkIfAny();
            var fresh = newTalk(level);
            fresh.firstTime = false;
            talk = fresh;
            return renderConsult(level);
          }
          if (act === "copyws") {
            copyText(L.worksheetText(level.worksheet, save.worksheet)).then(function () {
              toast(D.ui.copied);
            });
          }
        });

        /*
         * 場面の 文・ヘンディさんの ことば・ヒントを コピーして 答えに 貼れない ように する
         *（2026-11-18「これらのメッセージエリアの文字のコピペ禁止」）。自分で 書く メモの 中は ふつうに 使える。
         * 文字で 送る 欄（マイクが 使えない とき）には、貼り付けも 落とし込みも させない。
         */
        function inTextField(node) {
          return !!(node && node.closest && node.closest("textarea, input"));
        }
        ["copy", "cut", "dragstart"].forEach(function (name) {
          document.addEventListener(name, function (event) {
            if (!inTextField(event.target)) event.preventDefault();
          });
        });
        ["paste", "drop"].forEach(function (name) {
          document.addEventListener(name, function (event) {
            if (event.target && event.target.id === "typed") event.preventDefault();
          });
        });

        document.addEventListener("keydown", function (event) {
          var target = event.target;
          /* 説明を 見返して いる とき: ← → で めくり、Esc で 相談に もどる */
          if (talk && talk.review != null && view.screen === "level") {
            var lv = LEVELS[view.level];
            var total = reviewSlides(lv).length;
            if (event.key === "Escape") talk.review = null;
            else if (event.key === "ArrowRight") talk.review = Math.min(total - 1, talk.review + 1);
            else if (event.key === "ArrowLeft") talk.review = Math.max(0, talk.review - 1);
            else return;
            event.preventDefault();
            renderConsult(lv);
            return;
          }
          if (target && target.closest && target.closest("input, textarea, button, a, select")) return;
          if (event.key === "ArrowLeft") {
            event.preventDefault();
            back();
          } else if (event.key === "ArrowRight" || event.key === "Enter" || event.key === " ") {
            if (view.screen === "intro") {
              event.preventDefault();
              next();
              return;
            }
            if (view.screen !== "level") return;
            var page = pagesFor(LEVELS[view.level])[view.page];
            if (page.type === "desk" || page.type === "consult" || page.type === "reply") return;
            if (page.type === "slide" && page.slide.kind === "worksheet") return;
            event.preventDefault();
            next();
          }
        });

        /* ============================================================ はじめ */

        document.title = D.title.replace(/\{([^{}|]+)\|[^{}|]+\}/g, "$1");
        adoptAppFonts();
        post({ type: "nexmax:link-owns-done" });
        post({ type: "nexmax:link-progress-request" });
        /*
         * アプリの 外（べつの タブ）で 開いた ときは、アプリの 中の この 教材へ 戻す。マイクと
         * 判定は アプリの Live を 使うので、外では 動かない（2026-11-18 要望 #764・#766）。
         * 学生には 説明を 出さず、そのまま 移る。
         */
        if (!inFrame) {
          window.location.replace("/link/" + LINK_ID);
          return;
        }
        if (!save.introSeen) {
          view = { screen: "intro", level: 0, page: 0, intro: 0 };
        } else if (save.at && typeof save.at.level === "number" && save.at.level < L.openLevelCount(save, LEVELS.length)) {
          view = { screen: "level", level: save.at.level, page: Math.max(0, Math.min(save.at.page || 0, pagesFor(LEVELS[save.at.level]).length - 1)), intro: 0 };
          /* 相談の 途中から 開き直したら、話しかける 前から（席の 絵）やり直す */
          var resumed = pagesFor(LEVELS[view.level])[view.page];
          if (resumed && (resumed.type === "consult" || resumed.type === "reply") && !(save.levels[LEVELS[view.level].id] || {}).stars) {
            view.page = pagesFor(LEVELS[view.level]).findIndex(function (p) {
              return p.type === "desk";
            });
          }
        }
        render();
      })();
    </script>
  </body>
</html>
