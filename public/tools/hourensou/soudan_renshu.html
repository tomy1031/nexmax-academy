<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 見出しは データから 入れる（このファイルに 学生向けの 日本語を 書かない）。 -->
    <title></title>
    <style>
      /* =====================================================================
       * 相談の 練習問題 — エンジンの 見た目
       *
       * 文言は soudan_renshu.data.js だけが 持つ。ここは 色と かたちだけ。
       * 色は「あおぞらパスウェイ」（docs/design/04）から。ゲームの 画面の ように、
       * 絵を 大きく 出し、文は その 下に 短く 出す（ノベルの メッセージ枠）。
       * 390px（教室の スマホ）でも 使える ように、横が せまい ときは 縦に 積む。
       * ===================================================================== */
      :root {
        --sky: #0288d1;
        --sky-deep: #0272ae;
        --sky-soft: #e1f2fb;
        --navy: #004f8d;
        --night: #0b2138;
        --ink: #1f3a56;
        --ink-soft: #5a7089;
        --ink-faint: #9db0c2;
        --leaf: #58c273;
        --leaf-deep: #3aa458;
        --leaf-soft: #e6f6ea;
        --sun: #ffc93c;
        --sun-deep: #f0a819;
        --sun-soft: #fff4d6;
        --coral: #ff8a70;
        --coral-deep: #f2654a;
        --coral-soft: #ffe9e3;
        --grape: #9b7be0;
        --grape-deep: #7b5bc4;
        --grape-soft: #f0eafc;
        --line: #dcebf5;
        --cream: #fff7e8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        -webkit-text-size-adjust: 100%;
      }
      body {
        /* 丸ゴシック（アプリと 同じ M PLUS Rounded 1c。字の 定義は 親の 画面から 借りる・adoptAppFonts） */
        font-family:
          "M PLUS Rounded 1c",
          "Hiragino Maru Gothic ProN",
          "Noto Sans JP",
          "Hiragino Kaku Gothic ProN",
          "Yu Gothic",
          system-ui,
          sans-serif;
        font-weight: 500;
        font-size: 16px;
        line-height: 1.7;
        color: var(--ink);
        background: var(--night);
        overflow: hidden;
        /* 画面の 文は 選べない（コピーして 答えに 貼らせない・2026-11-18 要望 #770）。自分で 書く 欄だけ 選べる */
        -webkit-user-select: none;
        user-select: none;
      }
      textarea,
      input {
        -webkit-user-select: text;
        user-select: text;
      }
      body.nofuri rt {
        display: none;
      }
      rt {
        font-size: 0.5em;
        font-weight: 700;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        background: none;
        color: inherit;
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      button:focus-visible,
      a:focus-visible,
      textarea:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--sun);
        outline-offset: 2px;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ---------------- 上の 帯（白・2026-11-18 の 見本） ---------------- */
      .bar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
        background: #fff;
        color: #13263f;
        min-height: 54px;
        border-bottom: 1px solid #e3ecf5;
        box-shadow: 0 2px 8px rgba(18, 60, 110, 0.05);
        position: relative;
        z-index: 3;
      }
      .bar-btn {
        flex: 0 0 auto;
        border-radius: 999px;
        padding: 4px 14px;
        font-size: 13px;
        font-weight: 800;
        background: #fff;
        color: var(--navy);
        border: 2px solid #d9e6f2;
      }
      .bar-title {
        flex: 1 1 auto;
        min-width: 0;
        font-weight: 800;
        font-size: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #13263f;
      }
      .bar-title .ic {
        color: var(--sky);
        margin-right: 6px;
      }
      .furi {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .furi .switch {
        width: 40px;
        height: 22px;
        border-radius: 999px;
        background: #c9d4df;
        position: relative;
        transition: background 0.2s;
      }
      .furi .switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.2s;
      }
      .furi.on .switch {
        background: var(--sky);
      }
      .furi.on .switch::after {
        left: 21px;
      }
      .steps {
        display: flex;
        gap: 4px;
        list-style: none;
        flex: 0 0 auto;
      }
      .steps li {
        font-size: 12px;
        font-weight: 800;
        padding: 2px 10px;
        border-radius: 999px;
        background: #eef3f8;
        color: #7b8da1;
      }
      .steps li.now {
        background: var(--sun);
        color: #3a2a00;
      }
      .steps li.done {
        background: #dff3e5;
        color: var(--leaf-deep);
      }
      @media (max-width: 720px) {
        .steps li {
          padding: 2px 6px;
          font-size: 11px;
        }
        .bar-title {
          font-size: 13px;
        }
      }
      @media (max-width: 520px) {
        .steps {
          display: none;
        }
      }

      .screen {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
        overflow: hidden;
      }
      .scroll {
        height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* ---------------- ボタン ---------------- */
      /*
       * ボタンは ふつうの 文の 並べ方に する（flex に すると、ルビと 文の 切れ端が 1つずつ
       * 箱に なり、せまい 画面で「ヘンディさ／ん、」の ように 割れる）。
       */
      .btn {
        display: inline-block;
        text-align: center;
        line-break: strict;
        min-height: 48px;
        padding: 8px 20px;
        border-radius: 999px;
        font-weight: 900;
        font-size: 16px;
        border: 2px solid var(--sky-deep);
        background: linear-gradient(180deg, #2aa3e6 0%, var(--sky) 100%);
        color: #fff;
        box-shadow: 0 4px 0 var(--sky-deep);
      }
      .btn:active:not(:disabled) {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--sky-deep);
      }
      .btn.sub {
        background: #fff;
        color: var(--navy);
        border-color: var(--line);
        box-shadow: 0 3px 0 var(--line);
      }
      .btn.go {
        background: linear-gradient(180deg, #ffa189 0%, var(--coral) 100%);
        border-color: var(--coral-deep);
        box-shadow: 0 4px 0 var(--coral-deep);
      }
      .btn.leaf {
        background: linear-gradient(180deg, #74d68c 0%, var(--leaf) 100%);
        border-color: var(--leaf-deep);
        box-shadow: 0 4px 0 var(--leaf-deep);
      }
      .btn.small {
        min-height: 38px;
        padding: 4px 14px;
        font-size: 14px;
      }
      .linkbtn {
        font-size: 14px;
        font-weight: 800;
        color: var(--sky-deep);
        text-decoration: underline;
        padding: 4px;
      }

      /* ---------------- 絵と 文（ノベルの 枠） ---------------- */
      .slide {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .pic {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, #16385c, var(--night));
        cursor: pointer;
        overflow: hidden;
      }
      .pic > img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
      }
      .panelpic {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        background: linear-gradient(180deg, #d8f0fc 0%, #f4fbff 55%, var(--cream) 100%);
        padding: 14px;
      }
      .caption {
        flex: 0 0 auto;
        background: #fff;
        border-top: 4px solid var(--sky);
        padding: 12px 16px 10px;
        max-height: 46%;
        overflow-y: auto;
      }
      .caption .text {
        font-size: clamp(17px, 2.1vw, 23px);
        font-weight: 800;
        line-height: 2.05;
      }
      .quote {
        margin: 4px 0 2px;
        background: var(--sky-soft);
        border: 2px solid var(--sky);
        border-radius: 16px;
        padding: 4px 12px;
        font-weight: 800;
        line-height: 2;
        font-size: clamp(15px, 1.8vw, 19px);
      }
      .quote .who-name {
        display: block;
        font-size: 12px;
        color: var(--sky-deep);
      }
      .caption .note {
        display: inline-block;
        margin-top: 4px;
        font-size: 14px;
        font-weight: 800;
        color: var(--navy);
        background: var(--sun-soft);
        border: 1px solid var(--sun);
        border-radius: 10px;
        padding: 2px 10px;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .tap-hint {
        position: absolute;
        right: 12px;
        bottom: 10px;
        font-size: 13px;
        font-weight: 800;
        color: #fff;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 999px;
        padding: 2px 10px;
        pointer-events: none;
      }

      /* ---------------- カード（並べて 比べる もの） ---------------- */
      .cards {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        align-items: stretch;
      }
      /* 並べて 比べる A・B・C は、せまい 画面でも 横に 3つ（注意事項「並べて比べるものは横に並べる」） */
      @media (max-width: 600px) {
        .cards.opts {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 6px;
        }
        .cards.opts .card .body {
          padding: 4px 6px 8px;
          font-size: 13px;
          line-height: 1.8;
        }
        .cards.opts .card .sub {
          font-size: 11px;
        }
        .cards.opts .card .key {
          width: 24px;
          height: 24px;
          display: flex;
          margin: 0 0 2px;
        }
      }
      .cards.five {
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      }
      .card {
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 3px 0 var(--line);
      }
      .card img {
        width: 100%;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        display: block;
        background: var(--sky-soft);
      }
      .card .body {
        padding: 8px 12px 12px;
        font-weight: 800;
        line-height: 1.9;
      }
      .card .sub {
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-soft);
      }
      .card .key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--navy);
        color: #fff;
        font-weight: 900;
        margin-right: 6px;
        vertical-align: middle;
      }
      .panel-title {
        font-size: clamp(18px, 2.2vw, 24px);
        font-weight: 900;
        color: var(--navy);
        margin-bottom: 10px;
        line-height: 2;
      }

      /* 5つの 型の 色 */
      .c-sky {
        --c: var(--sky);
        --cs: var(--sky-soft);
      }
      .c-coral {
        --c: var(--coral-deep);
        --cs: var(--coral-soft);
      }
      .c-leaf {
        --c: var(--leaf-deep);
        --cs: var(--leaf-soft);
      }
      .c-sun {
        --c: var(--sun-deep);
        --cs: var(--sun-soft);
      }
      .c-grape {
        --c: var(--grape-deep);
        --cs: var(--grape-soft);
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 999px;
        padding: 0 10px;
        font-size: 13px;
        font-weight: 900;
        background: var(--cs);
        color: var(--c);
        border: 1.5px solid var(--c);
        white-space: nowrap;
        line-height: 1.9;
      }
      .card.part {
        border-color: var(--c);
        box-shadow: 0 3px 0 var(--c);
      }
      .card.part .head {
        background: var(--cs);
        color: var(--c);
        font-weight: 900;
        padding: 4px 12px;
        line-height: 2;
      }
      .ladder {
        margin-top: 14px;
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 16px;
        padding: 10px 12px;
      }
      .ladder-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px dashed var(--line);
        flex-wrap: wrap;
      }
      .ladder-row:last-child {
        border-bottom: 0;
      }
      .ladder-row .lv {
        font-weight: 900;
        min-width: 210px;
      }
      .dot {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        border: 2px solid var(--line);
        background: #f5f8fb;
        opacity: 0.35;
      }
      .dot.on {
        opacity: 1;
        border-color: var(--c);
        background: var(--cs);
      }

      /* 流れ */
      .flow {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        counter-reset: f;
      }
      .flow .step {
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 18px;
        padding: 14px 10px;
        text-align: center;
        font-weight: 900;
        line-height: 1.9;
        position: relative;
      }
      .flow .step .shot {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        object-position: top;
        border-radius: 12px;
        border: 2px solid var(--line);
        margin: 18px 0 6px;
        background: var(--sky-soft);
      }
      .flow .step .ic {
        font-size: 44px;
        display: block;
        line-height: 1.3;
      }
      .flow .step::before {
        counter-increment: f;
        content: counter(f);
        position: absolute;
        left: 8px;
        top: 6px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--navy);
        color: #fff;
        font-size: 14px;
        line-height: 26px;
      }

      /* 日にちの 線 */
      .timeline {
        display: flex;
        align-items: stretch;
        gap: 6px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      .day {
        flex: 1 1 170px;
        max-width: 260px;
        min-height: 190px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        font-size: 18px;
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 18px;
        text-align: center;
        padding: 12px 8px;
        font-weight: 900;
        line-height: 1.9;
      }
      .day .ic {
        font-size: 64px;
        display: block;
        line-height: 1.3;
      }
      .day .lab {
        font-size: 22px;
        color: var(--navy);
      }
      .day.due {
        border-color: var(--coral-deep);
        background: var(--coral-soft);
      }
      .day.late {
        border-color: var(--sun-deep);
        background: var(--sun-soft);
      }
      .arrow {
        align-self: center;
        font-size: 28px;
        color: var(--ink-faint);
        font-weight: 900;
      }
      .clash {
        margin: 18px auto 0;
        max-width: 720px;
        text-align: center;
        font-weight: 900;
        color: #fff;
        background: var(--coral-deep);
        border-radius: 16px;
        padding: 6px 16px;
        font-size: clamp(17px, 2.2vw, 24px);
        line-height: 2;
      }
      .clash rt {
        color: #fff;
      }

      /* 時間の 棒 */
      .bars {
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        max-width: 900px;
        margin: 16px auto 0;
        font-size: 18px;
      }
      .barrow {
        display: grid;
        grid-template-columns: minmax(110px, 180px) 1fr;
        gap: 10px;
        align-items: center;
        margin: 10px 0;
        font-weight: 900;
        line-height: 1.8;
      }
      .track {
        position: relative;
        height: 64px;
        background: #f2f6fa;
        border-radius: 10px;
      }
      .fill {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 900;
        font-size: 20px;
        white-space: nowrap;
        overflow: hidden;
      }
      .fill.cap {
        background: var(--leaf);
      }
      .fill.t0 {
        background: var(--sky);
      }
      .fill.t1 {
        background: repeating-linear-gradient(45deg, var(--coral) 0 12px, var(--coral-deep) 12px 24px);
      }
      .limit {
        position: absolute;
        top: -6px;
        bottom: -6px;
        width: 0;
        border-left: 3px dashed var(--coral-deep);
      }
      /* 今日の 予定の 帯 */
      .daytrack {
        display: flex;
        height: 48px;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid var(--line);
      }
      .daytrack .blk {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--leaf);
        color: #fff;
        font-weight: 900;
        font-size: 18px;
        white-space: nowrap;
      }
      .daytrack .blk + .blk {
        border-left: 2px solid #fff;
      }
      .daytrack .blk.rest {
        background: #d9e2ec;
        color: var(--ink-soft);
        font-size: 14px;
      }
      .dayticks {
        position: relative;
        height: 22px;
        font-size: 13px;
        font-weight: 900;
        color: var(--ink-soft);
      }
      .dayticks .tick {
        position: absolute;
        top: 2px;
        transform: translateX(-50%);
      }
      .dayticks .tick:first-child {
        transform: none;
      }
      .dayticks .tick.end {
        transform: translateX(-100%);
      }
      .over {
        text-align: center;
        font-weight: 900;
        font-size: 22px;
        color: var(--coral-deep);
        margin-top: 6px;
      }

      /* 依頼・指示・条件・請求書 */
      .sheet {
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 18px;
        padding: 14px 16px;
        max-width: 900px;
        margin: 0 auto;
      }
      .sheet ul {
        list-style: none;
        display: grid;
        gap: 8px;
      }
      .sheet li {
        background: var(--sky-soft);
        border-radius: 12px;
        padding: 6px 12px;
        font-weight: 800;
        line-height: 2;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .who img {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--sky);
        background: #fff;
      }
      .who .ic {
        font-size: 44px;
      }
      table.cond {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      table.cond th,
      table.cond td {
        border: 1px solid var(--line);
        padding: 4px 10px;
        text-align: left;
        vertical-align: top;
        line-height: 2;
      }
      table.cond th {
        background: var(--sky-soft);
        color: var(--navy);
        white-space: nowrap;
        width: 30%;
      }
      .fine {
        font-size: 13px;
        color: var(--ink-soft);
        font-weight: 700;
        margin-top: 8px;
      }
      .invoice {
        background: #fffdf8;
        border: 1px solid #d9cbb0;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        border-radius: 6px;
        padding: 18px 20px;
        max-width: 640px;
        margin: 0 auto;
        font-size: 15px;
        line-height: 2;
      }
      .invoice h3 {
        text-align: center;
        font-size: 26px;
        letter-spacing: 0.4em;
        border-bottom: 3px double var(--ink);
        margin-bottom: 8px;
      }
      .inv-meta {
        display: flex;
        justify-content: flex-end;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 14px;
      }
      .inv-to {
        font-weight: 900;
        font-size: 17px;
        border-bottom: 1px solid var(--ink);
        display: inline-block;
        margin: 6px 0;
      }
      .invoice table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0;
      }
      .invoice th,
      .invoice td {
        border: 1px solid #c9bda5;
        padding: 2px 8px;
      }
      .invoice th {
        background: #f3ead8;
      }
      .invoice td.num {
        text-align: right;
      }
      .inv-total {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 16px;
        max-width: 320px;
        margin-left: auto;
      }
      .inv-total .grand {
        font-weight: 900;
        font-size: 18px;
        border-top: 2px solid var(--ink);
      }

      /* ---------------- タイトル（2026-11-18 tomy さんの 見本: 明るい 地・丸ゴシック・白い カード） ---------------- */
      .title-screen {
        position: relative;
        min-height: 100%;
        overflow: hidden;
        background: linear-gradient(118deg, #ffffff 0%, #f6fbff 48%, #e6f3fd 100%);
      }
      .title-screen::before {
        content: "";
        position: absolute;
        left: 22%;
        top: -30%;
        width: 60%;
        height: 80%;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(2, 136, 209, 0.08), rgba(2, 136, 209, 0));
        pointer-events: none;
      }
      .title-photo {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 42%;
        background: url("/img/novel/office_morning.webp") center / cover no-repeat;
        clip-path: polygon(9% 0, 100% 0, 100% 100%, 0 100%);
      }
      .title-hendy {
        position: absolute;
        right: 3%;
        bottom: 0;
        height: 94%;
        max-height: 700px;
        pointer-events: none;
      }
      .title-inner {
        position: relative;
        padding: 26px 28px 30px;
        width: 60%;
        min-width: 340px;
      }
      @media (max-width: 860px) {
        .title-photo,
        .title-hendy {
          display: none;
        }
        .title-inner {
          width: auto;
          min-width: 0;
          padding: 18px 14px 24px;
        }
      }
      .title-h1 {
        font-size: clamp(30px, 4.4vw, 54px);
        font-weight: 800;
        color: #12263f;
        line-height: 1.75;
        border-left: 7px solid var(--sky);
        padding-left: 16px;
        letter-spacing: 0.02em;
      }
      .title-inner .lead {
        font-weight: 700;
        color: #23405e;
        font-size: clamp(16px, 1.7vw, 20px);
        margin: 2px 0 16px;
        line-height: 2;
      }
      .intro-btn {
        min-width: 200px;
        font-size: 18px;
        letter-spacing: 0.06em;
      }
      .levels {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }
      .lvbtn {
        display: grid;
        grid-template-columns: 76px auto 2px minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
        text-align: left;
        background: #fff;
        color: var(--ink);
        border-radius: 18px;
        padding: 10px 16px 10px 12px;
        border: 2px solid #e2edf7;
        box-shadow: 0 6px 16px rgba(18, 60, 110, 0.08);
      }
      .lvbtn.current {
        border-color: var(--sky);
        background: #f3f9ff;
        box-shadow: 0 0 0 3px rgba(2, 136, 209, 0.12), 0 6px 16px rgba(18, 60, 110, 0.08);
      }
      .lvbtn .no {
        width: 76px;
        height: 76px;
        border-radius: 14px;
        background: linear-gradient(180deg, #2196f3 0%, #0d63c8 100%);
        color: #fff;
        font-weight: 800;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1.05;
        font-size: 34px;
        box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
      }
      .lvbtn .no small {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 2px;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 800;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--sun);
        color: #3a2a00;
        margin-right: 6px;
        vertical-align: middle;
        line-height: 1.8;
      }
      .lvbtn .badge {
        display: inline-block;
        min-width: 96px;
        text-align: center;
        font-size: 17px;
        font-weight: 800;
        padding: 4px 16px;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffe48f 0%, #ffd15a 100%);
        color: #4a3300;
        line-height: 1.9;
        margin: 0;
        white-space: nowrap;
      }
      .lvbtn .sep {
        width: 2px;
        height: 44px;
        background: #dfe8f1;
        border-radius: 2px;
      }
      .lvbtn .txt {
        min-width: 0;
      }
      .lvbtn .name {
        display: block;
        font-weight: 800;
        font-size: clamp(18px, 2vw, 24px);
        line-height: 1.9;
        color: #13263f;
      }
      .lvbtn .goal {
        display: block;
        font-size: 15px;
        color: #5d7189;
        font-weight: 700;
        line-height: 1.9;
      }
      .lvbtn .end {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .lvbtn .got {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        font-weight: 800;
        font-size: 15px;
      }
      .lvbtn .got small {
        font-size: 12px;
        color: var(--ink-soft);
      }
      .go-circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--sky);
        color: #fff;
        font-size: 28px;
        line-height: 36px;
        text-align: center;
        font-weight: 800;
        box-shadow: 0 3px 8px rgba(2, 136, 209, 0.35);
      }
      .lock {
        width: 30px;
        height: 30px;
        fill: #a6b3c1;
      }
      .lvbtn.locked {
        background: #fbfdff;
        cursor: default;
      }
      /* レベル5は 金の 特別な カード（2026-11-20「レベル5をもっと特別に」→「金色の特別なカード」） */
      .lvbtn.special {
        border-color: #f0a819;
        background: linear-gradient(180deg, #fffaea 0%, #fff1c9 100%);
        box-shadow: 0 0 0 3px rgba(240, 168, 25, 0.18), 0 6px 16px rgba(160, 110, 0, 0.12);
      }
      .lvbtn.special .no {
        background: linear-gradient(180deg, #f8c64a 0%, #e09b0b 100%);
      }
      .lvbtn.special .badge {
        background: linear-gradient(180deg, #f6b730 0%, #e08f00 100%);
        color: #fff;
      }
      .lvbtn.special.locked .no {
        background: linear-gradient(180deg, #e7c77a 0%, #c9a24e 100%);
      }
      .btn.special-go {
        background: linear-gradient(180deg, #f8c64a 0%, #e09b0b 100%);
        color: #3d2a00;
        box-shadow: 0 4px 0 #b77800;
      }
      /* 見本どおり、ロックの カードも 字は 濃い まま（ブラウザの「押せない ボタンを 薄く する」を 打ち消す） */
      .lvbtn:disabled {
        opacity: 1;
      }
      .lvbtn.locked .badge {
        filter: saturate(0.6);
      }
      .lvbtn.locked .no {
        background: linear-gradient(180deg, #8d99a7 0%, #6f7c8b 100%);
      }
      .lvbtn.locked .name {
        color: #2a3b4f;
      }
      @media (max-width: 560px) {
        .lvbtn {
          grid-template-columns: 58px minmax(0, 1fr) auto;
          gap: 10px;
        }
        .lvbtn .no {
          width: 58px;
          height: 58px;
          font-size: 26px;
        }
        .lvbtn .badge,
        .lvbtn .sep {
          display: none;
        }
      }
      .keybox {
        margin-top: 14px;
        background: #fff;
        border: 2px solid #e2edf7;
        border-radius: 14px;
        padding: 10px 12px;
        font-weight: 800;
        font-size: 14px;
        line-height: 1.9;
      }
      .keyform input {
        width: 100%;
        margin: 6px 0;
        font: inherit;
        padding: 6px 10px;
        border: 2px solid var(--line);
        border-radius: 10px;
      }
      .stars {
        color: var(--sun-deep);
        letter-spacing: 1px;
      }
      .stars .off {
        color: #cfd8e2;
      }

      /* ---------------- レベルの 表紙 ---------------- */
      .cover-text {
        text-align: center;
      }
      .cover-text .lvno {
        font-size: 16px;
        font-weight: 900;
        color: var(--sky-deep);
      }
      .cover-text h2 {
        font-size: clamp(22px, 3vw, 32px);
        font-weight: 900;
        color: var(--navy);
        line-height: 1.9;
      }
      .cover-text .goal {
        display: inline-block;
        font-weight: 900;
        background: var(--sun-soft);
        border: 2px solid var(--sun);
        border-radius: 12px;
        padding: 2px 14px;
        line-height: 2;
      }

      /* ---------------- 伝える こと（チェック） ---------------- */
      .checks {
        display: grid;
        gap: 8px;
        max-width: 980px;
        margin: 0 auto;
      }
      .check {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 10px;
        align-items: center;
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 16px;
        padding: 6px 10px;
      }
      .check .n {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--navy);
        color: #fff;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .check .ask {
        font-weight: 900;
        line-height: 2;
      }
      .check .tags {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 2px;
      }
      .check .thumb {
        width: 96px;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        border-radius: 10px;
        border: 2px solid var(--line);
      }
      @media (max-width: 520px) {
        .check .thumb {
          width: 64px;
        }
      }
      .check.ok {
        border-color: var(--leaf);
        background: var(--leaf-soft);
      }
      .check.miss {
        border-color: var(--coral-deep);
        background: var(--coral-soft);
        animation: glow 1.2s ease-in-out 3;
      }
      .check .mark {
        font-size: 22px;
        font-weight: 900;
      }
      @keyframes glow {
        50% {
          box-shadow: 0 0 0 6px rgba(242, 101, 74, 0.35);
        }
      }
      .memo {
        display: block;
        margin-top: 4px;
      }
      .memo span {
        font-size: 13px;
        font-weight: 900;
        color: var(--navy);
      }
      .memo textarea {
        min-height: 44px;
        font-size: 15px;
      }
      .memo-read {
        margin-top: 2px;
        background: var(--sun-soft);
        border-radius: 10px;
        padding: 2px 10px;
        font-weight: 800;
        font-size: 15px;
        line-height: 1.8;
      }
      .memo-lead {
        display: block;
        font-size: 15px;
        color: var(--ink-soft);
      }
      .lead-box {
        max-width: 980px;
        margin: 0 auto 10px;
        font-weight: 900;
        line-height: 2;
        font-size: 17px;
      }

      /* ---------------- 席の 絵（タイミング） ---------------- */
      .desk {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .desk-stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        background: var(--night);
        overflow: hidden;
      }
      .desk-stage .layer {
        position: absolute;
        inset: 0;
      }
      .desk-stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: opacity 0.3s;
      }
      .desk-stage.busy .layer {
        animation: jitter 0.35s linear infinite;
      }
      @keyframes jitter {
        25% {
          transform: translateX(-3px);
        }
        75% {
          transform: translateX(3px);
        }
      }
      .desk-stage.shake .layer {
        animation: shake 0.5s;
      }
      @keyframes shake {
        15% {
          transform: translateX(-16px);
        }
        30% {
          transform: translateX(16px);
        }
        45% {
          transform: translateX(-12px);
        }
        60% {
          transform: translateX(12px);
        }
        80% {
          transform: translateX(-6px);
        }
      }
      .desk-top {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 8px;
        background: rgba(255, 255, 255, 0.93);
        border-radius: 14px;
        padding: 4px 12px;
        font-weight: 900;
        font-size: 15px;
        line-height: 2;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }
      .desk-top .wait {
        display: block;
        font-size: 13px;
        color: var(--ink-soft);
      }
      .live {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        font-weight: 900;
        padding: 4px 14px;
        border-radius: 999px;
        background: rgba(11, 33, 56, 0.8);
        color: #fff;
        line-height: 2;
      }
      .live.ok {
        background: rgba(58, 164, 88, 0.92);
      }
      .desk-bottom {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .wrong {
        max-width: 560px;
        background: rgba(255, 255, 255, 0.96);
        color: var(--coral-deep);
        font-weight: 900;
        border-radius: 14px;
        padding: 4px 14px;
        text-align: center;
        line-height: 2;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      }
      .legend {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        padding: 6px;
        background: #fff;
        border-top: 4px solid var(--sky);
      }
      .legend .lg {
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 6px;
        align-items: center;
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 4px;
        font-size: 13px;
        line-height: 1.7;
      }
      .legend .lg.okk {
        border-color: var(--leaf);
        background: var(--leaf-soft);
      }
      .legend img {
        width: 72px;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        border-radius: 8px;
      }
      .legend b {
        display: block;
        font-size: 14px;
      }
      .legend .what {
        color: var(--ink-soft);
        font-weight: 700;
      }
      .legend-title {
        grid-column: 1 / -1;
        font-weight: 900;
        font-size: 13px;
        color: var(--navy);
      }
      @media (max-width: 760px) {
        .legend {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .legend .what {
          display: none;
        }
        .legend .lg {
          grid-template-columns: 56px 1fr;
        }
        .legend img {
          width: 56px;
        }
      }

      /* ---------------- 相談（マイク） ---------------- */
      .consult {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
        grid-template-rows: minmax(0, 1fr);
        height: 100%;
      }
      .consult > .talk {
        min-height: 0;
      }
      @media (max-width: 860px) {
        .consult {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: 34% minmax(0, 1fr);
        }
      }
      .scene {
        position: relative;
        overflow: hidden;
        background: url("/img/novel/office_morning.webp") center / cover no-repeat;
      }
      .scene .fig {
        position: absolute;
        right: 6%;
        bottom: 0;
        height: 92%;
        max-width: 80%;
        object-fit: contain;
        object-position: bottom;
        transition: transform 0.2s;
      }
      .bubble {
        position: absolute;
        left: 8px;
        top: 10px;
        max-width: 72%;
        background: #fff;
        border: 3px solid var(--navy);
        border-radius: 18px;
        padding: 6px 14px;
        font-weight: 900;
        line-height: 2;
        font-size: 16px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
      }
      .bubble .who-name {
        display: block;
        font-size: 12px;
        color: var(--sky-deep);
      }
      .talk {
        background: linear-gradient(180deg, #eef8fe 0%, #fff 40%);
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .talk .checks .check {
        padding: 4px 8px;
      }
      .talk .check .ask {
        font-size: 15px;
      }
      .talk .check .thumb {
        width: 64px;
      }
      .box {
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 16px;
        padding: 10px 12px;
        line-height: 2;
      }
      .box.hints {
        background: var(--sun-soft);
        border-color: var(--sun);
        font-weight: 800;
      }
      .box.hints p {
        margin: 2px 0;
      }
      /* ヒントは 型（5つ）ごとに まとめる（2026-11-18「型と伝えたい内容が整理されていない」） */
      .hint-part {
        margin: 6px 0;
        padding: 4px 0 4px 10px;
        border-left: 5px solid var(--c);
      }
      .hint-part .hp-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .hint-part .hp-no {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--navy);
        color: #fff;
        font-size: 13px;
        font-weight: 900;
      }
      .hint-part .hp-ask {
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-soft);
      }
      .hint-part p {
        margin: 2px 0 0;
        font-weight: 800;
      }
      /* お手本の 中の ボーナスの 文（2026-11-18「お手本の中にボーナスとなる内容がありません」） */
      .bonus-chip {
        display: inline-block;
        margin-left: 6px;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--sun-soft);
        border: 1.5px solid var(--sun-deep);
        color: var(--sun-deep);
        font-size: 12px;
        font-weight: 900;
        line-height: 1.9;
        white-space: nowrap;
      }
      .seg.cont {
        margin-top: -2px;
      }
      /* お手本を 読む 練習 */
      .read-model {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 2px dashed var(--line);
        text-align: center;
      }
      .read-result {
        margin: 6px 0;
        padding: 6px 10px;
        border-radius: 12px;
        font-weight: 900;
        text-align: left;
      }
      .read-result.ok {
        background: var(--leaf-soft);
        color: var(--leaf-deep);
      }
      .read-result.ng {
        background: var(--coral-soft);
        color: var(--coral-deep);
      }
      .box.heard {
        border-color: var(--sky);
      }
      .box.heard .said {
        font-size: 18px;
        font-weight: 800;
      }
      .box.model {
        border-color: var(--leaf);
      }
      .box h4 {
        font-size: 15px;
        font-weight: 900;
        color: var(--navy);
        margin-bottom: 4px;
      }
      .seg {
        display: block;
        margin: 4px 0;
        padding-left: 10px;
        border-left: 5px solid var(--c);
        font-weight: 700;
      }
      .seg .tag {
        margin-right: 6px;
        font-size: 12px;
      }
      .talk {
        padding-bottom: 0 !important;
      }
      .consult {
        position: relative;
      }
      .review-btn {
        position: absolute;
        left: 8px;
        bottom: 10px;
        z-index: 2;
      }
      .review {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        background: var(--night);
      }
      .review-head {
        flex: 0 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        color: #fff;
        font-weight: 900;
      }
      .review .pic {
        cursor: default;
      }
      .talk-controls {
        position: sticky;
        bottom: 0;
        margin: auto -12px 0;
        padding: 6px 12px 14px;
        background: rgba(255, 255, 255, 0.97);
        border-top: 3px solid var(--coral);
        box-shadow: 0 -6px 14px rgba(0, 0, 0, 0.08);
        z-index: 2;
      }
      .talk-controls .mic {
        width: 92px;
        height: 92px;
        font-size: 13px;
      }
      .talk-controls .mic .ic {
        font-size: 30px;
      }
      .mic .lb {
        display: block;
        line-height: 1.5;
      }
      .talk-controls .fine {
        margin: 0 0 4px;
      }
      .mic-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .mic {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffb19f, var(--coral-deep));
        color: #fff;
        font-weight: 900;
        font-size: 15px;
        line-height: 1.6;
        box-shadow: 0 6px 0 #c94a33, 0 0 0 var(--ring, 0px) rgba(242, 101, 74, 0.35);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      .mic .ic {
        font-size: 40px;
        line-height: 1.1;
      }
      .mic.rec {
        background: radial-gradient(circle at 35% 30%, #ff7b7b, #d43b3b);
        animation: pulse 1.2s ease-in-out infinite;
      }
      /* お手本を 読む 練習の マイク（横長。丸い ままだと「読む」が 途中で 折り返した） */
      .mic.small {
        width: auto;
        height: auto;
        min-height: 56px;
        border-radius: 999px;
        flex-direction: row;
        gap: 8px;
        padding: 8px 22px;
        font-size: 15px;
        white-space: nowrap;
      }
      .mic.small .ic {
        font-size: 26px;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.05);
        }
      }
      .status {
        font-weight: 900;
        color: var(--navy);
        text-align: center;
        line-height: 2;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 5px solid var(--sky-soft);
        border-top-color: var(--sky);
        animation: spin 0.9s linear infinite;
        margin: 6px auto;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      textarea,
      .talk input[type="text"] {
        width: 100%;
        font: inherit;
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 8px 10px;
        min-height: 72px;
        resize: vertical;
        background: #fff;
      }
      .verdict {
        border-radius: 18px;
        padding: 10px 14px;
        border: 3px solid;
        line-height: 2;
      }
      .verdict.pass {
        border-color: var(--leaf-deep);
        background: var(--leaf-soft);
      }
      .verdict.retry {
        border-color: var(--coral-deep);
        background: var(--coral-soft);
      }
      .verdict .big {
        font-size: 24px;
        font-weight: 900;
      }
      .verdict.pass .big {
        color: var(--leaf-deep);
      }
      .verdict.retry .big {
        color: var(--coral-deep);
      }
      .verdict .next {
        margin-top: 4px;
        font-weight: 900;
        background: #fff;
        border-radius: 12px;
        padding: 2px 10px;
      }
      .plist {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 4px 0;
      }
      .plist .tag.no {
        opacity: 0.45;
        text-decoration: line-through;
      }
      .bonus-list {
        list-style: none;
        display: grid;
        gap: 4px;
      }
      .bonus-list li {
        font-weight: 800;
        line-height: 1.9;
      }
      .bonus-list li.got {
        color: var(--leaf-deep);
      }
      .bonus-list li.not {
        color: var(--ink-faint);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      details > summary {
        cursor: pointer;
        font-weight: 900;
        color: var(--navy);
      }

      /* ---------------- 結果（ヘンディさんの 答え） ---------------- */
      .reply {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        height: 100%;
      }
      @media (max-width: 860px) {
        .reply {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: 40% minmax(0, 1fr);
        }
      }
      .reply .pic {
        cursor: default;
      }

      /* ---------------- 調べ表 ---------------- */
      .ws {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        gap: 14px;
      }
      .ws section {
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 18px;
        padding: 12px 14px;
      }
      .ws h3 {
        font-size: 18px;
        font-weight: 900;
        color: var(--navy);
        line-height: 2;
      }
      .apis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 8px;
        margin: 8px 0;
      }
      .apis a {
        display: block;
        border: 2px solid var(--sky);
        border-radius: 14px;
        padding: 8px 12px;
        font-weight: 900;
        color: var(--navy);
        text-decoration: none;
        background: var(--sky-soft);
        line-height: 1.8;
      }
      .apis a small {
        display: block;
        font-size: 12px;
        color: var(--sky-deep);
        word-break: break-all;
      }
      .wsgrid {
        width: 100%;
        border-collapse: separate;
        border-spacing: 6px;
      }
      .wsgrid th {
        font-size: 14px;
        text-align: left;
        color: var(--navy);
        line-height: 1.8;
        vertical-align: top;
        padding-top: 6px;
      }
      .wsgrid .ws-ex {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-soft);
        line-height: 1.8;
      }
      .wsgrid textarea {
        min-height: 60px;
        font-size: 14px;
      }
      @media (max-width: 760px) {
        .wsgrid,
        .wsgrid tbody,
        .wsgrid tr,
        .wsgrid th,
        .wsgrid td {
          display: block;
          width: 100%;
        }
        .wsgrid thead {
          display: none;
        }
        .wsgrid td::before {
          content: attr(data-api);
          display: block;
          font-size: 12px;
          font-weight: 900;
          color: var(--sky-deep);
        }
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        background: var(--navy);
        color: #fff;
        font-weight: 900;
        border-radius: 999px;
        padding: 6px 18px;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <button type="button" class="bar-btn" id="homeBtn" hidden></button>
        <div class="bar-title" id="barTitle"></div>
        <ol class="steps" id="steps" hidden></ol>
        <button type="button" class="bar-btn furi on" id="furiBtn"></button>
      </header>
      <main class="screen" id="screen"></main>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>

    <script src="soudan_renshu.data.js"></script>
    <script src="soudan_renshu.logic.js"></script>
    <script>
      (function () {
        "use strict";
        var D = window.SOUDAN_RENSHU;
        var L = window.SOUDAN_LOGIC;
        var LINK_ID = D.id;
        var LEVELS = D.levels;
        var STORE_KEY = "nexmax:soudan_renshu:v1";
        var GEMINI_KEY = "nexmax.geminiKey";
        var TALK_LIMIT_MS = 60000;
        var WRONG_LOCK_MS = 2000;
        var SWITCH_GRACE_MS = 600;
        var screenEl = document.getElementById("screen");

        /* ============================================================ 文字 */

        function esc(text) {
          return String(text == null ? "" : text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        /** データの {表記|よみ} を <ruby> に する（ほかは エスケープ）。 */
        function R(text) {
          var source = String(text == null ? "" : text);
          var out = "";
          var re = /\{([^{}|]+)\|([^{}|]+)\}/g;
          var last = 0;
          var m;
          while ((m = re.exec(source))) {
            out += esc(source.slice(last, m.index));
            out += "<ruby>" + esc(m[1]) + "<rt>" + esc(m[2]) + "</rt></ruby>";
            last = re.lastIndex;
          }
          return out + esc(source.slice(last));
        }

        /**
         * 絵の URL に 版を 付ける。`/img/*` は 1年 使い回す 設定（public/_headers）なので、
         * 絵を 描き直した ときは データの `imageVersion` を 上げると 新しい 絵が 届く。
         */
        function img(path) {
          var url = String(path || "");
          return esc(url + (url.indexOf("?") < 0 ? "?v=" + (D.imageVersion || "1") : ""));
        }

        function partTag(key) {
          var part = D.parts[key];
          return '<span class="tag c-' + part.color + '">' + part.icon + " " + R(part.label) + "</span>";
        }

        function stars(n) {
          var out = '<span class="stars" aria-label="' + n + '">';
          for (var i = 1; i <= 3; i += 1) out += i <= n ? "★" : '<span class="off">★</span>';
          return out + "</span>";
        }

        function toast(text) {
          var el = document.getElementById("toast");
          el.innerHTML = R(text);
          el.hidden = false;
          clearTimeout(toast.timer);
          toast.timer = setTimeout(function () {
            el.hidden = true;
          }, 1800);
        }

        /**
         * 丸ゴシック（M PLUS Rounded 1c）の 字の 定義を、親の 画面（アプリ）から 借りる。
         * アプリは 字を 手元に 置いて いて（public/fonts/rounded・字の 範囲ごとに 分かれた ファイル）、
         * その 定義は アプリの CSS に ある。同じ 置き場なので 読める。ファイル名を ここに 写さない
         *（字を 作り直すと 名前が 変わる）。借りられない ときは 端末の 丸ゴシック・ゴシックに なる。
         */
        function adoptAppFonts() {
          try {
            if (!window.parent || window.parent === window) return;
            var sheets = window.parent.document.styleSheets;
            var rules = [];
            for (var i = 0; i < sheets.length; i += 1) {
              var list;
              try {
                list = sheets[i].cssRules;
              } catch (error) {
                continue;
              }
              for (var k = 0; k < list.length; k += 1) {
                var rule = list[k];
                if (rule.type === 5 && /M PLUS Rounded 1c/.test(rule.cssText)) rules.push(rule.cssText);
              }
            }
            if (rules.length === 0) return;
            var style = document.createElement("style");
            style.textContent = rules.join("\n");
            document.head.appendChild(style);
          } catch (error) {
            /* 借りられなくても 表示は 続ける */
          }
        }

        /* ============================================================ 保存 */

        function emptySave() {
          return {
            v: 1,
            owner: "",
            introSeen: false,
            furigana: true,
            levels: {},
            worksheet: { cells: {}, thoughts: {} },
            at: null,
          };
        }

        function loadSave() {
          try {
            var raw = JSON.parse(window.localStorage.getItem(STORE_KEY) || "null");
            if (raw && raw.v === 1) {
              var base = emptySave();
              return Object.assign(base, raw, {
                levels: raw.levels || {},
                worksheet: Object.assign(base.worksheet, raw.worksheet || {}),
              });
            }
          } catch (error) {
            /* 読めなければ 空から */
          }
          return emptySave();
        }

        var save = loadSave();

        function writeSave() {
          try {
            window.localStorage.setItem(STORE_KEY, JSON.stringify(save));
          } catch (error) {
            /* 保存できない 端末でも 練習は 止めない */
          }
        }

        /** 端末の 保存に 何か 進み具合が あるか。 */
        function hasProgress(one) {
          if (one.introSeen) return true;
          var levels = one.levels || {};
          for (var key in levels) if (levels[key] && levels[key].stars) return true;
          var ws = one.worksheet || {};
          var texts = Object.values(ws.cells || {}).concat(Object.values(ws.thoughts || {}));
          return texts.some(function (text) {
            return String(text || "").trim() !== "";
          });
        }

        function levelSave(id) {
          if (!save.levels[id]) save.levels[id] = { stars: 0, bonus: 0 };
          return save.levels[id];
        }

        /* ============================================================ 親の 画面と やりとり */

        var inFrame = window.parent && window.parent !== window;

        function post(message) {
          if (!inFrame) return;
          try {
            window.parent.postMessage(Object.assign({ id: LINK_ID }, message), window.location.origin);
          } catch (error) {
            /* 記録できなくても 練習は 止めない */
          }
        }

        /**
         * ✅（ステージを 進める）に 要る レベルの 数。レベル5は 挑戦（やらなくても よい）
         *（2026-11-20「レベル4までで修了証」→ 選択「レベル5は挑戦（やらなくてもよい）」）。
         */
        var REQUIRED = Math.min(LEVELS.length, D.requiredLevels || LEVELS.length);

        /** 進み具合を 親へ（親が 学習の 記録に 写し、Supabase に 送る）。 */
        function reportProgress() {
          var done = L.requiredCleared(save, REQUIRED);
          post({
            type: "nexmax:link-progress",
            status: done ? "completed" : "started",
            position: L.toPosition(save, LEVELS.length),
          });
          if (done) post({ type: "nexmax:link-done" });
        }

        /*
         * 修了証を 親に 頼む（2026-11-20「レベル4までで修了証」「レベル5の特別な修了証」）。
         * - レベル1〜4 を ぜんぶ 合格したら main、レベル5（特別課題）に 合格したら special
         * - 親が 出したら（または もう あったら）知らせて くる（ack）。それまでは 開く たびに 頼む
         *   （DB で 2枚目は 出ない）。この 画面では 1種類 1回だけ 頼む
         * - やり直しは **はじめて 合格した 回**の 数。分からない レベルは null（修了証が できる 前に
         *   終えた。2026-11-20 の 選択「すでに終えた学生には1回だけ出す」）
         */
        var certAsked = { main: false, special: false };

        function askCertificates() {
          var acked = save.certAck || {};
          if (!acked.main && !certAsked.main && L.requiredCleared(save, REQUIRED)) {
            certAsked.main = true;
            post({ type: "nexmax:link-certificate", tier: "main", levels: L.certificateFacts(save, 1, REQUIRED) });
          }
          var specialLevel = LEVELS.filter(function (level) {
            return level.special;
          })[0];
          var specialDone = specialLevel && (save.levels[specialLevel.id] || {}).stars > 0;
          if (specialLevel && specialDone && !acked.special && !certAsked.special) {
            certAsked.special = true;
            post({
              type: "nexmax:link-certificate",
              tier: "special",
              levels: L.certificateFacts(save, specialLevel.no, specialLevel.no),
            });
          }
        }

        window.addEventListener("message", function (event) {
          if (event.origin !== window.location.origin || event.source !== window.parent) return;
          var data = event.data;
          if (!data || data.type !== "nexmax:link-certificate-ack" || data.id !== LINK_ID) return;
          if (data.tier !== "main" && data.tier !== "special") return;
          save.certAck = Object.assign({}, save.certAck || {});
          save.certAck[data.tier] = true;
          writeSave();
          reportProgress();
        });

        function reportAnswers(answers, attemptId) {
          post({ type: "nexmax:link-answers", attemptId: attemptId, fullSet: true, answers: answers });
        }

        function newAttemptId() {
          try {
            return crypto.randomUUID();
          } catch (error) {
            return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, function (c) {
              return (Number(c) ^ (Math.floor(Math.random() * 256) & (15 >> (Number(c) / 4)))).toString(16);
            });
          }
        }

        /*
         * Supabase の 記録から 戻す（親が 自分の 行を 読んで 返す）。
         * 持ち主が 変わって いたら（教室の 共用 PC）、前の 人の 端末の 保存は 捨てる。
         */
        window.addEventListener("message", function (event) {
          if (event.origin !== window.location.origin) return;
          var data = event.data;
          if (!data || data.type !== "nexmax:link-progress-restore" || data.id !== LINK_ID) return;
          var owner = typeof data.owner === "string" ? data.owner : "";
          /*
           * 持ち主が ちがう（教室の 共用 PC で 前の 人の 保存）、または 持ち主の 分からない 保存に
           * 進み具合が ある とき は、端末の 保存を 捨てて 本人の 記録だけに する。前の 人の 星や
           * 調べ表の 文を、つぎの 人の 名前で 先生の 記録に 送らない ため（コードの 検収）。
           */
          var reset = false;
          if (owner && save.owner !== owner && (save.owner || hasProgress(save))) {
            var furigana = save.furigana;
            save = emptySave();
            save.furigana = furigana;
            reset = true;
          }
          if (owner) save.owner = owner;
          var introBefore = save.introSeen;
          save = L.mergePosition(save, data.position, LEVELS.length);
          writeSave();
          /*
           * レベル4までで ✅ に した（2026-11-20）。前に レベル1〜4 を 終えて いて、まだ ✅ で ない
           * 人にも 付ける。修了証も ここで 頼む（まだ 出して いない 人だけ・親が DB で 確かめる）
           */
          /*
           * 持ち主が 確かめられない（owner が 空）のに、端末の 保存には 持ち主が いる ときは
           * 自動では 送らない——共有 PC で 前の 人の 保存を 今の 人の 記録に しない（コードの 検収）
           */
          var trusted = !!owner || !save.owner;
          if (trusted && L.requiredCleared(save, REQUIRED) && data.status !== "completed") reportProgress();
          if (trusted) askCertificates();
          /* 別の 端末で もう「はじめに」を 見て いた → 1枚目に いる なら タイトルへ */
          if (reset) {
            talk = null;
            go(save.introSeen ? "title" : "intro", { intro: 0 });
            return;
          }
          if (!introBefore && save.introSeen && view.screen === "intro" && view.intro === 0) {
            go("title");
            return;
          }
          if (view.screen === "title") render();
        });

        /* ============================================================ 画面の 状態 */

        var view = { screen: "title", level: 0, page: 0, intro: 0 };
        var cleanup = [];

        function runCleanup() {
          while (cleanup.length) {
            try {
              cleanup.pop()();
            } catch (error) {
              /* 次へ */
            }
          }
        }

        function pagesFor(level) {
          var pages = [{ type: "cover" }];
          level.slides.forEach(function (slide) {
            pages.push({ type: "slide", slide: slide });
          });
          pages.push({ type: "checklist" });
          pages.push({ type: "desk" });
          pages.push({ type: "consult" });
          pages.push({ type: "reply" });
          return pages;
        }

        function stepOf(page) {
          if (!page) return -1;
          if (page.type === "desk") return 1;
          if (page.type === "consult") return 2;
          if (page.type === "reply") return 3;
          return 0;
        }

        function go(screen, extra) {
          runCleanup();
          view = Object.assign({ screen: screen, level: view.level, page: 0, intro: 0 }, extra || {});
          if (screen === "level") {
            save.at = { level: view.level, page: view.page };
            writeSave();
          }
          render();
        }

        function setPage(page) {
          var level = LEVELS[view.level];
          var pages = pagesFor(level);
          var next = Math.max(0, Math.min(pages.length - 1, page));
          runCleanup();
          view.page = next;
          save.at = { level: view.level, page: next };
          writeSave();
          render();
          screenEl.scrollTop = 0;
        }

        /* ============================================================ 上の 帯 */

        function renderBar() {
          var home = document.getElementById("homeBtn");
          var furi = document.getElementById("furiBtn");
          var title = document.getElementById("barTitle");
          var steps = document.getElementById("steps");
          home.innerHTML = "≡ " + R(D.ui.title);
          home.hidden = view.screen === "title";
          furi.className = "bar-btn furi" + (save.furigana ? " on" : "");
          furi.setAttribute("aria-pressed", save.furigana ? "true" : "false");
          furi.innerHTML = R(D.ui.furigana) + '<span class="switch" aria-hidden="true"></span>';
          document.body.classList.toggle("nofuri", !save.furigana);
          if (view.screen === "level") {
            var level = LEVELS[view.level];
            title.innerHTML = '<span class="ic">💻</span>' + R(D.ui.levelWord + level.no + "　" + level.title);
            var now = stepOf(pagesFor(level)[view.page]);
            var names = [D.ui.stepExplain, D.ui.stepCall, D.ui.stepTalk, D.ui.stepResult];
            steps.innerHTML = names
              .map(function (name, at) {
                return '<li class="' + (at === now ? "now" : at < now ? "done" : "") + '">' + R(name) + "</li>";
              })
              .join("");
            steps.hidden = false;
          } else {
            title.innerHTML = '<span class="ic">💻</span>' + R(view.screen === "intro" ? D.ui.intro : D.title);
            steps.hidden = true;
          }
        }

        document.getElementById("homeBtn").addEventListener("click", function () {
          stopTalkIfAny();
          talk = null;
          go("title");
        });
        document.getElementById("furiBtn").addEventListener("click", function () {
          save.furigana = !save.furigana;
          writeSave();
          renderBar();
        });

        /* ============================================================ 描く */

        function render() {
          renderBar();
          if (view.screen === "title") return renderTitle();
          if (view.screen === "intro") return renderIntro();
          return renderLevelPage();
        }

        function navHtml(opts) {
          return (
            '<div class="nav">' +
            (opts.back === false
              ? "<span></span>"
              : '<button type="button" class="btn sub small" data-act="back">◀ ' + R(D.ui.back) + "</button>") +
            (opts.next === false
              ? "<span></span>"
              : '<button type="button" class="btn ' +
                (opts.nextClass || "") +
                '" data-act="next"' +
                (opts.nextDisabled ? " disabled" : "") +
                ">" +
                R(opts.nextLabel || D.ui.next) +
                " ▶</button>") +
            "</div>"
          );
        }

        /* ---------------- タイトル ---------------- */

        function getKey() {
          try {
            return (window.localStorage.getItem(GEMINI_KEY) || "").trim();
          } catch (error) {
            return "";
          }
        }

        /** Gemini の キーを 入れる 欄（タイトルと 相談の 画面）。 */
        function keyFormHtml() {
          return (
            '<div class="keyform"><label for="keyInput">' +
            R(D.ui.keyLabel) +
            '</label><input id="keyInput" type="password" autocomplete="off" /><button type="button" class="btn small" data-act="savekey">' +
            R(D.ui.keySave) +
            "</button></div>"
          );
        }

        function renderTitle() {
          var open = L.openLevelCount(save, LEVELS.length);
          /* いま 進める レベル（開いて いて まだ 合格して いない 最初の もの）を 強く 見せる */
          var current = -1;
          for (var n = 0; n < open; n += 1) {
            if (!(save.levels[LEVELS[n].id] || {}).stars) {
              current = n;
              break;
            }
          }
          var html =
            '<div class="scroll"><div class="title-screen" data-testid="title">' +
            '<div class="title-photo" aria-hidden="true"></div>' +

        /**
         * 時間の 図の 上の「今日の 予定」の 帯（9:00〜12:00・昼休み・13:00〜18:00）。
         * 働ける 時間が 何時間かを 時刻から 数えられる ように（2026-11-20「時間関係がよくわかりません」）。
         */
        function dayHtml(day) {
          if (!day) return "";
          var total = 0;
          day.blocks.forEach(function (block) {
            total += block.hours;
          });
          var at = 0;
          var ticks = "";
          var blocks = day.blocks
            .map(function (block, index) {
              var left = (at / total) * 100;
              ticks += '<span class="tick" style="left:' + left + '%">' + esc(block.from) + "</span>";
              at += block.hours;
              if (index === day.blocks.length - 1 && block.to) {
                ticks += '<span class="tick end" style="left:100%">' + esc(block.to) + "</span>";
              }
              return (
                '<div class="blk' +
                (block.rest ? " rest" : "") +
                '" style="flex:' +
                block.hours +
                '">' +
                (block.rest ? R(block.rest) : block.hours + "h") +
                "</div>"
              );
            })
            .join("");
          return (
            '<div class="barrow"><span>' +
            R(day.label) +
            '</span><div class="dayplan"><div class="daytrack">' +
            blocks +
            '</div><div class="dayticks">' +
            ticks +
            "</div></div></div>"
          );
        }
