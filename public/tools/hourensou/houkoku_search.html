<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NexmaxAcademy</title>
    <!--
      調査（リサーチ）：日本の 会社の 階級 — エンジン（画面と 動き だけ）

      文言は すべて houkoku_search.data.js から 読む。この ファイルに
      日本語を 直接 書かない（ボタン名も DATA.labels から）。

      ## 何を する ページか
      学習者が **自分で 調べた 階級を 入力し、えらい 順に ならべ替えて 出す**。
      出すまで ステージの つぎへ 進めない（2026-09-11 の 指定）。
      以前は Google スプレッドシートへ 飛ばして いたが、
      アプリの 外に 出ると 書いた ものが 学習者の 手もとに 残らず、
      「出した」ことも アプリに 伝わらなかった。

      ## 答えは ここに 置かない
      正しい 並びは **つぎの ページ**の 答え合わせで 出す。ここに 語群や 例として
      混ぜると、調べる 理由が 消える（設計01 P2・P4）。ページの もとの 字は
      学習者にも 読めるので、ここにも 書かない。

      ## 出した ことを どう 伝えるか
      `postMessage({type:"nexmax:link-done", id:"houkoku_search"})` を 1回だけ 送る。
      アプリ（`src/components/link/link-view.tsx`）は 同じ 置き場からの 合図だけを 受ける。
      1枚で 開いた ときは 送り先が 無いので、黙って 何も しない（画面は そのまま 使える）。

      ## 書いた ものは 先生にも 届く — **返事が 来るまで 送り直す**
      出した ときに `postMessage({type:"nexmax:link-answers", …, key})` で 親へ 渡し、
      アプリが 学習の きろく（`quiz_results`）に 残す。ここでは 保存しない
      ——静的な 1枚に DBの 鍵を 置かない（規律4）。
      DB に 入ると アプリが `nexmax:link-answers-saved`（同じ key）を 返す。
      **その 返事が 来るまで「先生に とどいた」とは 見なさず、開くたびに 送り直す。**
      2026-09-18 に 分かった こと: 以前は 送った 瞬間に「送った」印を 付けて いたので、
      受け手が いない とき（別の タブ・保存の 仕組みが 入る 前）に 出した こたえは
      二度と 送られず、DB には 1件も 残って いなかった。

      ## 書いた ものは 端末に 残し、無ければ DB から 戻す
      localStorage に 置く。授業中に うっかり 閉じても 書き直しに ならない。
      使えない 設定の 端末でも 落ちないよう、読み書きは try で 包む。
      ただし localStorage は **URL と 端末ごと**なので、別の 端末・別の URL
      （ブランチ用・STG・本番）で 開くと 空に 見える。空の ときは
      `nexmax:link-restore-request` で アプリに 頼み、DB に ある 最後の こたえを
      `nexmax:link-restore` で 受け取って 戻す。
    -->
    <style>
      :root {
        --sky: #0288d1;
        --sky-soft: #e1f2fb;
        --navy: #004f8d;
        --ink: #1f3a56;
        --ink-soft: #5a7089;
        --ink-faint: #9db0c2;
        --line: #dcebf5;
        --leaf: #58c273;
        --leaf-deep: #3aa458;
        --sun: #ffc93c;
        --cream: #fff7e8;
        --paper: #ffffff;
        --radius: 20px;
        --shadow: 0 6px 18px rgba(31, 58, 86, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0 0 40px;
        background: linear-gradient(180deg, #d8f0fc 0%, #f4fbff 220px);
        color: var(--ink);
        font-family:
          "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
        font-weight: 700;
        line-height: 1.9;
      }

      rt {
        color: var(--ink-soft);
        font-size: 0.5em;
        font-weight: 700;
      }

      .wrap {
        margin: 0 auto;
        max-width: 720px;
        padding: 0 14px;
      }

      header.hero {
        padding: 22px 0 16px;
        text-align: center;
      }

      header.hero h1 {
        margin: 0;
        color: var(--navy);
        font-size: 22px;
        line-height: 1.6;
      }

      header.hero p {
        margin: 6px 0 0;
        color: var(--ink-soft);
        font-size: 15px;
      }

      section.card {
        margin-top: 16px;
        padding: 16px;
        border: 2px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      h2 {
        margin: 0 0 6px;
        color: var(--navy);
        font-size: 18px;
      }

      .lead {
        margin: 0 0 10px;
        font-size: 15px;
      }

      ul.hints {
        margin: 0 0 12px;
        padding-left: 20px;
        color: var(--ink-soft);
        font-size: 14px;
      }

      .edge {
        color: var(--ink-faint);
        font-size: 13px;
      }

      /* 持ち主を 確かめる あいだ（ふつうは 一瞬）は、前の 人の 控えを 見せない */
      body[data-wait] .wrap {
        visibility: hidden;
      }

      .waitnote {
        display: none;
        margin: 40px 16px;
        text-align: center;
        color: var(--ink);
        font-weight: 800;
      }

      body[data-wait="slow"] .waitnote {
        display: block;
      }

      /* 先生に まだ とどいて いない ときは 見落とさせない（規律1 ぼかさない） */
      .edge[data-status="ng"] {
        color: #b3261e;
        font-weight: 800;
      }

      ol.rows {
        margin: 4px 0;
        padding: 0;
        list-style: none;
      }

      li.row {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        align-items: center;
        gap: 6px;
        padding: 4px 0;
      }

      /*
       * せまい 画面（390px の 端末）では、入力欄が 180px まで つぶれ、
       * この 教材の 中心の 操作（↑↓）が 指の 大きさを 下回る。
       * 2行に して、指で 押せる 大きさ（44px）を 取りもどす。
       */
      @media (max-width: 460px) {
        li.row {
          grid-template-columns: 28px 1fr;
        }

        .ops {
          grid-column: 2;
          justify-content: flex-end;
        }

        button.icon {
          width: 44px;
          height: 44px;
        }
      }

      .no {
        display: grid;
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: var(--sky-soft);
        color: var(--navy);
        font-size: 13px;
        place-items: center;
      }

      input.rank,
      textarea {
        width: 100%;
        min-width: 0;
        padding: 9px 12px;
        border: 2px solid var(--line);
        border-radius: 14px;
        background: var(--paper);
        color: var(--ink);
        font-family: inherit;
        font-size: 16px; /* 16px 未満は iOS が 勝手に 拡大する */
        font-weight: 700;
      }

      input.rank:focus,
      textarea:focus {
        border-color: var(--sky);
        outline: none;
      }

      .ops {
        display: flex;
        flex: 0 0 auto;
        gap: 4px;
      }

      button {
        border-radius: 999px;
        font-family: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button.icon {
        width: 34px;
        height: 34px;
        border: 2px solid var(--line);
        background: var(--paper);
        color: var(--navy);
        font-size: 15px;
        line-height: 1;
      }

      button.icon:disabled {
        color: var(--ink-faint);
        cursor: default;
        opacity: 0.45;
      }

      button.add {
        margin-top: 8px;
        padding: 8px 16px;
        border: 2px dashed var(--line);
        background: var(--paper);
        color: var(--navy);
        font-size: 14px;
      }

      .field {
        margin-top: 12px;
      }

      .field label {
        display: block;
        margin-bottom: 4px;
        font-size: 15px;
      }

      textarea {
        min-height: 74px;
        resize: vertical;
      }

      .foot {
        margin-top: 18px;
        text-align: center;
      }

      button.submit {
        padding: 14px 34px;
        border: none;
        background: var(--leaf);
        box-shadow: 0 4px 0 var(--leaf-deep);
        color: #fff;
        font-size: 17px;
      }

      button.submit:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 var(--leaf-deep);
      }

      button.edit {
        margin-top: 12px;
        padding: 9px 20px;
        border: 2px solid var(--line);
        background: var(--paper);
        color: var(--navy);
        font-size: 14px;
      }

      .note {
        margin: 10px 0 0;
        color: var(--ink-soft);
        font-size: 14px;
        min-height: 1.9em;
      }

      .done {
        border-color: var(--leaf);
        background: var(--cream);
        animation: pop 0.32s ease-out;
      }

      /* 出した 瞬間の 小さな 祝い（動きを 好まない 端末では 止める）。 */
      @keyframes pop {
        from {
          transform: scale(0.96) translateY(8px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .done {
          animation: none;
        }
      }

      /* 出せない ときの 合図（押した ことに 必ず 反応する）。 */
      .shake {
        animation: shake 0.3s;
      }

      @keyframes shake {
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }

      .done h2 {
        color: var(--leaf-deep);
      }

      ol.answer {
        margin: 8px 0 0;
        padding-left: 22px;
        font-size: 16px;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <p class="waitnote" id="waitNote" role="status"></p>
    <div class="wrap">
      <header class="hero">
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </header>

      <section class="card" id="introCard">
        <p class="lead" id="intro"></p>
      </section>

      <!-- 1. 階級を 入れて ならべる -->
      <section class="card" id="rankCard">
        <h2 id="rankHeading"></h2>
        <p class="lead" id="rankLead"></p>
        <ul class="hints" id="rankHints"></ul>
        <p class="edge" id="topLabel"></p>
        <ol class="rows" id="rows"></ol>
        <p class="edge" id="bottomLabel"></p>
        <button type="button" class="add" id="addRow"></button>
      </section>

      <!-- 2. カンボジアとの ちがい -->
      <section class="card" id="compareCard">
        <h2 id="compareHeading"></h2>
        <p class="lead" id="compareLead"></p>
        <div id="fields"></div>
      </section>

      <div class="foot" id="foot">
        <button type="button" class="submit" id="submit"></button>
        <p class="note" id="note" role="status" aria-live="polite"></p>
      </div>

      <!-- 出した あとの 画面 -->
      <section class="card done hidden" id="doneCard">
        <h2 id="doneTitle"></h2>
        <p class="lead" id="doneListLabel"></p>
        <ol class="answer" id="doneList"></ol>
        <p class="note" id="doneNext"></p>
        <p class="edge" id="savedNote"></p>
        <button type="button" class="edit" id="edit"></button>
      </section>
    </div>

    <script src="houkoku_search.data.js"></script>
    <script>
      (function () {
        "use strict";

        var DATA = window.SEARCH_DATA;
        var L = DATA.labels;
        var M = DATA.messages;

        /** アプリの 中で 開いて いるか（べつの タブ・1枚で 開いた ときは 親が いない）。 */
        var inApp = window.parent !== window;

        /* ---------------- ことばの 組み立て ---------------- */

        /** HTML に なる 文字を 先に 無害化する（素の 連結を しない）。 */
        function esc(text) {
          return String(text == null ? "" : text).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }

        /** {表記|よみ} → <ruby>表記<rt>よみ</rt></ruby>。エスケープした あとで 組む。 */
        function rubyfy(text) {
          return esc(text).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, function (_m, base, yomi) {
            return "<ruby>" + base + "<rt>" + yomi + "</rt></ruby>";
          });
        }

        /** ルビ記法を はずした ただの 文字（placeholder・aria-label 用）。 */
        function plain(text) {
          return String(text == null ? "" : text).replace(/\{([^{}|]+)\|[^{}|]+\}/g, "$1");
        }

        function put(id, text) {
          document.getElementById(id).innerHTML = rubyfy(text);
        }

        /**
         * ボタンには **ルビの 無い 名前**も 付ける。
         *
         * ルビを 入れると、読み上げも 機械の 検査も「{出|だ}す」を「出だす」と
         * 読む（ルビの 字が 名前に 混ざる）。押す ものは 名前で 引けないと 困る。
         */
        function putButton(id, text) {
          var node = document.getElementById(id);
          node.innerHTML = rubyfy(text);
          node.setAttribute("aria-label", plain(text));
        }

        /* ---------------- 覚えて おく もの ---------------- */

        /*
         * 控えの 置き場は **学習者ごとに 分ける**（2026-09-18 の 検収）。
         *
         * この 控えは ログアウトでは 消えない（`clearNexmaxCache` が 消すのは `nexmax.` で
         * 始まる 鍵だけ）。1つの 置き場を 何人かで 使うと、教室の PC で
         *   - A さんの こたえが B さんの 名前で 送られ、B さんの 関門まで 開く
         *   - B さんが 開いた とき A さんの 控えを 捨てると、A さんの まだ 届いて いない
         *     たった 1つの こたえが 消える
         * の どちらかに なる。置き場を 分ければ どちらも 起きない。
         *
         * だれの 置き場かは **アプリが 教えて くれる まで 分からない**（この ページは
         * ログインの 情報を 持たない）。だから アプリの 中では 返事（`onState`）が 来るまで
         * 何も 見せない。
         */

        /**
         * 持ち主の 分からない 書きかけの 置き場。この 直しの 前の 控え（版の 無い 形）・
         * べつの タブで 書いた もの・デモモードの 控えが ここに ある。
         * **ここの ものは 自動では 送らない。** アプリで 開いた 人に 書きかけと して 渡し、
         * 出すかは その 人が「出す」を 押して 決める。
         */
        var SHARED_KEY = "nexmax:houkoku_search:v1";
        /** 学習者ごとの 置き場（後ろに アプリが 教えて くれた id を 付ける）。 */
        var OWNER_PREFIX = "nexmax:houkoku_search:v2:";
        var VERSION = 2;

        /** いまの 置き場。アプリの 中では 持ち主が 分かるまで 無い（書かない）。 */
        var storeKey = inApp ? null : SHARED_KEY;

        function blankState() {
          var rows = [];
          for (var i = 0; i < DATA.rank.start; i++) rows.push("");
          var answers = {};
          DATA.compare.fields.forEach(function (field) {
            answers[field.id] = "";
          });
          return {
            v: VERSION,
            rows: rows,
            answers: answers,
            /** 1度でも 出したか（関門を 開けて よいか）。 */
            submitted: false,
            /** 出した あと「直す」で 書き直して いる とちゅうか（欄は まだ 出して いない 中身）。 */
            editing: false,
            /*
             * `attempt` は **いちばん 最後に 出した 1回**（中身・その 1回の 記録の id・送る こたえ）。
             * 送り直すのは この 中身——「直す」の とちゅうで 閉じても、書きかけは 送らない。
             * 送り直しても 同じ id なので、DB の 一意索引（attempt_id, question_id）が
             * 2回目を 捨てる——返事が 届かずに 送り直しても 行が 増えない。
             */
            attempt: null,
            /*
             * `saved` は **DB に 入ったと アプリが 返事を くれた 中身**（同じ ものを 2度 送らない ため）。
             * 以前の `sent`（送った 瞬間に 付けて いた 印）は 読まない——届いて いない
             * ものにも 付いて いたので、読むと その こたえを 二度と 送れない。
             */
            saved: "",
          };
        }

        function isAnswerList(value) {
          return (
            Array.isArray(value) &&
            value.every(function (one) {
              return one && typeof one.id === "string" && typeof one.text === "string";
            })
          );
        }

        /**
         * 置き場から 読む。
         *
         * @param full false なら **書いた ものだけ**（出した 印・1回の 記録は 読まない）。
         *   持ち主の 分からない 書きかけを 引き取る とき・べつの タブで 開いた ときに 使う。
         */
        function load(key, full) {
          var state = blankState();
          try {
            var saved = JSON.parse(window.localStorage.getItem(key) || "null");
            if (!saved) return state;
            if (Array.isArray(saved.rows) && saved.rows.length > 0) {
              state.rows = saved.rows.slice(0, DATA.rank.max).map(function (v) {
                return typeof v === "string" ? v : "";
              });
            }
            if (saved.answers) {
              Object.keys(state.answers).forEach(function (field) {
                if (typeof saved.answers[field] === "string") {
                  state.answers[field] = saved.answers[field];
                }
              });
            }
            if (!full || saved.v !== VERSION) return state;
            state.submitted = saved.submitted === true;
            state.editing = saved.editing === true;
            var attempt = saved.attempt;
            if (
              attempt &&
              typeof attempt.stamp === "string" &&
              typeof attempt.id === "string" &&
              isAnswerList(attempt.answers)
            ) {
              state.attempt = { stamp: attempt.stamp, id: attempt.id, answers: attempt.answers };
            }
            if (typeof saved.saved === "string") state.saved = saved.saved;
          } catch (e) {
            /* 使えない 端末でも 学習は 止めない */
          }
          return state;
        }

        function save() {
          if (!storeKey) return;
          try {
            window.localStorage.setItem(storeKey, JSON.stringify(state));
          } catch (e) {
            /* 同上 */
          }
        }

        var state = inApp ? blankState() : load(SHARED_KEY, false);

        /* ---------------- 画面を 組む ---------------- */

        put("title", DATA.title);
        put("subtitle", DATA.subtitle);
        put("intro", DATA.intro);
        put("rankHeading", DATA.rank.heading);
        put("rankLead", DATA.rank.lead);
        put("topLabel", DATA.rank.topLabel);
        put("bottomLabel", DATA.rank.bottomLabel);
        putButton("addRow", L.add);
        put("compareHeading", DATA.compare.heading);
        put("compareLead", DATA.compare.lead);
        putButton("submit", L.submit);
        put("doneTitle", L.doneTitle);
        put("doneListLabel", L.doneList);
        put("doneNext", L.doneNext);
        putButton("edit", L.edit);

        var hints = document.getElementById("rankHints");
        DATA.rank.hints.forEach(function (text) {
          var li = document.createElement("li");
          li.innerHTML = rubyfy(text);
          hints.appendChild(li);
        });

        var fields = document.getElementById("fields");
        DATA.compare.fields.forEach(function (field) {
          var box = document.createElement("div");
          box.className = "field";

          var label = document.createElement("label");
          label.htmlFor = "field-" + field.id;
          label.innerHTML = rubyfy(field.label);

          var area = document.createElement("textarea");
          area.id = "field-" + field.id;
          // 先生の 表は 1行に そのまま 描くので、際限なく 太らせない
          area.maxLength = 600;
          area.placeholder = plain(field.placeholder);
          area.value = state.answers[field.id];
          area.addEventListener("input", function () {
            state.answers[field.id] = area.value;
            save();
            updateNote();
          });

          box.appendChild(label);
          box.appendChild(area);
          fields.appendChild(box);
        });

        /* ---------------- 階級の 行 ---------------- */

        var rowsEl = document.getElementById("rows");

        /**
         * 行を ぜんぶ 描き直す。
         *
         * 並べ替えは **要素ごと 作り直す**（中身だけ 入れ替えると、いま 打って いる
         * 欄が どれか 分からなく なる）。動かした あとは、その 欄に 目を もどす。
         */
        function renderRows(focusIndex) {
          while (rowsEl.firstChild) rowsEl.removeChild(rowsEl.firstChild);

          state.rows.forEach(function (value, index) {
            var li = document.createElement("li");
            li.className = "row";

            var no = document.createElement("span");
            no.className = "no";
            no.textContent = String(index + 1);

            var input = document.createElement("input");
            input.className = "rank";
            input.type = "text";
            input.value = value;
            input.placeholder = plain(DATA.rank.placeholder);
            input.setAttribute("aria-label", index + 1 + "ばんめ");
            input.addEventListener("input", function () {
              state.rows[index] = input.value;
              save();
              updateNote();
            });

            var ops = document.createElement("span");
            ops.className = "ops";
            ops.appendChild(opButton("↑", L.up, index === 0, function () { move(index, -1); }));
            ops.appendChild(
              opButton("↓", L.down, index === state.rows.length - 1, function () { move(index, 1); }),
            );
            ops.appendChild(
              opButton("✕", L.remove, state.rows.length <= 2, function () { removeRow(index); }),
            );

            li.appendChild(no);
            li.appendChild(input);
            li.appendChild(ops);
            rowsEl.appendChild(li);
          });

          if (typeof focusIndex === "number") {
            var inputs = rowsEl.querySelectorAll("input.rank");
            if (inputs[focusIndex]) inputs[focusIndex].focus();
          }
          document.getElementById("addRow").disabled = state.rows.length >= DATA.rank.max;
        }

        function opButton(mark, label, disabled, onClick) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "icon";
          button.textContent = mark;
          button.setAttribute("aria-label", plain(label));
          button.disabled = disabled;
          button.addEventListener("click", onClick);
          return button;
        }

        function move(index, step) {
          var to = index + step;
          if (to < 0 || to >= state.rows.length) return;
          var moved = state.rows[index];
          state.rows[index] = state.rows[to];
          state.rows[to] = moved;
          save();
          renderRows(to);
          updateNote();
        }

        function removeRow(index) {
          state.rows.splice(index, 1);
          save();
          renderRows(Math.max(0, index - 1));
          updateNote();
        }

        document.getElementById("addRow").addEventListener("click", function () {
          if (state.rows.length >= DATA.rank.max) return;
          state.rows.push("");
          save();
          renderRows(state.rows.length - 1);
          updateNote();
        });

        /* ---------------- 出せるか どうか ---------------- */

        /**
         * 書いた 行（空の 行を 除く）。
         *
         * 行の 中の **全角スペースは 半角に する**。出す ときは 行を 全角スペースで
         * つないで 1つの 答えに する（先生の 表で 読める 形）ので、行の 中に 残すと
         * DB から 戻した とき「代表　取締役」が 2行に 割れる。
         */
        function filledRows() {
          return state.rows
            .map(function (value) {
              return value.trim().replace(/\u3000/g, " ");
            })
            .filter(function (value) {
              return value !== "";
            });
        }

        function emptyFields() {
          return DATA.compare.fields.filter(function (field) {
            return state.answers[field.id].trim().length < 2;
          }).length;
        }

        function hasDuplicate() {
          var seen = Object.create(null);
          return filledRows().some(function (value) {
            if (seen[value]) return true;
            seen[value] = true;
            return false;
          });
        }

        /**
         * のこりを **数で** 言う。
         *
         * 「まだ 出せません」だけでは、あと 何を すれば いいか 分からない。
         * 足りない ものを 1つずつ、数で 言う（規律1「結果を ぼかさない」）。
         */
        function updateNote() {
          var short = DATA.rank.min - filledRows().length;
          var left = emptyFields();
          var untouched = filledRows().length === 0 && left === DATA.compare.fields.length;
          var text;
          /*
           * まだ 何も 書いて いない ときは **やる ことの ほう**を 出す。
           * 開いた 瞬間に「あと 5つ たりません」と 言われても、何を すれば
           * いいのかは 分からない（足りないのは 書く 前なので 当たり前）。
           */
          if (untouched) {
            text = M.howto
              .replace("{n}", String(DATA.rank.min))
              .replace("{m}", String(DATA.compare.fields.length));
          } else if (short > 0) text = M.needMore.replace("{n}", String(short));
          else if (left > 0) text = M.needCompare.replace("{n}", String(left));
          else if (hasDuplicate()) text = M.duplicate;
          else text = M.ready;
          document.getElementById("note").innerHTML = rubyfy(text);
          return short <= 0 && left <= 0;
        }

        /**
         * 出せない とき、**足りない ところへ 連れて 行く**。
         *
         * 同じ 文が 出るだけでは 画面が 1ドットも 変わらず（読み上げも
         * 同じ 文では 黙る）、「押したのに 何も 起きない」に なる。
         */
        function goToMissing() {
          var inputs = rowsEl.querySelectorAll("input.rank");
          for (var i = 0; i < inputs.length; i++) {
            if (inputs[i].value.trim() === "") {
              inputs[i].focus();
              inputs[i].scrollIntoView({ block: "center" });
              return;
            }
          }
          for (var j = 0; j < DATA.compare.fields.length; j++) {
            var field = DATA.compare.fields[j];
            if (state.answers[field.id].trim().length < 2) {
              var area = document.getElementById("field-" + field.id);
              area.focus();
              area.scrollIntoView({ block: "center" });
              return;
            }
          }
          // 行が 足りない ときは 1行 足して そこへ
          if (state.rows.length < DATA.rank.max) {
            state.rows.push("");
            save();
            renderRows(state.rows.length - 1);
          }
        }

        /* ---------------- 出す ---------------- */

        var sent = false;

        /**
         * アプリに「**おわりの しるしは こちらで 出す**」と 名乗る。
         *
         * これを 送ると、アプリ側の「おわりました」ボタンが 引っこむ
         *（`src/components/link/link-view.tsx`）。出さずに 押すだけで 関門が
         * 開いては、出す ことに 意味が 無くなる。
         */
        function claimDone() {
          try {
            window.parent.postMessage(
              { type: "nexmax:link-owns-done", id: DATA.id },
              window.location.origin,
            );
          } catch (e) {
            /* 1枚で 開いた ときは 送り先が 無い */
          }
        }

        /** アプリに「おわった」を 伝える（同じ 置き場の ときだけ 届く）。 */
        function tellApp() {
          if (sent) return;
          sent = true;
          try {
            window.parent.postMessage(
              { type: "nexmax:link-done", id: DATA.id },
              window.location.origin,
            );
          } catch (e) {
            /* 1枚で 開いた ときは 送り先が 無い。画面は そのまま 使える */
          }
        }

        /* ---------------- 先生に とどいたか ---------------- */

        /** 返事を 待つ 長さ。これを 過ぎたら「まだ とどいて いません」を 出す。 */
        var WAIT_MS = 15000;
        var sendTimer = 0;

        /**
         * アプリが 教えて くれた いまの 学習者。null＝まだ 聞いて いない／デモモード。
         * **これが 分かって いる ときだけ 送る。**
         */
        var owner = null;
        /** アプリの 返事を 受けて、置き場が 決まったか。 */
        var confirmed = false;

        /**
         * 1回ぶんの 記録の id（DB の attempt_id は uuid の 列）。
         *
         * `crypto.randomUUID` は https か localhost でしか 生えないので、
         * 形だけ uuid の ものに 退く（アプリの `newAttemptId` と 同じ 考え方）。
         */
        function newAttemptId() {
          try {
            return window.crypto.randomUUID();
          } catch (e) {
            return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, function (c) {
              var n = Number(c);
              return (n ^ (Math.floor(Math.random() * 256) & (15 >> (n / 4)))).toString(16);
            });
          }
        }

        /**
         * 出した あとの 画面に **先生に とどいたか**を 出す（規律1 ぼかさない）。
         * "ok" … DB に 入った ／ "wait" … 返事 待ち ／ "ng" … まだ 入って いない
         */
        function showSaveStatus(kind) {
          var node = document.getElementById("savedNote");
          node.innerHTML = rubyfy(
            kind === "ok" ? L.savedOk : kind === "wait" ? L.savedWait : L.savedNg,
          );
          node.setAttribute("data-status", kind);
        }

        /**
         * いま 欄に ある ものを **1回ぶんと して 出し**、先生の 画面へ 届ける
         *（2026-09-11 の 指定 B）。
         *
         * この ページは 静的な 1枚なので、DBの 鍵も ログインの 情報も 持って いない。
         * だから **保存は アプリ側の 仕事**に して、ここは 中身を 渡すだけに する。
         * 受け手は `src/components/link/link-view.tsx` → `src/lib/answers/link-answers-db.ts`。
         *
         * 中身が 変わった ときだけ 新しい 1回に する。「直す → 出す」は 1回ごとに
         * 別の 記録に なる（先生の 画面の「何回目」）が、**何も 変えずに もう一度
         * 押した**だけで 同じ 4行が 増えるのは ただの 雑音に なる。
         *
         * @param restoredId DB から 戻した ときの その 1回の id。渡すと **送らずに**
         *   「もう 入って いる」印だけ 付ける（戻した ものを 送り返すと 行が 増える）
         */
        function sendAnswers(restoredId) {
          var answers = [{ id: "kaikyuu_order", text: filledRows().join("　") }];
          DATA.compare.fields.forEach(function (field) {
            answers.push({ id: field.id, text: state.answers[field.id].trim() });
          });
          var stamp = JSON.stringify(answers);
          if (typeof restoredId === "string") {
            state.attempt = {
              stamp: stamp,
              id: restoredId !== "" ? restoredId : newAttemptId(),
              answers: answers,
            };
            state.saved = stamp;
            save();
            showSaveStatus("ok");
            return;
          }
          if (!state.attempt || state.attempt.stamp !== stamp) {
            state.attempt = { stamp: stamp, id: newAttemptId(), answers: answers };
          }
          save();
          deliver();
        }

        /**
         * **最後に 出した 1回**を、まだ DB に 入って いなければ アプリへ 渡す。
         *
         * 出した とき と、開き直した ときに 呼ぶ。送るのは 出した ときの 中身——
         * 「直す」の とちゅうの 欄では ない。持ち主（`owner`）も 付ける
         *（アプリは ログイン中の 人と 同じ ときしか 残さない）。
         */
        function deliver() {
          var attempt = state.attempt;
          if (!attempt) return;
          if (!inApp || !owner) {
            showSaveStatus("ng");
            return;
          }
          if (attempt.stamp === state.saved) {
            showSaveStatus("ok");
            return;
          }
          showSaveStatus("wait");
          clearTimeout(sendTimer);
          sendTimer = setTimeout(function () {
            showSaveStatus("ng");
          }, WAIT_MS);
          try {
            window.parent.postMessage(
              {
                type: "nexmax:link-answers",
                id: DATA.id,
                answers: attempt.answers,
                key: attempt.id,
                owner: owner,
              },
              window.location.origin,
            );
          } catch (e) {
            showSaveStatus("ng");
          }
        }

        /** アプリから「DB に 入った」。いちばん 最後に 出した 1回の 返事なら「とどいた」に する。 */
        function onSaved(key) {
          if (!state.attempt || key !== state.attempt.id) return;
          state.saved = state.attempt.stamp;
          save();
          clearTimeout(sendTimer);
          showSaveStatus("ok");
        }

        /** まだ 何も 書いて いないか。 */
        function isBlankState(target) {
          if (target.submitted) return false;
          var typed = target.rows.some(function (value) {
            return value.trim() !== "";
          });
          if (typed) return false;
          return DATA.compare.fields.every(function (field) {
            return target.answers[field.id].trim() === "";
          });
        }

        function isBlank() {
          return isBlankState(state);
        }

        /** 覚えて いる 中身を 欄へ 写す（欄は 開いた ときに 1度だけ 作って ある）。 */
        function fillFields() {
          DATA.compare.fields.forEach(function (field) {
            document.getElementById("field-" + field.id).value = state.answers[field.id];
          });
          renderRows();
          updateNote();
        }

        /**
         * アプリに「**いま だれが 開いて いて、DB に 前の こたえが あるか**」を 聞く。
         * 返事（`onState`）が 来るまで、何も 見せない・送らない。
         */
        function hello() {
          try {
            window.parent.postMessage({ type: "nexmax:link-hello", id: DATA.id }, window.location.origin);
          } catch (e) {
            tooSlow();
          }
        }

        /** 中身を 見せる（置き場が 決まるまで 隠して いた）。 */
        function reveal() {
          document.body.removeAttribute("data-wait");
        }

        /**
         * 返事が 来ない・来ても だれか 分からない（ログインの 情報が 読めない）。
         *
         * **何も 見せず、出させない。** だれの 置き場か 決められないので、書かせると
         * 行き先の 無い こたえが できる（関門だけ 開いて DB に 届かない）。
         * できる ことを 1つ 言う（規律1）。あとから 返事が 来れば、ふつうに 開く。
         */
        function tooSlow() {
          if (confirmed || !document.body.hasAttribute("data-wait")) return;
          document.getElementById("waitNote").innerHTML = rubyfy(M.slow);
          document.body.setAttribute("data-wait", "slow");
        }

        /**
         * DB に あった こたえを 戻す（別の 端末・別の URL で 開いた とき）。
         * 戻した ものは もう DB に ある ので、その 1回の id ごと「入って いる」に する。
         */
        function restore(answers, attemptId) {
          var byId = Object.create(null);
          answers.forEach(function (answer) {
            if (answer && typeof answer.id === "string" && typeof answer.text === "string") {
              byId[answer.id] = answer.text;
            }
          });
          if (typeof byId.kaikyuu_order !== "string") return false;
          var rows = byId.kaikyuu_order.split("　").filter(function (value) {
            return value.trim() !== "";
          });
          while (rows.length < DATA.rank.start) rows.push("");
          state.rows = rows.slice(0, DATA.rank.max);
          DATA.compare.fields.forEach(function (field) {
            if (typeof byId[field.id] === "string") state.answers[field.id] = byId[field.id];
          });
          state.submitted = true;
          state.editing = false;
          fillFields();
          sendAnswers(typeof attemptId === "string" ? attemptId : "");
          return true;
        }

        /**
         * アプリの 返事。**置き場を 決めてから** 見せる。
         *
         * - 学習者が 分かった → その 人の 置き場を 開く。空なら DB の 最後の こたえを 戻し、
         *   DB にも 無ければ 持ち主の 分からない 書きかけを 引き取る（書きかけの まま。
         *   自動では 送らない・関門も 開けない）
         * - デモモード（鍵ゼロ）→ 持ち主の 無い 置き場を そのまま 使う（送らない）
         * - それ以外（ログインの 情報が 読めない）→ 何も 見せない（`tooSlow`）
         */
        function onState(who, answers, attemptId, demo) {
          if (confirmed) return;
          var restored = false;
          if (typeof who === "string" && who !== "" && who.length <= 100) {
            owner = who;
            storeKey = OWNER_PREFIX + who;
            state = load(storeKey, true);
            if (isBlank()) {
              if (Array.isArray(answers) && answers.length > 0) {
                restored = restore(answers, attemptId);
              }
              if (!restored) {
                var draft = load(SHARED_KEY, false);
                if (!isBlankState(draft)) {
                  state = draft;
                  save();
                  try {
                    window.localStorage.removeItem(SHARED_KEY);
                  } catch (e) {
                    /* 残っても 書きかけと して しか 読まない */
                  }
                }
              }
            }
          } else if (demo === true) {
            storeKey = SHARED_KEY;
            state = load(SHARED_KEY, true);
          } else {
            tooSlow();
            return;
          }
          confirmed = true;
          fillFields();
          showForm();
          reveal();
          if (!state.submitted) return;
          /*
           * 出した あとに 開き直した ときも、アプリに もう一度 伝える。
           * ステージの 関門は アプリ側が 覚えて いるが、別の 端末・
           * 記録が 消えた あとでも「出した 人」が 止まらないように する。
           */
          tellApp();
          // 「直す」の とちゅうで 閉じた 人には、書きかけの 欄を そのまま 出す
          if (!state.editing) showDone();
          // 最後に 出した 1回が まだ 先生に とどいて いなければ、ここで 送り直す
          deliver();
        }

        /* アプリからの 返事。**同じ 置き場の 親から 来た ものだけ** 受ける。 */
        window.addEventListener("message", function (event) {
          if (event.origin !== window.location.origin || event.source !== window.parent) return;
          var data = event.data;
          if (!data || typeof data !== "object" || data.id !== DATA.id) return;
          if (data.type === "nexmax:link-answers-saved") onSaved(data.key);
          else if (data.type === "nexmax:link-state") {
            onState(data.owner, data.answers, data.attemptId, data.demo);
          }
        });

        function showDone() {
          var list = document.getElementById("doneList");
          while (list.firstChild) list.removeChild(list.firstChild);
          var shown = state.attempt ? state.attempt.answers[0].text.split("　") : filledRows();
          shown.forEach(function (value) {
            if (value === "") return;
            var li = document.createElement("li");
            li.textContent = value;
            list.appendChild(li);
          });
          document.getElementById("rankCard").classList.add("hidden");
          document.getElementById("compareCard").classList.add("hidden");
          document.getElementById("introCard").classList.add("hidden");
          document.getElementById("foot").classList.add("hidden");
          document.getElementById("doneCard").classList.remove("hidden");
          document.getElementById("doneCard").scrollIntoView({ block: "start" });
        }

        function showForm() {
          document.getElementById("doneCard").classList.add("hidden");
          document.getElementById("rankCard").classList.remove("hidden");
          document.getElementById("compareCard").classList.remove("hidden");
          document.getElementById("introCard").classList.remove("hidden");
          document.getElementById("foot").classList.remove("hidden");
          updateNote();
        }

        document.getElementById("submit").addEventListener("click", function () {
          if (!updateNote()) {
            var note = document.getElementById("note");
            note.classList.remove("shake");
            // いったん 外して すぐ 付け直さないと、2回目が 動かない
            void note.offsetWidth;
            note.classList.add("shake");
            goToMissing();
            return;
          }
          /*
           * **べつの タブでは 出せない。** だれが 書いたかを アプリに 聞けない ので、
           * 出した ことに すると、あとで この 端末を 使う 人の 名前で 送られる。
           * 書いた ものは 残る（アプリで 開くと 書きかけと して 出る）。
           */
          if (!inApp) {
            document.getElementById("note").innerHTML = rubyfy(M.outside);
            return;
          }
          if (!confirmed) return;
          state.submitted = true;
          state.editing = false;
          sendAnswers();
          tellApp();
          showDone();
        });

        document.getElementById("edit").addEventListener("click", function () {
          // 直して いる あいだの 欄は まだ 出して いない。閉じても 送らない（`deliver`）
          state.editing = true;
          save();
          showForm();
        });

        /* ---------------- はじめの 画面 ---------------- */

        /*
         * **画面が 立ってから 名乗る。** 名乗りは 親の「おわりました」を
         * 引っこめる＝関門の 鍵を こちらへ 預ける 合図なので、先に 出すと、
         * 描画で こけた とき 学習者は **入力欄も ボタンも 無い 画面**に
         * 取り残される（その先の 8教材が ぜんぶ 閉じたままに なる）。
         */
        renderRows();
        updateNote();
        claimDone();
        if (inApp) {
          /*
           * アプリの 中では **置き場が 決まってから** 見せる（`onState`）。
           * ふつうは 一瞬。返事が 来ない ときも 見せない（`tooSlow`）。
           */
          document.body.setAttribute("data-wait", "");
          setTimeout(tooSlow, 8000);
          hello();
        }
      })();
    </script>
  </body>
</html>
