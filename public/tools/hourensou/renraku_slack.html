<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        /* Base Settings */
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Highlight Animation for Sidebar Update */
        .highlight-update {
            animation: highlight 1s ease-out;
        }

        @keyframes highlight {
            0% {
                background-color: #fef08a;
            }

            /* Yellow-200 */
            100% {
                background-color: white;
            }
        }

        /* Ruby Adjustment */
        ruby {
            font-family: inherit;
            ruby-align: center;
        }

        rt {
            font-size: 0.6em;
            user-select: none;
            color: #64748b;
        }

        /* Vocabulary Tooltip */
        .vocab-term {
            border-bottom: 2px dotted #818cf8;
            cursor: help;
            position: relative;
            transition: background 0.2s;
        }

        .vocab-term:hover {
            background-color: #e0e7ff;
        }

        .vocab-term::after {
            content: attr(data-meaning);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            margin-bottom: 8px;
            z-index: 50;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .vocab-term::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #1e293b;
            opacity: 0;
            margin-bottom: -2px;
            z-index: 50;
            transition: opacity 0.2s;
        }

        .vocab-term:hover::after,
        .vocab-term:hover::before {
            opacity: 1;
        }

        /* Typing Cursor */
        .typing-cursor::after {
            content: '|';
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

            return `<span class="vocab-term" data-meaning="${meaning}">${text}</span>`;
        }

        function stripTags(html) {
            const div = document.createElement("div");
            div.innerHTML = html;

            // <rt>タグ（ふりがな部分）をすべて取得して削除する
            const rts = div.querySelectorAll('rt');
            rts.forEach(rt => rt.remove());

            // 残ったテキスト（漢字のみ）を返す
            return div.innerText;
        }

                return;
            }

            state.currentViewId = channelId;
            updateHeader();
            renderNav();
            renderMessagesForView();

            // Check if correct channel
            const sc = SCENARIOS[state.scenarioIndex];
            if (state.phase === 'channel_nav') {
                if (channelId === sc.targetChannel) {
                    state.phase = 'drafting';
                    renderMessagesForView(); // Show "Drafting started" system msg
                    renderActionArea();
                } else {
                    addSystemMessage(`⚠️ ここは #${channelId} です。指示されたチャンネルは #${sc.targetChannel} です。`);

                    els.actionArea.innerHTML = `<div class="text-slate-500 text-sm text-center flex items-center justify-center gap-2 py-4"><i data-lucide="alert-circle" class="w-4 h-4"></i> #${sc.targetChannel} に戻って入力を続けてください。</div>`;

            if (option.isCorrect) {
                // 正解の選択肢（HTMLタグ付き）を保存
                state.draftLines.push(option.text);

                els.score.innerText = state.score;

                const btn = document.querySelectorAll('#action-area button')[optIdx];

                if (!existingFeedback) {
                    const feedback = document.createElement('div');
                    feedback.className = "feedback-msg text-xs text-red-600 mt-2 font-bold pl-2 animate-pulse";

                    // 【重要】フィードバックはタグありで表示したいので innerHTML を使い、stripTags は使わない
                    feedback.innerHTML = `💡 ${option.feedback}`;

                    btn.appendChild(feedback);
                }
            }
        }

        function updateDraftPreview() {
            const rawHtml = state.draftLines.join('\n\n');
            els.draftText.innerText = stripTags(rawHtml);
        }

        function sendMessage() {
            const fullText = state.draftLines.join('\n\n');
            els.draftArea.classList.add('hidden');
            els.draftText.innerText = "";
            els.actionArea.innerHTML = "";

            // 自分のメッセージを表示
            addMessageUI('You', fullText, 'me');

            setTimeout(() => {
                // ミッション完了のシステムメッセージ
                addSystemMessage(`<span class="text-green-600 font-bold flex items-center gap-1 justify-center"><i data-lucide="check-circle" class="w-4 h-4"></i> Mission Accomplished</span>`);

                // 田中先輩からの通知演出へ
                setTimeout(() => {
                    triggerTanakaNotification();
                }, 1000);
            }, 600);
        }

        function triggerTanakaNotification() {
            state.phase = 'mission_complete';

            // アクションエリアに通知バナーを表示
            renderActionArea();

            // サイドバーの田中先輩に赤丸（通知バッジ）をつけるために再描画
            renderNav();
        }

        function nextScenario() {
            state.scenarioIndex++;
            if (state.scenarioIndex >= SCENARIOS.length) {
                showCompletion();
            } else {
                loadScenario();
            }
        }

        function showCompletion() {
            els.finalScore.innerText = state.score;
            els.completion.classList.remove('hidden');
        }

        function scrollToBottom() {
            setTimeout(() => {
                els.messages.scrollTop = els.messages.scrollHeight;
            }, 50);
        }

        // Start
        init();

    </script>
</body>

</html>
