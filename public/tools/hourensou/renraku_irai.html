<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NexmaxAcademy</title>
    <!--
      いらいの れんらく — エンジン

      文言は renraku_irai.data.js だけに ある。ここは 出しかた だけを 持つ。

      ## れんらくビルダーとの ちがい
      ビルダーは 4つから **えらぶ**。ここは **自分で 書く**（規律3「産出フェーズは
      自由入力」）。引き継いだのは 演出だけ——**✈️送信 → スタンプ → 返信**。

      ## 送る 前に 止めない
      足りない ものが あっても 送れる。送れるが、**スタンプは 来ない**——かわりに
      相手が「何を いつまでに？」と 聞き返す。これは 罰では なく、
      **足りないと 相手が 動けない**ことを 場面の 中で 見せる 形である
      （規律1「分からなかったら 分かったふりを せず 聞き返す」）。

      ## Enter で 送らない
      日本語入力の 確定の Enter は `key === "Enter"` で 来る。送信に つなぐと
      **変換の 途中で 飛ぶ**（2026-08 の 実発生）。送るのは ボタンだけ。
    -->
    <style>
      :root {
        --sky: #0288d1;
        --sky-soft: #e1f2fb;
        --navy: #004f8d;
        --navy-dark: #003c6b;
        --ink: #1f3a56;
        --ink-soft: #5a7089;
        --ink-faint: #9db0c2;
        --line: #dcebf5;
        --leaf: #58c273;
        --sun: #ffc93c;
        --coral: #ff8a70;
        --coral-dark: #f2654a;
        --cream: #fff7e8;
        --paper: #ffffff;
        --radius: 20px;
        --shadow: 0 6px 18px rgba(31, 58, 86, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        color: var(--ink);
        background: linear-gradient(180deg, #d8f0fc 0%, #f4fbff 46%, var(--cream) 100%);
        font-family:
          system-ui,
          -apple-system,
          "Hiragino Kaku Gothic ProN",
          "Noto Sans JP",
          Meiryo,
          sans-serif;
        font-size: 16px;
        line-height: 2;
        -webkit-text-size-adjust: 100%;
      }

      ruby {
        ruby-align: center;
      }

      rt {
        font-size: 0.56em;
        color: var(--ink-soft);
        font-weight: 400;
        line-height: 1.1;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      /* ---------------- 全体の 骨組み ---------------- */

      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .bar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        background: var(--navy);
        color: #fff;
      }

      .bar-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .bar-title {
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1.6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .dots {
        display: flex;
        gap: 6px;
      }

      .dots i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
      }

      .dots i.on {
        background: var(--sun);
      }

      .dots i.done {
        background: var(--leaf);
      }

      .score {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        padding: 2px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        font-size: 0.8rem;
      }

      .score b {
        font-size: 1.05rem;
        font-variant-numeric: tabular-nums;
      }

      .score i {
        font-style: normal;
        font-size: 0.78rem;
        opacity: 0.75;
      }

      /* 減った ことは **色でも** 言う（数字だけだと 気づかない） */
      .score.lost {
        background: rgba(255, 138, 112, 0.35);
      }

      .score.bump {
        animation: bump 0.2s ease-out;
      }

      .main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      /* ---------------- 1枚もの の 画面 ---------------- */

      .sheet {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 20px 16px 32px;
        text-align: center;
      }

      .sheet-inner {
        max-width: 620px;
        margin: 0 auto;
      }

      .hero-icon {
        font-size: 4.4rem;
        line-height: 1.2;
        width: 116px;
        height: 116px;
        margin: 4px auto 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 40%, #ffffff 0%, var(--sky-soft) 100%);
        box-shadow: var(--shadow);
        animation: pop 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.3);
      }

      .sheet h1 {
        margin: 6px 0 2px;
        font-size: 1.35rem;
        color: var(--navy);
        line-height: 1.7;
      }

      .sheet .sub {
        margin: 0 0 14px;
        color: var(--ink-soft);
        font-size: 0.9rem;
      }

      .sheet p {
        margin: 6px 0;
        font-size: 0.98rem;
      }

      .chan {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 14px;
        border-radius: 999px;
        background: var(--sky-soft);
        color: var(--navy);
        font-size: 0.82rem;
        font-weight: 700;
        line-height: 1.9;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 16px;
        padding: 10px 28px;
        border: none;
        border-radius: 999px;
        background: var(--sky);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.9;
        box-shadow: 0 4px 0 #0277b5;
      }

      .btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #0277b5;
      }

      .btn[disabled] {
        background: var(--line);
        color: var(--ink-faint);
        box-shadow: none;
        cursor: not-allowed;
      }

      .btn.ghost {
        background: var(--paper);
        color: var(--navy);
        border: 2px solid var(--line);
        box-shadow: none;
      }

      /* ---------------- 書く 画面 ---------------- */

      .play {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .preview {
        flex: 0 0 auto;
        max-height: 42%;
        overflow-y: auto;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        background: #f7fcff;
      }

      .preview-inner {
        max-width: 620px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .post {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 12px;
        border-radius: 16px;
        background: var(--paper);
      }

      .post.sent {
        border: 2px solid var(--sky-soft);
        background: #fbfeff;
        animation: deliver 0.45s cubic-bezier(0.2, 0.8, 0.3, 1);
      }

      .post.reply {
        border: 2px solid var(--line);
        background: var(--cream);
        animation: flyIn 0.35s cubic-bezier(0.2, 0.8, 0.3, 1);
      }

      .avatar {
        flex: 0 0 auto;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: var(--sky-soft);
        font-size: 1.5rem;
        overflow: hidden;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .post-body {
        flex: 1 1 auto;
        min-width: 0;
      }

      .post-name {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--navy);
        line-height: 1.6;
      }

      .post-text {
        margin-top: 2px;
        font-size: 0.95rem;
        line-height: 1.9;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .reactions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .reaction {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 10px;
        border: 1px solid var(--sky-soft);
        border-radius: 999px;
        background: #f2faff;
        font-size: 1rem;
        line-height: 1.7;
        animation: pop 0.26s cubic-bezier(0.2, 0.9, 0.3, 1.4);
      }

      .reaction b {
        font-size: 0.8rem;
        color: var(--navy);
        font-variant-numeric: tabular-nums;
      }

      .empty {
        color: var(--ink-faint);
        font-size: 0.88rem;
        text-align: center;
        padding: 18px 0;
      }

      .compose {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 14px 14px 28px;
      }

      .compose-inner {
        max-width: 620px;
        margin: 0 auto;
      }

      .scene-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 14px 4px 6px;
        border-radius: 999px;
        background: var(--paper);
        border: 1px solid var(--line);
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--ink-soft);
        line-height: 1.7;
      }

      .scene-chip span {
        font-size: 1.3rem;
      }

      .hint {
        margin: 10px 0 8px;
        padding: 8px 14px;
        border-radius: 14px;
        background: var(--cream);
        border: 1px solid #f3e3c6;
        font-size: 0.9rem;
      }

      textarea {
        width: 100%;
        min-height: 130px;
        padding: 12px 14px;
        border: 2px solid var(--line);
        border-radius: 16px;
        background: var(--paper);
        color: inherit;
        font: inherit;
        font-size: 1rem;
        line-height: 1.9;
        resize: vertical;
      }

      textarea:focus {
        outline: none;
        border-color: var(--sky);
      }

      .checklist {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .checklist li {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 0.9rem;
        line-height: 1.8;
      }

      .checklist .mark {
        flex: 0 0 auto;
        font-size: 1.05rem;
      }

      .checklist li.ng {
        color: var(--coral-dark);
      }

      .checklist li.ok {
        color: var(--ink-soft);
      }

      .result {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 16px;
        border: 2px solid var(--line);
        background: var(--paper);
      }

      .result h2 {
        margin: 0 0 4px;
        font-size: 0.95rem;
        color: var(--navy);
        line-height: 1.7;
      }

      .result .model {
        margin: 4px 0 0;
        padding: 8px 12px;
        border-radius: 12px;
        background: #f7fcff;
        border: 1px dashed var(--sky-soft);
        font-size: 0.95rem;
        line-height: 1.9;
      }

      .result p {
        margin: 8px 0 0;
        font-size: 0.92rem;
      }

      .cert {
        max-width: 460px;
        margin: 8px auto 0;
        padding: 18px 20px;
        border: 3px double var(--navy);
        border-radius: 18px;
        background: linear-gradient(180deg, #ffffff 0%, var(--cream) 100%);
        box-shadow: var(--shadow);
      }

      .cert .cert-title {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--navy);
        line-height: 1.8;
      }

      .cert .cert-lead {
        font-size: 0.9rem;
        color: var(--ink-soft);
      }

      .cert .cert-score {
        margin: 6px 0;
        font-size: 2.4rem;
        font-weight: 700;
        color: var(--sky);
        line-height: 1.3;
        font-variant-numeric: tabular-nums;
      }

      .cert .cert-score small {
        font-size: 1rem;
        color: var(--ink-soft);
      }

      .cert .cert-date {
        margin-top: 8px;
        font-size: 0.82rem;
        color: var(--ink-soft);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      @media (min-width: 900px) {
        .play {
          flex-direction: row;
        }

        .preview {
          flex: 0 0 42%;
          max-width: 520px;
          max-height: none;
          border-bottom: none;
          border-right: 1px solid var(--line);
        }

        .compose {
          flex: 1 1 auto;
          padding: 22px 24px 40px;
        }

        .sheet {
          padding: 32px 24px 40px;
        }
      }

      @keyframes flyIn {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes pop {
        0% {
          opacity: 0;
          transform: scale(0.3);
        }
        70% {
          opacity: 1;
          transform: scale(1.18);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes bump {
        0% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.3);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes deliver {
        0% {
          transform: translateY(16px) scale(0.97);
          box-shadow: 0 0 0 8px rgba(2, 136, 209, 0.22);
        }
        100% {
          transform: none;
          box-shadow: 0 6px 18px rgba(31, 58, 86, 0.1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <div class="bar-left">
          <div class="bar-title" id="barTitle"></div>
          <div class="dots" id="dots"></div>
        </div>
        <div class="score" id="score">
          <span id="scoreLabel"></span><b id="scoreNum">100</b><i id="scoreMax"></i>
        </div>
      </header>
      <main class="main" id="main"></main>
    </div>

    <script src="renraku_irai.data.js"></script>
    <script>
      (function () {
        "use strict";

        var DATA = window.IRAI_DATA;
        var START = (DATA.score && DATA.score.start) || 100;
        var PENALTY = (DATA.score && DATA.score.penalty) || 10;
        var S = { at: 0, score: START, done: {}, doneSent: false, timers: [] };
        var main = document.getElementById("main");
        var elDots = document.getElementById("dots");
        var elScoreNum = document.getElementById("scoreNum");
        var elScore = document.getElementById("score");
        var elScoreMax = document.getElementById("scoreMax");

        /* ---------------- 小さな 道具 ---------------- */

        function esc(text) {
          return String(text == null ? "" : text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        /** {表記|よみ} を <ruby> に する。 */
        function rubyfy(text) {
          return esc(text).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, function (_m, base, yomi) {
            return "<ruby>" + base + "<rt>" + yomi + "</rt></ruby>";
          });
        }

        /** ルビ記法を はずした ただの 文字。 */
        function plain(text) {
          return String(text == null ? "" : text).replace(/\{([^{}|]+)\|[^{}|]+\}/g, "$1");
        }

        function el(tag, cls, text) {
          var node = document.createElement(tag);
          if (cls) node.className = cls;
          if (text != null) node.innerHTML = rubyfy(text);
          return node;
        }

        /**
         * ボタン。**ルビを はずした 名前も 持たせる**——ルビが 入ると
         * `<ruby>送<rt>おく</rt></ruby>る` に なり、読み上げも 自動操作も
         * 「送る」で 引けなく なる（2026-09 実発生）。
         */
        function btnNode(cls, text) {
          var node = el("button", cls, text);
          node.type = "button";
          node.setAttribute("aria-label", plain(text));
          return node;
        }

        function clear(node) {
          while (node.firstChild) node.removeChild(node.firstChild);
        }

        /** あとで 動かす。画面が 変わったら ぜんぶ 捨てる（前の 場面の 続きが 出ない ように）。 */
        function later(fn, ms) {
          S.timers.push(setTimeout(fn, ms));
        }

        function stopTimers() {
          for (var i = 0; i < S.timers.length; i += 1) clearTimeout(S.timers[i]);
          S.timers = [];
        }

        function faceNode(person) {
          var box = el("div", "avatar");
          if (person && person.face) {
            var img = document.createElement("img");
            img.src = person.face;
            img.alt = plain(person.name || "");
            box.appendChild(img);
          } else {
            box.innerHTML = esc((person && person.icon) || "🧑");
          }
          return box;
        }

        function postNode(person, text, kind) {
          var post = el("article", "post " + (kind || ""));
          post.appendChild(faceNode(person));
          var body = el("div", "post-body");
          body.appendChild(el("div", "post-name", person.name || ""));
          var line = el("div", "post-text");
          line.textContent = text;
          body.appendChild(line);
          post.appendChild(body);
          return post;
        }

        /* ---------------- 上の 帯 ---------------- */

        function renderBar(title) {
          document.getElementById("barTitle").innerHTML = rubyfy(title);
          document.getElementById("scoreLabel").innerHTML = rubyfy(DATA.scoreLabel || "");
          elScoreNum.textContent = String(S.score);
          elScoreMax.textContent = "/" + START;
          clear(elDots);
          for (var i = 0; i < DATA.scenarios.length; i += 1) {
            var dot = el("i");
            if (S.done[DATA.scenarios[i].id]) dot.className = "done";
            else if (i === S.at) dot.className = "on";
            elDots.appendChild(dot);
          }
        }

        /** 足りない まま 送った ぶんだけ 減らす（0点より 下には しない）。 */
        function loseScore(points) {
          S.score = Math.max(0, S.score - points);
          elScoreNum.textContent = String(S.score);
          elScore.classList.add("lost");
          elScore.classList.remove("bump");
          void elScore.offsetWidth;
          elScore.classList.add("bump");
        }

        function resetScore() {
          S.score = START;
          S.done = {};
          elScoreNum.textContent = String(S.score);
          elScore.classList.remove("lost");
        }

        /* ---------------- 検査（送る 前に 見る ところ） ---------------- */

        /**
         * 足りない ものを 返す。**中身の 良し悪しは 見ない**——
         * 「その ことばが 入って いるか」だけを 見る（機械に 分かるのは そこまで）。
         */
        function missingOf(text) {
          var body = plain(text);
          var out = [];
          for (var i = 0; i < DATA.checks.length; i += 1) {
            var check = DATA.checks[i];
            var hit = false;
            for (var j = 0; j < check.any.length; j += 1) {
              if (body.indexOf(check.any[j]) >= 0) {
                hit = true;
                break;
              }
            }
            if (!hit && check.digits && /[0-9０-９]/.test(body)) hit = true;
            if (!hit) out.push(check);
          }
          return out;
        }

        /* ---------------- 画面 ---------------- */

        function renderIntro() {
          stopTimers();
          renderBar(DATA.title);
          clear(main);
          var sheet = el("section", "sheet");
          var inner = el("div", "sheet-inner");
          inner.appendChild(el("div", "hero-icon", "📮"));
          inner.appendChild(el("h1", null, DATA.title));
          inner.appendChild(el("p", "sub", DATA.subtitle));
          for (var i = 0; i < DATA.intro.length; i += 1) {
            inner.appendChild(el("p", null, DATA.intro[i]));
          }
          var go = btnNode("btn", "はじめる");
          go.addEventListener("click", function () {
            S.at = 0;
            renderScene();
          });
          inner.appendChild(go);
          sheet.appendChild(inner);
          main.appendChild(sheet);
        }

        function renderScene() {
          stopTimers();
          var sc = DATA.scenarios[S.at];
          renderBar(plain(sc.title));
          clear(main);
          var sheet = el("section", "sheet");
          var inner = el("div", "sheet-inner");
          inner.appendChild(el("div", "hero-icon", sc.icon));
          inner.appendChild(el("h1", null, sc.title));
          inner.appendChild(el("div", "chan", sc.channel));
          for (var i = 0; i < sc.situation.length; i += 1) {
            inner.appendChild(el("p", null, sc.situation[i]));
          }
          var go = btnNode("btn", "✍️ 書く");
          go.addEventListener("click", renderPlay);
          inner.appendChild(go);
          sheet.appendChild(inner);
          main.appendChild(sheet);
        }

        function renderPlay() {
          stopTimers();
          var sc = DATA.scenarios[S.at];
          renderBar(plain(sc.title));
          clear(main);

          var play = el("div", "play");

          /* 左（せまい 画面では 上）— チャンネルの ながれ */
          var preview = el("section", "preview");
          var stream = el("div", "preview-inner");
          stream.appendChild(el("div", "empty", "ここに {送|おく}った {連絡|れんらく}が {出|で}ます。"));
          preview.appendChild(stream);
          play.appendChild(preview);

          /* 右（せまい 画面では 下）— 書く ところ */
          var compose = el("section", "compose");
          var inner = el("div", "compose-inner");

          var chip = el("div", "scene-chip");
          chip.appendChild(el("span", null, sc.icon));
          chip.appendChild(el("b", null, sc.channel));
          inner.appendChild(chip);

          inner.appendChild(el("div", "hint", "💡 " + sc.hint));

          var box = document.createElement("textarea");
          box.setAttribute("aria-label", plain(sc.title));
          box.placeholder = plain("ここに {連絡|れんらく}を {書|か}きます。");
          inner.appendChild(box);

          var list = el("ul", "checklist");
          var rows = [];
          for (var i = 0; i < DATA.checks.length; i += 1) {
            var row = el("li");
            var mark = el("span", "mark", "⬜");
            var label = el("span", null, DATA.checks[i].icon + " " + DATA.checks[i].label);
            row.appendChild(mark);
            row.appendChild(label);
            list.appendChild(row);
            rows.push({ row: row, mark: mark });
          }
          inner.appendChild(list);

          var actions = el("div", "actions");
          var send = btnNode("btn", "✈️ {送|おく}る");
          actions.appendChild(send);
          inner.appendChild(actions);

          var result = el("div", "result");
          result.hidden = true;
          inner.appendChild(result);

          compose.appendChild(inner);
          play.appendChild(compose);
          main.appendChild(play);

          /** 書くたびに 検査の しるしを 塗りなおす（送る 前から 見える）。 */
          function paint() {
            var missing = missingOf(box.value);
            for (var k = 0; k < rows.length; k += 1) {
              var bad = missing.indexOf(DATA.checks[k]) >= 0;
              rows[k].mark.textContent = box.value.trim() === "" ? "⬜" : bad ? "❌" : "⭕";
              rows[k].row.className = box.value.trim() === "" ? "" : bad ? "ng" : "ok";
            }
            send.disabled = box.value.trim() === "";
          }
          box.addEventListener("input", paint);
          paint();

          send.addEventListener("click", function () {
            send.disabled = true;
            box.readOnly = true;
            sendPost(sc, box, stream, result, send);
          });
        }

        /** 送る —— ここが ごほうび。ながれる → スタンプ → 返事。 */
        function sendPost(sc, box, stream, result, send) {
          var missing = missingOf(box.value);
          clear(stream);
          stream.appendChild(postNode(DATA.you, box.value, "sent"));

          var reactions = el("div", "reactions");
          var chips = {};
          stream.lastChild.querySelector(".post-body").appendChild(reactions);

          function addReaction(emoji) {
            if (chips[emoji]) {
              chips[emoji].count += 1;
              chips[emoji].num.textContent = String(chips[emoji].count);
              return;
            }
            var node = el("span", "reaction");
            node.appendChild(el("span", null, emoji));
            var num = el("b", null, "1");
            node.appendChild(num);
            reactions.appendChild(node);
            chips[emoji] = { num: num, count: 1 };
          }

          if (missing.length === 0) {
            var list = sc.reactions || [];
            for (var i = 0; i < list.length; i += 1) {
              (function (emoji, at) {
                later(function () {
                  addReaction(emoji);
                }, 420 + at * 170);
              })(list[i], i);
            }
            later(function () {
              stream.appendChild(postNode(sc.reply, plain(sc.reply.text), "reply"));
              stream.parentNode.scrollTop = stream.parentNode.scrollHeight;
            }, 420 + list.length * 170 + 260);
            later(function () {
              showDone(sc, result, send, box);
            }, 420 + list.length * 170 + 760);
          } else {
            later(function () {
              stream.appendChild(postNode(sc.askBack, plain(sc.askBack.text), "reply"));
              stream.parentNode.scrollTop = stream.parentNode.scrollHeight;
            }, 520);
            later(function () {
              showMissing(sc, result, send, box, missing);
            }, 900);
          }
        }

        /** そろって いた とき。お手本と 見くらべて、つぎへ。 */
        function showDone(sc, result, send, box) {
          S.done[sc.id] = true;
          renderBar(plain(sc.title));
          send.hidden = true;
          clear(result);
          result.hidden = false;
          result.appendChild(el("h2", null, "スタンプが {返|かえ}って きました。{届|とど}いた しるしです。"));
          result.appendChild(el("p", null, "お{手本|てほん}と {見|み}くらべて みましょう。"));
          result.appendChild(el("div", "model", sc.model));
          result.appendChild(el("p", null, sc.after));

          var actions = el("div", "actions");
          var last = S.at >= DATA.scenarios.length - 1;
          var next = btnNode("btn", last ? "おわる" : "つぎへ");
          next.addEventListener("click", function () {
            if (last) {
              renderClosing();
              return;
            }
            S.at += 1;
            renderScene();
          });
          actions.appendChild(next);
          result.appendChild(actions);
          result.scrollIntoView({ block: "nearest" });
          box.readOnly = true;
        }

        /** 足りなかった とき。**何が 無いかを はっきり 言う**（規律1）。 */
        function showMissing(sc, result, send, box, missing) {
          clear(result);
          result.hidden = false;
          loseScore(PENALTY);
          result.appendChild(
            el(
              "h2",
              null,
              "スタンプは {来|き}ませんでした。{相手|あいて}が {聞|き}き{返|かえ}して います。（−" +
                PENALTY +
                "{点|てん}）",
            ),
          );
          var why = el("ul", "checklist");
          for (var i = 0; i < missing.length; i += 1) {
            var row = el("li", "ng");
            row.appendChild(el("span", "mark", "❌"));
            row.appendChild(el("span", null, missing[i].miss));
            why.appendChild(row);
          }
          result.appendChild(why);

          var actions = el("div", "actions");
          var again = btnNode("btn", "✍️ {書|か}きなおす");
          again.addEventListener("click", function () {
            stopTimers();
            result.hidden = true;
            box.readOnly = false;
            send.disabled = false;
            box.focus();
          });
          actions.appendChild(again);
          result.appendChild(actions);
          result.scrollIntoView({ block: "nearest" });
        }

        /** 今日の 日づけ（修了証に 入れる）。 */
        function today() {
          var d = new Date();
          return d.getFullYear() + "{年|ねん}" + (d.getMonth() + 1) + "{月|がつ}" + d.getDate() + "{日|にち}";
        }

        /**
         * おわり。**100点の ときだけ 修了証**を 出す（2026-09-22 の 指定）。
         * 100点で なければ 点数を はっきり 言い、「やりなおす」を 出す（規律1）。
         */
        function renderClosing() {
          stopTimers();
          renderBar(DATA.title);
          clear(main);
          var perfect = S.score >= START;
          var sheet = el("section", "sheet");
          var inner = el("div", "sheet-inner");

          if (perfect) {
            var cert = DATA.certificate;
            inner.appendChild(el("div", "hero-icon", cert.icon));
            var card = el("div", "cert");
            card.appendChild(el("div", "cert-title", cert.title));
            card.appendChild(el("div", "cert-lead", cert.lead));
            var num = el("div", "cert-score");
            // rubyfy() は タグを escape する ので、タグは 外で 組む
            num.innerHTML =
              String(S.score) + '<small>/' + START + rubyfy("{点|てん}") + "</small>";
            card.appendChild(num);
            card.appendChild(el("p", null, cert.body));
            card.appendChild(el("p", null, cert.note));
            card.appendChild(el("div", "cert-date", today()));
            inner.appendChild(card);
            for (var i = 0; i < DATA.closing.lines.length; i += 1) {
              inner.appendChild(el("p", null, DATA.closing.lines[i]));
            }
          } else {
            var again = DATA.retry;
            inner.appendChild(el("div", "hero-icon", again.icon));
            inner.appendChild(el("h1", null, again.title));
            var got = el("div", "cert-score");
            got.innerHTML =
              String(S.score) + '<small>/' + START + rubyfy("{点|てん}") + "</small>";
            inner.appendChild(got);
            inner.appendChild(el("p", null, again.body));
            inner.appendChild(el("p", null, again.note));
          }

          var actions = el("div", "actions");
          var retry = btnNode(perfect ? "btn ghost" : "btn", DATA.retry.button);
          retry.addEventListener("click", function () {
            resetScore();
            S.at = 0;
            renderScene();
          });
          actions.appendChild(retry);
          inner.appendChild(actions);
          sheet.appendChild(inner);
          main.appendChild(sheet);
          tellParentDone();
        }

        function tellParentDone() {
          if (S.doneSent) return;
          S.doneSent = true;
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage(
                { type: "nexmax:link-done", id: DATA.id },
                window.location.origin,
              );
            }
          } catch (_e) {
            /* 埋め込みでなければ 何も しない */
          }
        }

        renderIntro();
      })();
    </script>
  </body>
</html>
