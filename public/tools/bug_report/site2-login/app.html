<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937;background:#fff}
header{padding:14px 22px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}main{padding:22px}
.card{border:1px solid #e5e7eb;border-radius:14px;padding:18px}button{font:inherit;cursor:pointer}.btn{border:0;border-radius:9px;padding:10px 14px;background:#111827;color:white;font-weight:700}
input,select{font:inherit;padding:10px;border:1px solid #cfd5df;border-radius:9px}.muted{color:#667085}

.wrap{max-width:440px;margin:30px auto}label{display:block;font-weight:700;margin:14px 0}label input{display:block;width:100%;margin-top:5px}.pw{display:grid;grid-template-columns:1fr auto;gap:8px}.hidden{display:none}.login{width:100%;margin-top:10px}.dash div{padding:12px;background:#f8fafc;border-radius:9px;margin:8px 0}</style></head>
<body><header><b>Team Portal</b><span>Login</span></header><main><div class="wrap">
<form id="form" class="card"><h2>ログイン</h2><label>Email<input type="email" value="student@example.com" required></label><label>Password<div class="pw"><input id="pw" type="password" value="pass1234" required><button id="show" class="btn">パスワードを<ruby>表示<rt>ひょうじ</rt></ruby></button></div></label><button class="btn login" type="submit">ログイン</button></form>
<section id="dash" class="card hidden"><h2>ログインしました</h2><div class="dash"><div>📁 プロジェクト</div><div>📅 スケジュール</div><div>💬 メッセージ</div></div><button id="logout" class="btn">ログアウト</button></section>
</div></main><script>
const form=document.getElementById('form'),dash=document.getElementById('dash'),pw=document.getElementById('pw'),show=document.getElementById('show');
show.onclick=()=>{pw.type=pw.type==='password'?'text':'password';show.innerHTML=pw.type==='password'?'パスワードを<ruby>表示<rt>ひょうじ</rt></ruby>':'パスワードを<ruby>隠<rt>かく</rt></ruby>す';};
form.onsubmit=e=>{e.preventDefault();form.classList.add('hidden');dash.classList.remove('hidden');};
logout.onclick=()=>{dash.classList.add('hidden');form.classList.remove('hidden');};
</script></body></html>
