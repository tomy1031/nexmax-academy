<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937;background:#fff}
header{padding:14px 22px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
main{padding:22px}.card{border:1px solid #e5e7eb;border-radius:14px;padding:18px}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:9px;padding:10px 14px;background:#111827;color:white;font-weight:700}
input,select,textarea{font:inherit;padding:10px;border:1px solid #cfd5df;border-radius:9px}.muted{color:#667085}

.wrap{max-width:620px;margin:24px auto}.summary{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#f8fafc;border-radius:11px;margin-bottom:14px}
.count{font-size:26px;font-weight:800}.task{display:flex;align-items:center;gap:12px;padding:14px 5px;border-bottom:1px solid #eee}
.task input{width:20px;height:20px}.task.done span{text-decoration:line-through;color:#98a2b3}
</style></head><body>
<header><b>TaskBoard</b><span><ruby>今日<rt>きょう</rt></ruby>のタスク</span></header>
<main><div class="wrap card"><h2><ruby>今日<rt>きょう</rt></ruby>の タスク</h2>
<div class="summary"><span>タスク</span><span class="count" id="openCount">3</span></div>
<div id="tasks">
<label class="task"><input type="checkbox"><span><ruby>朝礼<rt>ちょうれい</rt></ruby>の <ruby>資料<rt>しりょう</rt></ruby>を <ruby>作<rt>つく</rt></ruby>る</span></label>
<label class="task"><input type="checkbox"><span><ruby>商品<rt>しょうひん</rt></ruby>ページを <ruby>確認<rt>かくにん</rt></ruby>する</span></label>
<label class="task"><input type="checkbox"><span>お<ruby>客様<rt>きゃくさま</rt></ruby>に メールを <ruby>送<rt>おく</rt></ruby>る</span></label>
</div></div></main>
<script>
let count=3;
document.querySelectorAll('.task input').forEach(cb=>{
  cb.onchange=()=>{
    const row=cb.closest('.task');
    row.classList.toggle('done',cb.checked);
    count=count-1;
    openCount.textContent=count;
  };
});
</script></body></html>
