<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937;background:#fff}
header{padding:14px 22px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
main{padding:22px}.card{border:1px solid #e5e7eb;border-radius:14px;padding:18px}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:9px;padding:10px 14px;background:#111827;color:white;font-weight:700}
input,select,textarea{font:inherit;padding:10px;border:1px solid #cfd5df;border-radius:9px}.muted{color:#667085}

.wrap{max-width:620px;margin:24px auto}.profile{display:flex;align-items:center;gap:15px;padding:16px;background:#f8fafc;border-radius:12px;margin-bottom:18px}
.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#e5e7eb;font-size:28px}
label{display:block;font-weight:700;margin:14px 0}label input,label textarea{display:block;width:100%;margin-top:6px}textarea{min-height:90px}
.status{margin-top:12px;padding:10px;background:#ecfdf3;border-radius:9px;display:none}
</style></head><body>
<header><b>MyProfile</b><span>プロフィール</span></header>
<main><div class="wrap card">
<div class="profile"><div class="avatar">👤</div><div><h2 id="displayName" style="margin:0">Sokha</h2><p id="displayBio" class="muted" style="margin:3px 0">Web development student</p></div></div>
<h3>プロフィールを <ruby>編集<rt>へんしゅう</rt></ruby></h3>
<label><ruby>名前<rt>なまえ</rt></ruby><input id="name" value="Sokha"></label>
<label><ruby>自己紹介<rt>じこしょうかい</rt></ruby><textarea id="bio">Web development student</textarea></label>
<button id="save" class="btn"><ruby>保存<rt>ほぞん</rt></ruby>する</button>
<div id="status" class="status"><ruby>保存<rt>ほぞん</rt></ruby>しました。</div>
</div></main>
<script>
// status は window.status（組み込みの 文字列）に なるので、id で 引く
const status=document.getElementById('status');
save.onclick=()=>{
  displayBio.textContent=bio.value;
  status.style.display='block';
};
</script></body></html>
