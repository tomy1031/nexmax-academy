<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937;background:#fff}
header{padding:14px 22px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
main{padding:22px}.card{border:1px solid #e5e7eb;border-radius:14px;padding:18px}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:9px;padding:10px 14px;background:#111827;color:white;font-weight:700}
input,select,textarea{font:inherit;padding:10px;border:1px solid #cfd5df;border-radius:9px}.muted{color:#667085}
::placeholder{color:#636a75;opacity:1}

.wrap{max-width:520px;margin:26px auto}label{display:block;font-weight:700;margin:14px 0}
label input,label textarea{display:block;width:100%;margin-top:6px}textarea{min-height:110px;resize:vertical}
.btn{width:100%;margin-top:10px}.status{margin-top:14px;padding:11px;background:#f8fafc;border-radius:9px}
</style></head><body>
<header><b>NextMake Support</b><span>お<ruby>問<rt>と</rt></ruby>い<ruby>合<rt>あ</rt></ruby>わせ</span></header>
<main><div class="wrap card"><h2>お<ruby>問<rt>と</rt></ruby>い<ruby>合<rt>あ</rt></ruby>わせ</h2>
<label><ruby>名前<rt>なまえ</rt></ruby><input id="name" placeholder="名前を入力"></label>
<label>メールアドレス<input id="email" type="email" placeholder="example@email.com"></label>
<label>メッセージ<textarea id="message" placeholder="メッセージを入力"></textarea></label>
<button id="send" class="btn"><ruby>送信<rt>そうしん</rt></ruby>する</button>
<div id="status" class="status">まだ <ruby>送信<rt>そうしん</rt></ruby>していません。</div>
</div></main>
<script>
// status は window.status（組み込みの 文字列）に なるので、id で 引く
const status=document.getElementById('status');
send.onclick=()=>{
  if(!message.value.trim()){status.innerHTML='メッセージを <ruby>入<rt>い</rt></ruby>れてください。';return;}
  status.innerHTML='<ruby>送信<rt>そうしん</rt></ruby>しました。ありがとうございました。';
};
</script></body></html>
